</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit.</text>
<text x="18" y="568" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="568" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="586" font-size="12" fill="#111318">inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">Block back on the first defender to the</text>
<text x="52" y="620" font-size="12" fill="#111318">backside. Nobody crosses your face.</text>
<text x="18" y="636" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="636" font-size="12" fill="#111318">Block the nose. Do not let him cross your face</text>
<text x="52" y="654" font-size="12" fill="#111318">to the playside.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">PULL RIGHT. Stay flat behind the line and kick</text>
<text x="52" y="688" font-size="12" fill="#111318">out the first defender outside our playside</text>
<text x="52" y="704" font-size="12" fill="#111318">end.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="385" y="568" font-size="12" fill="#111318">The man outside you is being kicked out.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="586" font-size="12" fill="#111318">Run the sweep path the other way at full speed</text>
<text x="385" y="602" font-size="12" fill="#111318">with your arms tucked like you have the ball.</text>
<text x="385" y="620" font-size="12" fill="#111318">Sell it all the way to the sideline.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="636" font-size="12" fill="#111318">Step down inside and block the playside</text>
<text x="385" y="654" font-size="12" fill="#111318">linebacker. Take the first jersey that shows.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="670" font-size="12" fill="#111318">Take the snap, fake the toss the other way</text>
<text x="385" y="688" font-size="12" fill="#111318">with both hands, then turn back and hand the</text>
<text x="385" y="704" font-size="12" fill="#111318">ball to the fullback. Sell the fake first —</text>
<text x="385" y="722" font-size="12" fill="#111318">the handoff is late on purpose.</text>
<text x="351" y="738" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="738" font-size="12" fill="#111318">Take one hard step with the fake, then plant</text>
<text x="385" y="756" font-size="12" fill="#111318">and run to daylight off the playside end's</text>
<text x="385" y="772" font-size="12" fill="#111318">outside hip. That first step is what freezes</text>
<text x="385" y="790" font-size="12" fill="#111318">the linebackers.</text>
<line x1="18" y1="796" x2="684" y2="796" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="814" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="834" font-size="12" fill="#111318">Do not call this in the first quarter. It needs the sweep on film first — run jet or power three or</text>
<text x="18" y="852" font-size="12" fill="#111318">four times, then counter.</text>
<text x="18" y="868" font-size="12" fill="#111318">The fullback's counter step has to be a real step, not a shuffle. If he cheats it, the linebackers</text>
<text x="18" y="886" font-size="12" fill="#111318">never bite.</text>
<text x="18" y="902" font-size="12" fill="#111318">The wing running the fake must go all the way. Coaches see the ball; kids see the fastest player. So</text>
<text x="18" y="920" font-size="12" fill="#111318">do linebackers.</text>
<text x="18" y="936" font-size="12" fill="#111318">If their linebackers stop chasing the sweep, stop calling the counter and go back to power.</text>
</svg>