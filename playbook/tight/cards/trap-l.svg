</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="568" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="568" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="586" font-size="12" fill="#111318">Do not touch the man over you — he is the one</text>
<text x="52" y="602" font-size="12" fill="#111318">we are trapping. Step around him and go get</text>
<text x="52" y="620" font-size="12" fill="#111318">the linebacker.</text>
<text x="18" y="636" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="636" font-size="12" fill="#111318">Block back on the first defender to the</text>
<text x="52" y="654" font-size="12" fill="#111318">backside. If nobody shows, climb to the</text>
<text x="52" y="670" font-size="12" fill="#111318">backside linebacker.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">PULL LEFT. Stay flat and tight to the line.</text>
<text x="52" y="704" font-size="12" fill="#111318">Trap the first defender past the center — kick</text>
<text x="52" y="722" font-size="12" fill="#111318">him out with your playside shoulder.</text>
<text x="18" y="738" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="738" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="756" font-size="12" fill="#111318">inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. Nobody chases</text>
<text x="385" y="568" font-size="12" fill="#111318">this from behind.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="586" font-size="12" fill="#111318">Release outside and block the deepest defender</text>
<text x="385" y="602" font-size="12" fill="#111318">on your side. Run left at his outside number.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="620" font-size="12" fill="#111318">Sprint flat behind the line and sell the sweep</text>
<text x="385" y="636" font-size="12" fill="#111318">to the backside.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="654" font-size="12" fill="#111318">Open to the playside and hand the ball to the</text>
<text x="385" y="670" font-size="12" fill="#111318">fullback at two yards. Keep the fake going</text>
<text x="385" y="688" font-size="12" fill="#111318">wide — do not stand and watch.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="704" font-size="12" fill="#111318">Aim just outside the center. Take the handoff,</text>
<text x="385" y="722" font-size="12" fill="#111318">stay tight, and run inside the trap block. Get</text>
<text x="385" y="738" font-size="12" fill="#111318">downhill — do not dance.</text>
<line x1="18" y1="762" x2="684" y2="762" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="780" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="800" font-size="12" fill="#111318">The trapped defender must be right completely alone. If our guard even brushes him he will not run</text>
<text x="18" y="818" font-size="12" fill="#111318">upfield, and the trap block misses.</text>
<text x="18" y="834" font-size="12" fill="#111318">The pulling guard stays flat and low. If he bellies back he arrives late and the fullback runs into</text>
<text x="18" y="852" font-size="12" fill="#111318">his back.</text>
<text x="18" y="868" font-size="12" fill="#111318">Call this when their inside linemen are getting up the field fast. If they sit and read, run power</text>
<text x="18" y="886" font-size="12" fill="#111318">instead.</text>
<text x="18" y="902" font-size="12" fill="#111318">The fullback goes inside the trap block, never outside it. Walk him through it at half speed until</text>
<text x="18" y="920" font-size="12" fill="#111318">it is automatic.</text>
</svg>