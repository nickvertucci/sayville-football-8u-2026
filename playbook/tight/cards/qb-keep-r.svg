</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit.</text>
<text x="18" y="568" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="568" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="586" font-size="12" fill="#111318">inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">PULL RIGHT and wrap up through the hole. Block</text>
<text x="52" y="620" font-size="12" fill="#111318">the first wrong-colored jersey inside the</text>
<text x="52" y="636" font-size="12" fill="#111318">kick-out.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Block back on the backside gap.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">Block the man over you. If nobody is over you,</text>
<text x="52" y="688" font-size="12" fill="#111318">help the center and climb to the linebacker.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="351" y="568" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="568" font-size="12" fill="#111318">Sprint flat behind the line and sell the sweep</text>
<text x="385" y="586" font-size="12" fill="#111318">to the backside.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="602" font-size="12" fill="#111318">Take one hard step like you are catching the</text>
<text x="385" y="620" font-size="12" fill="#111318">toss, then turn and block the widest defender</text>
<text x="385" y="636" font-size="12" fill="#111318">on your side.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="654" font-size="12" fill="#111318">Reverse pivot and fake the toss with both</text>
<text x="385" y="670" font-size="12" fill="#111318">hands, then hide the ball on your hip and run</text>
<text x="385" y="688" font-size="12" fill="#111318">wide around the end. Get to the corner before</text>
<text x="385" y="704" font-size="12" fill="#111318">you turn up.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="722" font-size="12" fill="#111318">Kick out the first defender outside our end,</text>
<text x="385" y="738" font-size="12" fill="#111318">same as power. Nothing changes for you.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">Everything except the quarterback and the playside wing is identical to power. That is the point —</text>
<text x="18" y="800" font-size="12" fill="#111318">they should not be able to tell until it is too late.</text>
<text x="18" y="818" font-size="12" fill="#111318">The fake has to be a real toss motion with both hands. A lazy fake and the outside defender never</text>
<text x="18" y="834" font-size="12" fill="#111318">leaves.</text>
<text x="18" y="852" font-size="12" fill="#111318">Save this one. Call it the series after their end has blown up two powers in a row.</text>
<text x="18" y="868" font-size="12" fill="#111318">The quarterback gets down or out of bounds. We are not trading our quarterback for four yards.</text>
</svg>