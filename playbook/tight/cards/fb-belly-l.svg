</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block the man over you or the first defender</text>
<text x="52" y="568" font-size="12" fill="#111318">outside, and drive him out. Widen the hole.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block the man over you and turn him to the</text>
<text x="52" y="602" font-size="12" fill="#111318">inside. The hole is left off your outside hip.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Help the center for one count, then climb to</text>
<text x="52" y="636" font-size="12" fill="#111318">the middle linebacker.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Block the man over you. Get your head across</text>
<text x="52" y="670" font-size="12" fill="#111318">to the playside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Block the first defender on or inside you.</text>
<text x="52" y="704" font-size="12" fill="#111318">Nobody crosses your face.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="738" font-size="12" fill="#111318">inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit.</text>
<text x="351" y="568" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="568" font-size="12" fill="#111318">Step down inside and seal the playside</text>
<text x="385" y="586" font-size="12" fill="#111318">linebacker. Take the first jersey that shows.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="602" font-size="12" fill="#111318">Sprint flat behind the line and sell the sweep</text>
<text x="385" y="620" font-size="12" fill="#111318">to the backside.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="636" font-size="12" fill="#111318">Open to the playside, ride the fullback one</text>
<text x="385" y="654" font-size="12" fill="#111318">step and hand it off at two yards. Then keep</text>
<text x="385" y="670" font-size="12" fill="#111318">running wide like you have it.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="688" font-size="12" fill="#111318">Aim at the outside hip of the playside tackle.</text>
<text x="385" y="704" font-size="12" fill="#111318">Take the ball and get north — this is a</text>
<text x="385" y="722" font-size="12" fill="#111318">downhill run, not a read.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">This play beats you to the spot. The fullback should hit the line before the pulling guard on power</text>
<text x="18" y="800" font-size="12" fill="#111318">would have even cleared the center.</text>
<text x="18" y="818" font-size="12" fill="#111318">No pullers means no waiting. If the fullback hesitates, run power instead.</text>
<text x="18" y="834" font-size="12" fill="#111318">The quarterback's fake going wide is what holds the outside defender. Make him finish it every rep.</text>
<text x="18" y="852" font-size="12" fill="#111318">Good change-up after two or three powers in a row — same backfield look for the first half second.</text>
</svg>