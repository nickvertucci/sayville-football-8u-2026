</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Reach the man over you. If you cannot reach</text>
<text x="52" y="568" font-size="12" fill="#111318">him, turn him inside and let the ball go</text>
<text x="52" y="586" font-size="12" fill="#111318">around.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="602" font-size="12" fill="#111318">Reach block the man on or outside you. If you</text>
<text x="52" y="620" font-size="12" fill="#111318">cannot reach him, run him past the play and</text>
<text x="52" y="636" font-size="12" fill="#111318">wall him off.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="654" font-size="12" fill="#111318">Reach the first defender to the playside. Get</text>
<text x="52" y="670" font-size="12" fill="#111318">your head across his outside shoulder.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="688" font-size="12" fill="#111318">Reach the man over you. If nobody is over you,</text>
<text x="52" y="704" font-size="12" fill="#111318">cut off the backside gap.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="722" font-size="12" fill="#111318">Block back and cut off the first defender to</text>
<text x="52" y="738" font-size="12" fill="#111318">the backside.</text>
<text x="18" y="756" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="756" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="772" font-size="12" fill="#111318">inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back, then chase down the line. You are</text>
<text x="385" y="568" font-size="12" fill="#111318">the last one to the ball — never quit on this</text>
<text x="385" y="586" font-size="12" fill="#111318">play.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="602" font-size="12" fill="#111318">Block the deepest defender on your side. Run</text>
<text x="385" y="620" font-size="12" fill="#111318">left at his outside number and screen him from</text>
<text x="385" y="636" font-size="12" fill="#111318">the ball.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="654" font-size="12" fill="#111318">Start in full-speed motion on the coach's</text>
<text x="385" y="670" font-size="12" fill="#111318">signal. Take the handoff on the run without</text>
<text x="385" y="688" font-size="12" fill="#111318">slowing down and get to the corner. If it is</text>
<text x="385" y="704" font-size="12" fill="#111318">not there, turn up — never stop your feet.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="722" font-size="12" fill="#111318">Take the snap and put the ball in the wing's</text>
<text x="385" y="738" font-size="12" fill="#111318">belly as he crosses. Do not reach for him —</text>
<text x="385" y="756" font-size="12" fill="#111318">let him come to you. Then boot away and sell</text>
<text x="385" y="772" font-size="12" fill="#111318">it.</text>
<text x="351" y="790" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="790" font-size="12" fill="#111318">Attack the first defender outside the playside</text>
<text x="385" y="806" font-size="12" fill="#111318">end and kick him out. Get there fast — the</text>
<text x="385" y="824" font-size="12" fill="#111318">ball is coming left now.</text>
<line x1="18" y1="830" x2="684" y2="830" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="848" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="868" font-size="12" fill="#111318">Motion timing is the whole play. The wing should be at full speed and just past the quarterback when</text>
<text x="18" y="886" font-size="12" fill="#111318">the ball is snapped — practice the timing separately from the blocking.</text>
<text x="18" y="902" font-size="12" fill="#111318">The quarterback never reaches out. He holds the ball still and the wing runs through it.</text>
<text x="18" y="920" font-size="12" fill="#111318">If the wing slows down to take the handoff, this play is dead. Better to have a fumble in practice</text>
<text x="18" y="936" font-size="12" fill="#111318">than a jog.</text>
<text x="18" y="954" font-size="12" fill="#111318">Watch your league's motion rules — only one player in motion and he must be moving parallel to the</text>
<text x="18" y="970" font-size="12" fill="#111318">line, not forward.</text>
</svg>