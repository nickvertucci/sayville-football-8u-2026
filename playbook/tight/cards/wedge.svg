</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Close down to the tackle's hip, shoulder to</text>
<text x="52" y="568" font-size="12" fill="#111318">shoulder. No daylight between you.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Close down to the guard's hip, shoulder to</text>
<text x="52" y="602" font-size="12" fill="#111318">shoulder.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Close down to the center's hip, shoulder to</text>
<text x="52" y="636" font-size="12" fill="#111318">shoulder. Get a hand on the center's back and</text>
<text x="52" y="654" font-size="12" fill="#111318">stay attached.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="670" font-size="12" fill="#111318">Snap it, then fire out low into whoever is</text>
<text x="52" y="688" font-size="12" fill="#111318">closest. You are the point of the wedge — stay</text>
<text x="52" y="704" font-size="12" fill="#111318">low and keep your feet moving.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="722" font-size="12" fill="#111318">Close down to the center's hip, shoulder to</text>
<text x="52" y="738" font-size="12" fill="#111318">shoulder. Get a hand on the center's back and</text>
<text x="52" y="756" font-size="12" fill="#111318">stay attached.</text>
<text x="18" y="772" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="772" font-size="12" fill="#111318">Close down to the guard's hip, shoulder to</text>
<text x="52" y="790" font-size="12" fill="#111318">shoulder.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Close down to the tackle's hip, shoulder to</text>
<text x="385" y="568" font-size="12" fill="#111318">shoulder. No daylight between you.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="586" font-size="12" fill="#111318">Step to the end's hip and push the back of the</text>
<text x="385" y="602" font-size="12" fill="#111318">wedge. Never run around it.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="620" font-size="12" fill="#111318">Step to the end's hip and push the back of the</text>
<text x="385" y="636" font-size="12" fill="#111318">wedge. Never run around it.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="654" font-size="12" fill="#111318">Take the snap, turn and hand the ball to the</text>
<text x="385" y="670" font-size="12" fill="#111318">fullback at two yards, then get on the back of</text>
<text x="385" y="688" font-size="12" fill="#111318">the wedge and push.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="704" font-size="12" fill="#111318">Two hands out, take the handoff and put your</text>
<text x="385" y="722" font-size="12" fill="#111318">shoulder into the middle of the wedge. Keep</text>
<text x="385" y="738" font-size="12" fill="#111318">your feet moving until the whistle.</text>
<line x1="18" y1="796" x2="684" y2="796" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="814" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="834" font-size="12" fill="#111318">The wedge only works if there are no gaps in it. Practice it standing still first, hip to hip,</text>
<text x="18" y="852" font-size="12" fill="#111318">before anyone runs.</text>
<text x="18" y="868" font-size="12" fill="#111318">The fullback does not pick a hole. He runs into the back of the wedge and lets it move him.</text>
<text x="18" y="886" font-size="12" fill="#111318">If the wedge stops moving, the play is over. Teach the linemen to keep churning their feet after</text>
<text x="18" y="902" font-size="12" fill="#111318">contact.</text>
<text x="18" y="920" font-size="12" fill="#111318">This is our short-yardage and goal-line play. Do not save it for emergencies — run it early so they</text>
<text x="18" y="936" font-size="12" fill="#111318">have to respect it.</text>
</svg>