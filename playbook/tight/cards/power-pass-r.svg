</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block the first defender outside you. Nobody</text>
<text x="52" y="568" font-size="12" fill="#111318">comes free off the backside edge.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Fire out at the man over you, then keep him in</text>
<text x="52" y="602" font-size="12" fill="#111318">front of you. Do not let him cross your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Fire out at the man over you, then keep him in</text>
<text x="52" y="636" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Snap and block the man over you. If nobody is</text>
<text x="52" y="670" font-size="12" fill="#111318">over you, help to the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="704" font-size="12" fill="#111318">front. Aggressive — this looks like run</text>
<text x="52" y="722" font-size="12" fill="#111318">blocking.</text>
<text x="18" y="738" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="738" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="756" font-size="12" fill="#111318">front. Aggressive — this looks like run</text>
<text x="52" y="772" font-size="12" fill="#111318">blocking.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Release outside, run eight yards, then break</text>
<text x="385" y="568" font-size="12" fill="#111318">for the flag. Look for the ball over your</text>
<text x="385" y="586" font-size="12" fill="#111318">inside shoulder.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="602" font-size="12" fill="#111318">Cross behind the line and settle five yards</text>
<text x="385" y="620" font-size="12" fill="#111318">deep over the middle. You are the check-down —</text>
<text x="385" y="636" font-size="12" fill="#111318">face the quarterback and be ready.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="654" font-size="12" fill="#111318">Sell the power fake for one step, then release</text>
<text x="385" y="670" font-size="12" fill="#111318">into the flat at three yards. Turn and look</text>
<text x="385" y="688" font-size="12" fill="#111318">for the ball right away.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="704" font-size="12" fill="#111318">Fake the toss, then roll to the playside. Look</text>
<text x="385" y="722" font-size="12" fill="#111318">for the corner route first, the flat second.</text>
<text x="385" y="738" font-size="12" fill="#111318">If neither is there, tuck it and run — do not</text>
<text x="385" y="756" font-size="12" fill="#111318">throw across your body.</text>
<text x="351" y="772" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="772" font-size="12" fill="#111318">Run the kick-out path exactly like power and</text>
<text x="385" y="790" font-size="12" fill="#111318">block the first defender outside our end. Do</text>
<text x="385" y="806" font-size="12" fill="#111318">not release — you are protection.</text>
<line x1="18" y1="814" x2="684" y2="814" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="832" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="852" font-size="12" fill="#111318">This is a run play with one throw attached. If the fake is not good enough to fool the coaches on</text>
<text x="18" y="868" font-size="12" fill="#111318">the sideline, it will not fool the safety.</text>
<text x="18" y="886" font-size="12" fill="#111318">The linemen block this like a run — fire out low. At this age nobody calls holding on a pass that</text>
<text x="18" y="902" font-size="12" fill="#111318">looks like power.</text>
<text x="18" y="920" font-size="12" fill="#111318">Only two reads and then run. Never let the quarterback stand there hunting for a third option.</text>
<text x="18" y="936" font-size="12" fill="#111318">Best call on first down after a long power run, not on third and eight.</text>
</svg>