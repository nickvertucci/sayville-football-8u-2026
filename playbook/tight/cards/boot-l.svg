</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Release across and settle at eight yards on</text>
<text x="52" y="568" font-size="12" fill="#111318">the boot side. Find the open grass and show</text>
<text x="52" y="586" font-size="12" fill="#111318">your hands.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="602" font-size="12" fill="#111318">Hinge and protect the boot side. Nobody comes</text>
<text x="52" y="620" font-size="12" fill="#111318">free outside you — the quarterback is alone</text>
<text x="52" y="636" font-size="12" fill="#111318">back there.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="654" font-size="12" fill="#111318">PULL RIGHT and run the power path to sell the</text>
<text x="52" y="670" font-size="12" fill="#111318">fake. You are a decoy — take their linebacker</text>
<text x="52" y="688" font-size="12" fill="#111318">with you.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="704" font-size="12" fill="#111318">Block back toward the boot side. Nobody chases</text>
<text x="52" y="722" font-size="12" fill="#111318">through the middle.</text>
<text x="18" y="738" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="738" font-size="12" fill="#111318">Block the man over you and drive him away from</text>
<text x="52" y="756" font-size="12" fill="#111318">the boot.</text>
<text x="18" y="772" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="772" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block down on the first defender inside you</text>
<text x="385" y="568" font-size="12" fill="#111318">and sell the run. This has to look exactly</text>
<text x="385" y="586" font-size="12" fill="#111318">like the sweep.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="602" font-size="12" fill="#111318">Get to the flat at four yards on the boot side</text>
<text x="385" y="620" font-size="12" fill="#111318">and stay in front of the quarterback. You are</text>
<text x="385" y="636" font-size="12" fill="#111318">the easy throw.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="654" font-size="12" fill="#111318">Take the fake and run the full sweep path away</text>
<text x="385" y="670" font-size="12" fill="#111318">from the boot at full speed. Arms tucked like</text>
<text x="385" y="688" font-size="12" fill="#111318">you have the ball.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="704" font-size="12" fill="#111318">Fake the sweep with both hands, hide the ball</text>
<text x="385" y="722" font-size="12" fill="#111318">on your back hip, and get to the edge. Run it</text>
<text x="385" y="738" font-size="12" fill="#111318">if it is open. Only throw if a defender comes</text>
<text x="385" y="756" font-size="12" fill="#111318">up to take you.</text>
<text x="351" y="772" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="772" font-size="12" fill="#111318">Run the kick-out path away from the boot and</text>
<text x="385" y="790" font-size="12" fill="#111318">block whatever shows. Sell the sweep.</text>
<line x1="18" y1="796" x2="684" y2="796" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="814" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="834" font-size="12" fill="#111318">Run first. At this age the quarterback will usually walk into ten yards before anybody finds him —</text>
<text x="18" y="852" font-size="12" fill="#111318">teach him to look for grass, not for a receiver.</text>
<text x="18" y="868" font-size="12" fill="#111318">The ball goes on the back hip, away from the defense. Kids want to carry it out front where everyone</text>
<text x="18" y="886" font-size="12" fill="#111318">can see it.</text>
<text x="18" y="902" font-size="12" fill="#111318">If the backside end does not block down and sell it, their end sees the quarterback immediately and</text>
<text x="18" y="920" font-size="12" fill="#111318">this play loses eight yards.</text>
<text x="18" y="936" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>