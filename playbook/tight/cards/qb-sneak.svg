<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Fire out into the man over you and drive him</text>
<text x="52" y="568" font-size="12" fill="#111318">off the ball. If nobody is over you, close</text>
<text x="52" y="586" font-size="12" fill="#111318">down inside.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="602" font-size="12" fill="#111318">Fire out into the man over you and drive him</text>
<text x="52" y="620" font-size="12" fill="#111318">off the ball.</text>
<text x="18" y="636" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="636" font-size="12" fill="#111318">Fire out low into the man over you. Do not</text>
<text x="52" y="654" font-size="12" fill="#111318">give one inch of ground.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="670" font-size="12" fill="#111318">Snap and fire out straight ahead, pads under</text>
<text x="52" y="688" font-size="12" fill="#111318">his pads. Everything depends on you.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="704" font-size="12" fill="#111318">Fire out low into the man over you. Do not</text>
<text x="52" y="722" font-size="12" fill="#111318">give one inch of ground.</text>
<text x="18" y="738" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="738" font-size="12" fill="#111318">Fire out into the man over you and drive him</text>
<text x="52" y="756" font-size="12" fill="#111318">off the ball.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Fire out into the man over you and drive him</text>
<text x="385" y="568" font-size="12" fill="#111318">off the ball. If nobody is over you, close</text>
<text x="385" y="586" font-size="12" fill="#111318">down inside.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">LW</text>
<text x="385" y="602" font-size="12" fill="#111318">Step up behind the end and push the pile. Do</text>
<text x="385" y="620" font-size="12" fill="#111318">not go around.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">RW</text>
<text x="385" y="636" font-size="12" fill="#111318">Step up behind the end and push the pile. Do</text>
<text x="385" y="654" font-size="12" fill="#111318">not go around.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="670" font-size="12" fill="#111318">Snap count only. Get under the center, keep</text>
<text x="385" y="688" font-size="12" fill="#111318">the ball, and drive forward behind him. Do not</text>
<text x="385" y="704" font-size="12" fill="#111318">stand up and do not bounce it outside.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="722" font-size="12" fill="#111318">Lead straight up the middle and push the</text>
<text x="385" y="738" font-size="12" fill="#111318">quarterback forward. You are the second wave.</text>
<line x1="18" y1="762" x2="684" y2="762" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="780" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="800" font-size="12" fill="#111318">Vary the snap count all game so this one is not a surprise when you need it.</text>
<text x="18" y="818" font-size="12" fill="#111318">The quarterback stays low. Standing up turns a first down into a one-yard loss.</text>
<text x="18" y="834" font-size="12" fill="#111318">Never bounce this outside. If it is stuffed, it is stuffed — take the pile forward.</text>
<text x="18" y="852" font-size="12" fill="#111318">Run it on second and one occasionally so it is not obvious on fourth and one.</text>
</svg>