<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Turn him inside. The ball goes around</text>
<text x="52" y="612" font-size="12" fill="#111318">behind you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the defensive guard,</text>
<text x="52" y="646" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="664" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Defensive guard head up on you. Step</text>
<text x="52" y="698" font-size="12" fill="#111318">past him. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Defensive guard head up on you. Cut him</text>
<text x="52" y="782" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Defensive end on your outside shoulder.</text>
<text x="52" y="816" font-size="12" fill="#111318">Cut him off — get between him and the</text>
<text x="52" y="834" font-size="12" fill="#111318">ball.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion.</text>
<text x="344" y="596" font-size="12" fill="#111318">At the snap run flat behind the</text>
<text x="344" y="612" font-size="12" fill="#111318">quarterback, take the handoff at full</text>
<text x="344" y="630" font-size="12" fill="#111318">speed and get to the left edge. Turn up</text>
<text x="344" y="646" font-size="12" fill="#111318">outside the trips.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="664" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="680" font-size="12" fill="#111318">Stay in his way.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="698" font-size="12" fill="#111318">Open left and hand the ball to the</text>
<text x="344" y="714" font-size="12" fill="#111318">right tight end as he comes across</text>
<text x="344" y="732" font-size="12" fill="#111318">behind you, then fake a run to the</text>
<text x="344" y="748" font-size="12" fill="#111318">right.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="766" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="782" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="800" font-size="12" fill="#111318">linebacker.</text>
<text x="310" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="816" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="834" font-size="12" fill="#111318">Stay in his way.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance.</text>
<text x="18" y="896" font-size="12" fill="#111318">He turns up outside the trips. The fullback takes the force man; the slot screens.</text>
</svg>