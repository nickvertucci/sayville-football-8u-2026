<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him off</text>
<text x="52" y="596" font-size="12" fill="#111318">— get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Tackle head up on you. Cut him off — get</text>
<text x="52" y="680" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Tackle head up on you. Hands inside, pads</text>
<text x="52" y="748" font-size="12" fill="#111318">under his, drive him back.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">Leave the end — he is kicked out. Go take</text>
<text x="358" y="596" font-size="12" fill="#111318">the outside linebacker.</text>
<text x="324" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="358" y="612" font-size="12" fill="#111318">Kick the end out. Aim at his outside hip.</text>
<text x="358" y="630" font-size="12" fill="#111318">Never let him come underneath you.</text>
<text x="324" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="646" font-size="12" fill="#111318">Open right and hand to the tailback as he</text>
<text x="358" y="664" font-size="12" fill="#111318">comes inside from the trips, then fake</text>
<text x="358" y="680" font-size="12" fill="#111318">the boot.</text>
<text x="324" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="358" y="698" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="714" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="732" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="358" y="732" font-size="12" fill="#111318">Come inside off the bunch, take the</text>
<text x="358" y="748" font-size="12" fill="#111318">handoff and hit the hole at our tackle's</text>
<text x="358" y="766" font-size="12" fill="#111318">outside hip. Never bounce it back</text>
<text x="358" y="782" font-size="12" fill="#111318">outside.</text>
<line x1="18" y1="806" x2="630" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Nobody in the backfield. The tailback starts in the trips and comes inside for the ball.</text>
<text x="18" y="862" font-size="12" fill="#111318">The slot kicks the end out. The yards are inside that block, not back out to the bunch.</text>
<text x="18" y="878" font-size="12" fill="#111318">The fullback, widest, screens the corner.</text>
</svg>