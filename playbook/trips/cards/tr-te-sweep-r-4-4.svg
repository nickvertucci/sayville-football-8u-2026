<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion. At the</text>
<text x="52" y="596" font-size="12" fill="#111318">snap run flat behind the quarterback, take the</text>
<text x="52" y="612" font-size="12" fill="#111318">handoff at full speed and get to the right</text>
<text x="52" y="630" font-size="12" fill="#111318">edge. Turn up outside the trips.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Defensive end on your outside shoulder. Cut</text>
<text x="52" y="664" font-size="12" fill="#111318">him off — get between him and the ball.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Defensive guard head up on you. Cut him off —</text>
<text x="52" y="698" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="732" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Defensive guard head up on you. Step past him.</text>
<text x="52" y="766" font-size="12" fill="#111318">Climb to the playside linebacker. Head across</text>
<text x="52" y="782" font-size="12" fill="#111318">him.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the defensive guard, inside</text>
<text x="52" y="816" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="834" font-size="12" fill="#111318">your face.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Block down on the defensive end, inside</text>
<text x="385" y="596" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="385" y="612" font-size="12" fill="#111318">your face.</text>
<text x="351" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="630" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="646" font-size="12" fill="#111318">his way.</text>
<text x="351" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="664" font-size="12" fill="#111318">Open right and hand the ball to the left tight</text>
<text x="385" y="680" font-size="12" fill="#111318">end as he comes across behind you, then fake a</text>
<text x="385" y="698" font-size="12" fill="#111318">run to the left.</text>
<text x="351" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="714" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="732" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="748" font-size="12" fill="#111318">it is the linebacker.</text>
<text x="351" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="766" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="782" font-size="12" fill="#111318">his way.</text>
<line x1="18" y1="840" x2="684" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance.</text>
<text x="18" y="896" font-size="12" fill="#111318">He turns up outside the trips. The fullback takes the force man; the slot screens.</text>
</svg>