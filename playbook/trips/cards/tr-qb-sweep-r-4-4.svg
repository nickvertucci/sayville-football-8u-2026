<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him off</text>
<text x="52" y="596" font-size="12" fill="#111318">— get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Tackle head up on you. Cut him off — get</text>
<text x="52" y="680" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="748" font-size="12" fill="#111318">Climb to the playside linebacker. Head</text>
<text x="52" y="766" font-size="12" fill="#111318">across him.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="358" y="596" font-size="12" fill="#111318">inside. The ball goes around behind you.</text>
<text x="324" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="358" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="646" font-size="12" fill="#111318">Take the snap and sweep right, flat and</text>
<text x="358" y="664" font-size="12" fill="#111318">fast, behind the trips. Turn up outside</text>
<text x="358" y="680" font-size="12" fill="#111318">the fullback.</text>
<text x="324" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="358" y="698" font-size="12" fill="#111318">Lead outside our end. Block the first man</text>
<text x="358" y="714" font-size="12" fill="#111318">out there — here it is the linebacker.</text>
<text x="324" y="732" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="358" y="732" font-size="12" fill="#111318">Run hard to the left like you have the</text>
<text x="358" y="748" font-size="12" fill="#111318">ball. Sell it all the way.</text>
<line x1="18" y1="824" x2="630" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="878" font-size="12" fill="#111318">He stays behind the trips until the fullback's block is made, then turns it up.</text>
</svg>