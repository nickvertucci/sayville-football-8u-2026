<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="630" font-size="12" fill="#111318">downfield and get the left inside linebacker.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="664" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="680" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="714" font-size="12" fill="#111318">downfield and get the right inside linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="748" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="766" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="800" font-size="12" fill="#111318">downfield and get the right outside</text>
<text x="52" y="816" font-size="12" fill="#111318">linebacker.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Block down on the defensive end, inside</text>
<text x="385" y="596" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="385" y="612" font-size="12" fill="#111318">your face.</text>
<text x="351" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="630" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="646" font-size="12" fill="#111318">his way.</text>
<text x="351" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="664" font-size="12" fill="#111318">Take the snap and sweep right, flat and fast,</text>
<text x="385" y="680" font-size="12" fill="#111318">behind the trips. Turn up outside the</text>
<text x="385" y="698" font-size="12" fill="#111318">fullback.</text>
<text x="351" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="714" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="732" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="748" font-size="12" fill="#111318">it is the linebacker.</text>
<text x="351" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="766" font-size="12" fill="#111318">Run hard to the left like you have the ball.</text>
<text x="385" y="782" font-size="12" fill="#111318">Sell it all the way.</text>
<line x1="18" y1="824" x2="684" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="878" font-size="12" fill="#111318">He stays behind the trips until the fullback's block is made, then turns it up.</text>
</svg>