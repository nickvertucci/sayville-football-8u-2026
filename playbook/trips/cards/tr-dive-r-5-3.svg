<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head across</text>
<text x="52" y="714" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Block down on the nose, inside shoulder.</text>
<text x="52" y="748" font-size="12" fill="#111318">Head across him — nobody crosses your</text>
<text x="52" y="766" font-size="12" fill="#111318">face.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Tackle on your inside shoulder. Help on</text>
<text x="52" y="800" font-size="12" fill="#111318">the tackle, then take the playside</text>
<text x="52" y="816" font-size="12" fill="#111318">linebacker.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="358" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="324" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="358" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="646" font-size="12" fill="#111318">Open right and hand to the tailback as he</text>
<text x="358" y="664" font-size="12" fill="#111318">comes inside from the trips, then fake</text>
<text x="358" y="680" font-size="12" fill="#111318">the boot left.</text>
<text x="324" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="358" y="698" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="714" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="732" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="358" y="732" font-size="12" fill="#111318">Come inside off the bunch, take the</text>
<text x="358" y="748" font-size="12" fill="#111318">handoff between the right guard and the</text>
<text x="358" y="766" font-size="12" fill="#111318">right tackle. One cut, then get north.</text>
<line x1="18" y1="824" x2="630" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Dive is the B-gap — between the guard and the tackle. The tailback comes inside from the</text>
<text x="18" y="878" font-size="12" fill="#111318">bunch and gets north.</text>
</svg>