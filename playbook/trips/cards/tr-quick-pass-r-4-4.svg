<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="596" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="630" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="664" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="680" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="698" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="714" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="732" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="748" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="766" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="385" y="596" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Take the snap and throw it to the tailback</text>
<text x="385" y="664" font-size="12" fill="#111318">right now, out in the flat. One step, no drop.</text>
<text x="385" y="680" font-size="12" fill="#111318">If he is covered, throw it at his feet.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="698" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="714" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="732" font-size="12" fill="#111318">it is the linebacker.</text>
<text x="351" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="748" font-size="12" fill="#111318">Slide out behind the bunch, catch it standing</text>
<text x="385" y="766" font-size="12" fill="#111318">still, then get north off your two blockers.</text>
<text x="385" y="782" font-size="12" fill="#111318">Do not run backwards to get around.</text>
</svg>