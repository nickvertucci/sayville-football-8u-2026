<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="52" y="596" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="612" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="630" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="714" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="748" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="782" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="331" y="578" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="331" y="596" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="331" y="612" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="630" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="646" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="664" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="331" y="680" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open left, hand to the tailback, then</text>
<text x="331" y="714" font-size="12" fill="#111318">fake the boot right. It holds the</text>
<text x="331" y="732" font-size="12" fill="#111318">backside end.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="748" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="331" y="766" font-size="12" fill="#111318">center and the left guard. Do not</text>
<text x="331" y="782" font-size="12" fill="#111318">bounce it.</text>
<line x1="18" y1="790" x2="576" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">There is no fullback iso. The tailback is the runner, downhill in the A-gap.</text>
<text x="18" y="844" font-size="12" fill="#111318">The slot and the split end both screen the perimeter. If the tailback bounces,</text>
<text x="18" y="862" font-size="12" fill="#111318">the play is dead.</text>
</svg>