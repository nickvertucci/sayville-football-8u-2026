<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="52" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="52" y="612" font-size="12" fill="#111318">you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="698" font-size="12" fill="#111318">Climb to the playside linebacker.</text>
<text x="52" y="714" font-size="12" fill="#111318">Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="782" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="816" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="834" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Catch the snap and sweep left, flat</text>
<text x="331" y="664" font-size="12" fill="#111318">and fast, behind the left halfback.</text>
<text x="331" y="680" font-size="12" fill="#111318">Turn up outside his block.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="698" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="714" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="732" font-size="12" fill="#111318">linebacker.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="748" font-size="12" fill="#111318">Fake the handoff going right and run</text>
<text x="331" y="766" font-size="12" fill="#111318">hard. Sell it all the way — you are</text>
<text x="331" y="782" font-size="12" fill="#111318">the reason the defense goes the wrong</text>
<text x="331" y="800" font-size="12" fill="#111318">way.</text>
<line x1="18" y1="840" x2="576" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="896" font-size="12" fill="#111318">The right halfback's fake is the play. If he jogs, nobody follows him and the</text>
<text x="18" y="912" font-size="12" fill="#111318">defense is waiting at the edge.</text>
<text x="18" y="930" font-size="12" fill="#111318">The quarterback stays behind the left halfback until the block is made, then</text>
<text x="18" y="946" font-size="12" fill="#111318">turns it up. Running past his blocker is how the sweep loses yards.</text>
</svg>