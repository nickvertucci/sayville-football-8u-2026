<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left tackle, then block the</text>
<text x="52" y="612" font-size="12" fill="#111318">left inside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the right tackle, then block the</text>
<text x="52" y="664" font-size="12" fill="#111318">right inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right tackle.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right end, then block the</text>
<text x="52" y="714" font-size="12" fill="#111318">right outside linebacker.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">Block the right end.</text>
<text x="324" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="358" y="596" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="612" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="630" font-size="12" fill="#111318">Catch the snap and sweep left, flat and</text>
<text x="358" y="646" font-size="12" fill="#111318">fast, behind the left halfback. Turn up</text>
<text x="358" y="664" font-size="12" fill="#111318">outside his block.</text>
<text x="324" y="680" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="358" y="680" font-size="12" fill="#111318">Bubble out around the left end, then</text>
<text x="358" y="698" font-size="12" fill="#111318">block the left outside linebacker.</text>
<text x="324" y="714" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="358" y="714" font-size="12" fill="#111318">Fake the handoff going right and run</text>
<text x="358" y="732" font-size="12" fill="#111318">hard. Sell it all the way — you are the</text>
<text x="358" y="748" font-size="12" fill="#111318">reason the defense goes the wrong way.</text>
<line x1="18" y1="756" x2="630" y2="756" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="774" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="794" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="810" font-size="12" fill="#111318">The right halfback's fake is the play. If he jogs, nobody follows him and the defense is</text>
<text x="18" y="828" font-size="12" fill="#111318">waiting at the edge.</text>
<text x="18" y="844" font-size="12" fill="#111318">The quarterback stays behind the left halfback until the block is made, then turns it up.</text>
<text x="18" y="862" font-size="12" fill="#111318">Running past his blocker is how the sweep loses yards.</text>
</svg>