<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="612" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the right defensive guard, then</text>
<text x="52" y="664" font-size="12" fill="#111318">block the right inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right defensive end, then</text>
<text x="52" y="714" font-size="12" fill="#111318">block the right outside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="344" y="612" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="630" font-size="12" fill="#111318">Hand the ball to the right halfback as</text>
<text x="344" y="646" font-size="12" fill="#111318">he crosses in front of you, then fake a</text>
<text x="344" y="664" font-size="12" fill="#111318">run to the right.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="680" font-size="12" fill="#111318">Bubble out around the left end, then</text>
<text x="344" y="698" font-size="12" fill="#111318">block the left outside linebacker.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="714" font-size="12" fill="#111318">Cross in front of the quarterback, take</text>
<text x="344" y="732" font-size="12" fill="#111318">the handoff going left and get to the</text>
<text x="344" y="748" font-size="12" fill="#111318">edge behind the left halfback. Turn up</text>
<text x="344" y="766" font-size="12" fill="#111318">outside his block.</text>
<line x1="18" y1="772" x2="603" y2="772" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="790" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="810" font-size="12" fill="#111318">The handoff happens in front of the quarterback: the right halfback crosses close and</text>
<text x="18" y="828" font-size="12" fill="#111318">flat, and the quarterback puts it in his belly.</text>
<text x="18" y="844" font-size="12" fill="#111318">The right halfback stays behind the left halfback until the block is made, then turns</text>
<text x="18" y="862" font-size="12" fill="#111318">it up. Running past his blocker is how the sweep loses yards.</text>
<text x="18" y="878" font-size="12" fill="#111318">The quarterback's fake to the right has to be real. It is what holds the backside.</text>
</svg>