<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left defensive end, then block the</text>
<text x="52" y="612" font-size="12" fill="#111318">left outside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the left defensive guard, then block</text>
<text x="52" y="664" font-size="12" fill="#111318">the left inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right defensive guard, then block</text>
<text x="52" y="714" font-size="12" fill="#111318">the right inside linebacker.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="351" y="596" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="596" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="612" font-size="12" fill="#111318">his way.</text>
<text x="351" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="630" font-size="12" fill="#111318">Catch the snap and sweep right, flat and fast,</text>
<text x="385" y="646" font-size="12" fill="#111318">behind the right halfback. Turn up outside his</text>
<text x="385" y="664" font-size="12" fill="#111318">block.</text>
<text x="351" y="680" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="680" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="698" font-size="12" fill="#111318">the linebacker with the right halfback.</text>
<text x="351" y="714" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="714" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="732" font-size="12" fill="#111318">the linebacker with the left halfback.</text>
<line x1="18" y1="738" x2="684" y2="738" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="756" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="776" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="794" font-size="12" fill="#111318">The left halfback's fake is the play. If he jogs, nobody follows him and the defense is waiting at</text>
<text x="18" y="810" font-size="12" fill="#111318">the edge.</text>
<text x="18" y="828" font-size="12" fill="#111318">The quarterback stays behind the right halfback until the block is made, then turns it up. Running</text>
<text x="18" y="844" font-size="12" fill="#111318">past his blocker is how the sweep loses yards.</text>
</svg>