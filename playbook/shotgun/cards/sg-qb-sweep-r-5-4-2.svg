<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="630" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="646" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="782" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="800" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him</text>
<text x="344" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="344" y="612" font-size="12" fill="#111318">you.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="630" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="344" y="646" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Catch the snap and sweep right, flat</text>
<text x="344" y="680" font-size="12" fill="#111318">and fast, behind the right halfback.</text>
<text x="344" y="698" font-size="12" fill="#111318">Turn up outside his block.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="732" font-size="12" fill="#111318">team the linebacker with the right</text>
<text x="344" y="748" font-size="12" fill="#111318">halfback.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="766" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="782" font-size="12" fill="#111318">team the linebacker with the left</text>
<text x="344" y="800" font-size="12" fill="#111318">halfback.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="862" font-size="12" fill="#111318">The left halfback's fake is the play. If he jogs, nobody follows him and the defense</text>
<text x="18" y="878" font-size="12" fill="#111318">is waiting at the edge.</text>
<text x="18" y="896" font-size="12" fill="#111318">The quarterback stays behind the right halfback until the block is made, then turns</text>
<text x="18" y="912" font-size="12" fill="#111318">it up. Running past his blocker is how the sweep loses yards.</text>
</svg>