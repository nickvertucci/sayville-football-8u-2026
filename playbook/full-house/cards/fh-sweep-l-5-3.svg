<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the nose, inside</text>
<text x="52" y="680" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="698" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="732" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="766" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="630" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="646" font-size="12" fill="#111318">corner.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="664" font-size="12" fill="#111318">Open left, let the playside back go,</text>
<text x="331" y="680" font-size="12" fill="#111318">and hand it to the deep back as he</text>
<text x="331" y="698" font-size="12" fill="#111318">crosses behind you. Then carry out a</text>
<text x="331" y="714" font-size="12" fill="#111318">fake up the middle.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Climb to the middle linebacker. Head</text>
<text x="331" y="748" font-size="12" fill="#111318">across him. Fill like Dive is coming.</text>
<text x="331" y="766" font-size="12" fill="#111318">It buys the corner half a second.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="782" font-size="12" fill="#111318">Take the handoff and get width first.</text>
<text x="331" y="800" font-size="12" fill="#111318">Stay behind your blockers until you</text>
<text x="331" y="816" font-size="12" fill="#111318">are outside our end, then turn up</text>
<text x="331" y="834" font-size="12" fill="#111318">hard. Turning up too early is the</text>
<text x="331" y="850" font-size="12" fill="#111318">only way this play loses yards.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">The first three steps are identical to Power Left. That is the point — do not let</text>
<text x="18" y="912" font-size="12" fill="#111318">the backs give it away by leaning wider on this one.</text>
<text x="18" y="930" font-size="12" fill="#111318">The carrier must not turn up until he is outside our end. Eight-year-olds cut</text>
<text x="18" y="946" font-size="12" fill="#111318">upfield the moment they see grass and run straight into the tackle that Power was</text>
<text x="18" y="964" font-size="12" fill="#111318">designed to beat.</text>
<text x="18" y="980" font-size="12" fill="#111318">The playside back is closer to the corner than the carrier is and starts on the</text>
<text x="18" y="998" font-size="12" fill="#111318">snap, so getting there first is a question of effort, not speed. Time it in</text>
<text x="18" y="1014" font-size="12" fill="#111318">practice with both of them going.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The playside back has the longest trip on the play. If he cannot beat the carrier</text>
<text x="18" y="1048" font-size="12" fill="#111318">to the corner, come back to Power — the sweep is only the sweep if he gets there</text>
<text x="18" y="1066" font-size="12" fill="#111318">first.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Best call on the hash going to the wide side of the field. Do not call it into</text>
<text x="18" y="1100" font-size="12" fill="#111318">the boundary.</text>
<text x="18" y="1116" font-size="12" fill="#111318">If their corner is flying up to meet the lead back every time, come back inside</text>
<text x="18" y="1134" font-size="12" fill="#111318">with Power Left or Dive Left.</text>
</svg>