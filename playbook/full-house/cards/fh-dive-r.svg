<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. Nobody</text>
<text x="52" y="596" font-size="12" fill="#111318">chases this down from the backside.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="646" font-size="12" fill="#111318">inside — nobody crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="680" font-size="12" fill="#111318">drive the nose away from the hole and</text>
<text x="52" y="698" font-size="12" fill="#111318">stay on him.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="732" font-size="12" fill="#111318">Drive him to the backside — the hole</text>
<text x="52" y="748" font-size="12" fill="#111318">is on the other side of your body, so</text>
<text x="52" y="766" font-size="12" fill="#111318">he cannot cross your face.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Go straight to</text>
<text x="52" y="800" font-size="12" fill="#111318">the middle linebacker and get your</text>
<text x="52" y="816" font-size="12" fill="#111318">head across him. He is the only man</text>
<text x="52" y="834" font-size="12" fill="#111318">who can make this tackle for a short</text>
<text x="52" y="850" font-size="12" fill="#111318">gain.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="884" font-size="12" fill="#111318">shoulder. Drive him out toward the</text>
<text x="52" y="902" font-size="12" fill="#111318">sideline — every step you move him is</text>
<text x="52" y="918" font-size="12" fill="#111318">another step wide the hole gets.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you out. He is the</text>
<text x="331" y="596" font-size="12" fill="#111318">man who closes this down if you let</text>
<text x="331" y="612" font-size="12" fill="#111318">him step inside.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Run the sweep path the other way at</text>
<text x="331" y="646" font-size="12" fill="#111318">full speed with your arms tucked. You</text>
<text x="331" y="664" font-size="12" fill="#111318">never get the ball on this play and</text>
<text x="331" y="680" font-size="12" fill="#111318">you are the reason it works.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open right and give it to the</text>
<text x="331" y="714" font-size="12" fill="#111318">playside back now. This is a quick</text>
<text x="331" y="732" font-size="12" fill="#111318">handoff, not a ride — he is past you</text>
<text x="331" y="748" font-size="12" fill="#111318">before you finish turning.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Take one step to the quarterback and</text>
<text x="331" y="782" font-size="12" fill="#111318">go straight ahead off the inside hip</text>
<text x="331" y="800" font-size="12" fill="#111318">of the guard you are standing behind.</text>
<text x="331" y="816" font-size="12" fill="#111318">Pads low, ball in both arms. Do not</text>
<text x="331" y="834" font-size="12" fill="#111318">dance and do not look for anything</text>
<text x="331" y="850" font-size="12" fill="#111318">better.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="868" font-size="12" fill="#111318">You leave on the snap, so you get</text>
<text x="331" y="884" font-size="12" fill="#111318">there first. Step to the hole and</text>
<text x="331" y="902" font-size="12" fill="#111318">block the first linebacker who fills</text>
<text x="331" y="918" font-size="12" fill="#111318">it. Get your head across him.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">This is the first play you install in this formation and the one you fall back on</text>
<text x="18" y="980" font-size="12" fill="#111318">all season. It works because it is fast, not because it is clever.</text>
<text x="18" y="998" font-size="12" fill="#111318">The carrier is already lined up behind the guard he is running past. His only job</text>
<text x="18" y="1014" font-size="12" fill="#111318">is one step to the quarterback and then straight ahead off that guard's inside</text>
<text x="18" y="1032" font-size="12" fill="#111318">hip — if he aims at the center he runs into the nose.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The deep back leaves on the snap and the carrier does not, which is the whole</text>
<text x="18" y="1066" font-size="12" fill="#111318">reason a lead block is even possible on a play this quick. If he waits to see the</text>
<text x="18" y="1082" font-size="12" fill="#111318">handoff he arrives behind the man he is supposed to block.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The backside back's fake is worth more than most blocks in this book. If he jogs</text>
<text x="18" y="1116" font-size="12" fill="#111318">it, their backside linebacker is free to make the tackle. Make him sprint.</text>
<text x="18" y="1134" font-size="12" fill="#111318">If the middle linebacker is meeting the carrier in the hole every time, the guard</text>
<text x="18" y="1150" font-size="12" fill="#111318">is not getting to him. Check that before you blame the back.</text>
</svg>