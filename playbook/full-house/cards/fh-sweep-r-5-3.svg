<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="52" y="612" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="52" y="630" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="714" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="52" y="732" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Reach the nose to your right. Get</text>
<text x="52" y="766" font-size="12" fill="#111318">your head across that shoulder so he</text>
<text x="52" y="782" font-size="12" fill="#111318">cannot run down the line after the</text>
<text x="52" y="800" font-size="12" fill="#111318">ball.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="816" font-size="12" fill="#111318">PULL RIGHT. Stay flat, get outside</text>
<text x="52" y="834" font-size="12" fill="#111318">our end and turn up. Block the first</text>
<text x="52" y="850" font-size="12" fill="#111318">defender outside — in this front it</text>
<text x="52" y="868" font-size="12" fill="#111318">is the corner. You are the last</text>
<text x="52" y="884" font-size="12" fill="#111318">blocker the carrier has.</text>
<text x="18" y="902" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="902" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="918" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="936" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Turn him</text>
<text x="331" y="596" font-size="12" fill="#111318">inside and wall him off. The ball</text>
<text x="331" y="612" font-size="12" fill="#111318">goes around behind you, so he cannot</text>
<text x="331" y="630" font-size="12" fill="#111318">follow it out.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Climb to the middle linebacker and</text>
<text x="331" y="664" font-size="12" fill="#111318">get your head across him — he is the</text>
<text x="331" y="680" font-size="12" fill="#111318">man who makes this tackle if nobody</text>
<text x="331" y="698" font-size="12" fill="#111318">gets to him. Fill like Dive is</text>
<text x="331" y="714" font-size="12" fill="#111318">coming. That fill buys the corner</text>
<text x="331" y="732" font-size="12" fill="#111318">half a second.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="748" font-size="12" fill="#111318">Open right, let the playside back go,</text>
<text x="331" y="766" font-size="12" fill="#111318">and hand it to the deep back as he</text>
<text x="331" y="782" font-size="12" fill="#111318">crosses behind you. Then carry out a</text>
<text x="331" y="800" font-size="12" fill="#111318">fake up the middle.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Lead outside our end and block the</text>
<text x="331" y="834" font-size="12" fill="#111318">first defender out there — in this</text>
<text x="331" y="850" font-size="12" fill="#111318">front it is the corner. Get your head</text>
<text x="331" y="868" font-size="12" fill="#111318">across him; do not wait for him to</text>
<text x="331" y="884" font-size="12" fill="#111318">come to you.</text>
<text x="297" y="902" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="902" font-size="12" fill="#111318">Take the handoff and get width first.</text>
<text x="331" y="918" font-size="12" fill="#111318">Stay behind your blockers until you</text>
<text x="331" y="936" font-size="12" fill="#111318">are outside our end, then turn up</text>
<text x="331" y="952" font-size="12" fill="#111318">hard. Turning up too early is the</text>
<text x="331" y="970" font-size="12" fill="#111318">only way this play loses yards.</text>
<line x1="18" y1="976" x2="576" y2="976" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="994" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="1014" font-size="12" fill="#111318">The first three steps are identical to Power Right. That is the point — do not</text>
<text x="18" y="1032" font-size="12" fill="#111318">let the backs give it away by leaning wider on this one.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The carrier must not turn up until he is outside our end. Eight-year-olds cut</text>
<text x="18" y="1066" font-size="12" fill="#111318">upfield the moment they see grass and run straight into the tackle that Power was</text>
<text x="18" y="1082" font-size="12" fill="#111318">designed to beat.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The playside back is closer to the corner than the carrier is and starts on the</text>
<text x="18" y="1116" font-size="12" fill="#111318">snap, so getting there first is a question of effort, not speed. Time it in</text>
<text x="18" y="1134" font-size="12" fill="#111318">practice with both of them going.</text>
<text x="18" y="1150" font-size="12" fill="#111318">The pulling guard has the longest trip on the play. If he cannot get there, block</text>
<text x="18" y="1168" font-size="12" fill="#111318">it with the playside back alone and leave the guard in — a slow pull is worse</text>
<text x="18" y="1184" font-size="12" fill="#111318">than no pull.</text>
<text x="18" y="1202" font-size="12" fill="#111318">Best call on the hash going to the wide side of the field. Do not call it into</text>
<text x="18" y="1218" font-size="12" fill="#111318">the boundary.</text>
<text x="18" y="1236" font-size="12" fill="#111318">If their corner is flying up to meet the pull every time, come back inside with</text>
<text x="18" y="1252" font-size="12" fill="#111318">Power Right or Dive Right.</text>
</svg>