<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards. You are the second</text>
<text x="52" y="630" font-size="12" fill="#111318">look and you arrive late on purpose.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face. Sell it. This has</text>
<text x="52" y="698" font-size="12" fill="#111318">to look like Power to your side.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="732" font-size="12" fill="#111318">Climb to the middle linebacker. Head</text>
<text x="52" y="748" font-size="12" fill="#111318">across him. Climb like Power is</text>
<text x="52" y="766" font-size="12" fill="#111318">coming and take him with you.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="800" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="816" font-size="12" fill="#111318">Block down on the tackle, head up.</text>
<text x="52" y="834" font-size="12" fill="#111318">Head across him — nobody crosses your</text>
<text x="52" y="850" font-size="12" fill="#111318">face.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="884" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="331" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="331" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Kick the end like Power is coming,</text>
<text x="331" y="664" font-size="12" fill="#111318">then look for anyone chasing the</text>
<text x="331" y="680" font-size="12" fill="#111318">quarterback.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Fake the handoff to the deep back</text>
<text x="331" y="714" font-size="12" fill="#111318">with both hands, hide the ball on</text>
<text x="331" y="732" font-size="12" fill="#111318">your back hip, and get to the edge</text>
<text x="331" y="748" font-size="12" fill="#111318">the other way. Run it if it is open.</text>
<text x="331" y="766" font-size="12" fill="#111318">Only throw if a defender comes up to</text>
<text x="331" y="782" font-size="12" fill="#111318">take you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run your Power lead path full speed,</text>
<text x="331" y="816" font-size="12" fill="#111318">then look back for anyone chasing the</text>
<text x="331" y="834" font-size="12" fill="#111318">quarterback.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Run your Power path at full speed</text>
<text x="331" y="868" font-size="12" fill="#111318">with your arms tucked like you have</text>
<text x="331" y="884" font-size="12" fill="#111318">the ball. Sell it all the way — you</text>
<text x="331" y="902" font-size="12" fill="#111318">are the man the fake goes to and the</text>
<text x="331" y="918" font-size="12" fill="#111318">reason nobody stays home.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Do not call this until House Power Left has hurt them. Every part of it is a lie</text>
<text x="18" y="980" font-size="12" fill="#111318">about Power, so Power has to be worth lying about.</text>
<text x="18" y="998" font-size="12" fill="#111318">The three backs have to run their real Power paths at real speed. A jogged fake</text>
<text x="18" y="1014" font-size="12" fill="#111318">with three backs is three times as obvious as a jogged fake with one.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The deep back is the one the quarterback fakes to, and he is the one the</text>
<text x="18" y="1048" font-size="12" fill="#111318">linebackers are watching. If he stands up out of his path after the mesh, the</text>
<text x="18" y="1066" font-size="12" fill="#111318">whole play dies.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="1100" font-size="12" fill="#111318">the fake dies and the flat defender is waiting.</text>
<text x="18" y="1116" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1134" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1150" font-size="12" fill="#111318">Run first. One throw, then tuck it — no scrambling backwards, ever.</text>
</svg>