<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Release inside off the end and take</text>
<text x="52" y="596" font-size="12" fill="#111318">the playside linebacker. The end over</text>
<text x="52" y="612" font-size="12" fill="#111318">you is getting kicked out — leave him</text>
<text x="52" y="630" font-size="12" fill="#111318">alone.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down. Take the tackle on your</text>
<text x="52" y="664" font-size="12" fill="#111318">inside shoulder and seal him inside —</text>
<text x="52" y="680" font-size="12" fill="#111318">that is what opens the hole.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="714" font-size="12" fill="#111318">drive the nose for a count, then</text>
<text x="52" y="732" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose head up. Hands</text>
<text x="52" y="766" font-size="12" fill="#111318">inside and do not let him cross your</text>
<text x="52" y="782" font-size="12" fill="#111318">face to the playside.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line,</text>
<text x="52" y="816" font-size="12" fill="#111318">turn up through the hole and block</text>
<text x="52" y="834" font-size="12" fill="#111318">the first wrong shirt you see. Do not</text>
<text x="52" y="850" font-size="12" fill="#111318">go around the pile — go through it.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">Block back. Take the first man on or</text>
<text x="52" y="884" font-size="12" fill="#111318">inside you — nobody crosses your</text>
<text x="52" y="902" font-size="12" fill="#111318">face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Take the handoff going left and aim</text>
<text x="331" y="646" font-size="12" fill="#111318">at the outside hip of our left</text>
<text x="331" y="664" font-size="12" fill="#111318">tackle. Follow the fullback's</text>
<text x="331" y="680" font-size="12" fill="#111318">kick-out, then the guard. Stay tight</text>
<text x="331" y="698" font-size="12" fill="#111318">to the blocks — do not bounce it</text>
<text x="331" y="714" font-size="12" fill="#111318">outside.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Open left and hand the ball deep to</text>
<text x="331" y="748" font-size="12" fill="#111318">the Z as he crosses, then carry out a</text>
<text x="331" y="766" font-size="12" fill="#111318">fake to the right edge.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Kick the end out. Leave on the snap,</text>
<text x="331" y="800" font-size="12" fill="#111318">aim at his outside hip and drive him</text>
<text x="331" y="816" font-size="12" fill="#111318">toward the sideline — the Z runs</text>
<text x="331" y="834" font-size="12" fill="#111318">inside your block.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Follow the pulling guard through,</text>
<text x="331" y="868" font-size="12" fill="#111318">then keep going to the second level.</text>
<text x="331" y="884" font-size="12" fill="#111318">Block the last man between the Z and</text>
<text x="331" y="902" font-size="12" fill="#111318">the open field — usually the safety.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">Do not call this until they are flying to the Z's side. His alignment is what</text>
<text x="18" y="964" font-size="12" fill="#111318">makes it — if they are not honouring Power to him, run that first.</text>
<text x="18" y="980" font-size="12" fill="#111318">Three blockers lead it: the fullback kicks the end, the backside guard pulls up</text>
<text x="18" y="998" font-size="12" fill="#111318">through the hole, and the tailback follows in behind them. The Z stays tight and</text>
<text x="18" y="1014" font-size="12" fill="#111318">does not bounce.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The tailback does not need a particular man — find the safety if he shows, or</text>
<text x="18" y="1048" font-size="12" fill="#111318">just find work. One more blocker at the point of attack is the whole idea.</text>
<text x="18" y="1066" font-size="12" fill="#111318">This is a patient run for the Z — he is coming from the far side, so the hole is</text>
<text x="18" y="1082" font-size="12" fill="#111318">a half-count later than it looks. Trust the blocks.</text>
</svg>