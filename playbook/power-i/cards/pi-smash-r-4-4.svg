<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Cut him off — get between him and the</text>
<text x="52" y="612" font-size="12" fill="#111318">ball.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the defensive guard,</text>
<text x="52" y="646" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="664" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Defensive guard head up on you. Cut him</text>
<text x="52" y="698" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="732" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Defensive guard head up on you. Hands</text>
<text x="52" y="766" font-size="12" fill="#111318">inside, pads under his, drive him back.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the defensive guard,</text>
<text x="52" y="800" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="816" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="344" y="596" font-size="12" fill="#111318">Cut him off — get between him and the</text>
<text x="344" y="612" font-size="12" fill="#111318">ball.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="630" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="646" font-size="12" fill="#111318">man who shows in it. You are the second</text>
<text x="344" y="664" font-size="12" fill="#111318">man through. Go after the fullback,</text>
<text x="344" y="680" font-size="12" fill="#111318">take whoever he did not.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="698" font-size="12" fill="#111318">Open right, hand to the tailback, then</text>
<text x="344" y="714" font-size="12" fill="#111318">fake the boot left. It holds the</text>
<text x="344" y="732" font-size="12" fill="#111318">backside end.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="748" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="766" font-size="12" fill="#111318">man who shows in it.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="782" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="344" y="800" font-size="12" fill="#111318">center and the right guard, right off</text>
<text x="344" y="816" font-size="12" fill="#111318">the fullback's hip. Do not bounce it.</text>
<line x1="18" y1="824" x2="603" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Two lead blockers in the same gap is the whole point of this formation. The fullback</text>
<text x="18" y="878" font-size="12" fill="#111318">hits it first, the slot is right behind him and takes the next man who shows.</text>
<text x="18" y="896" font-size="12" fill="#111318">The hole is the A-gap, between the center and the right guard. If the tailback</text>
<text x="18" y="912" font-size="12" fill="#111318">bounces it, the play is dead and both his blockers are wasted.</text>
<text x="18" y="930" font-size="12" fill="#111318">Neither lead picks a man before the snap. First one shows, first one gets blocked.</text>
</svg>