<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="331" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Take the handoff and get width. Stay</text>
<text x="331" y="630" font-size="12" fill="#111318">behind the fullback until you are</text>
<text x="331" y="646" font-size="12" fill="#111318">outside our end, then turn up hard.</text>
<text x="331" y="664" font-size="12" fill="#111318">Turning up too early is the only way</text>
<text x="331" y="680" font-size="12" fill="#111318">this loses yards.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open right and get the ball to the Z</text>
<text x="331" y="714" font-size="12" fill="#111318">deep and early, then carry out a fake</text>
<text x="331" y="732" font-size="12" fill="#111318">up the middle.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="748" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="766" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="782" font-size="12" fill="#111318">linebacker.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run at the safety and screen him off.</text>
<text x="331" y="816" font-size="12" fill="#111318">Stay in his way.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Do not call this until they are flying to the Z's side. His alignment is what</text>
<text x="18" y="878" font-size="12" fill="#111318">makes it — if they are not honouring Power to him, run that first.</text>
<text x="18" y="896" font-size="12" fill="#111318">Two blockers lead it: the fullback takes the first man outside our end and the</text>
<text x="18" y="912" font-size="12" fill="#111318">tailback takes the corner. The Z stays behind them until he is past our end.</text>
<text x="18" y="930" font-size="12" fill="#111318">The tailback does not need a particular man — find one and finish the block. One</text>
<text x="18" y="946" font-size="12" fill="#111318">more hat at the point of attack is the whole idea.</text>
<text x="18" y="964" font-size="12" fill="#111318">The Z must not turn up until he is outside our end. Coming all the way from the</text>
<text x="18" y="980" font-size="12" fill="#111318">far side, the temptation to cut it up early is strong — the yards are around the</text>
<text x="18" y="998" font-size="12" fill="#111318">corner.</text>
</svg>