<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="680" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="748" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Drive</text>
<text x="331" y="596" font-size="12" fill="#111318">him to the sideline. The ball goes</text>
<text x="331" y="612" font-size="12" fill="#111318">inside you.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Run your Power path to the left at</text>
<text x="331" y="646" font-size="12" fill="#111318">full speed and block whatever shows.</text>
<text x="331" y="664" font-size="12" fill="#111318">You never get the ball on this play</text>
<text x="331" y="680" font-size="12" fill="#111318">and you are the reason it works.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Take the snap, fake the handoff to</text>
<text x="331" y="714" font-size="12" fill="#111318">the left with both hands, then turn</text>
<text x="331" y="732" font-size="12" fill="#111318">back and hand to the tailback. The</text>
<text x="331" y="748" font-size="12" fill="#111318">fake comes first — the handoff is</text>
<text x="331" y="766" font-size="12" fill="#111318">late on purpose.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Lead through the hole. Block the</text>
<text x="331" y="800" font-size="12" fill="#111318">first man who shows in it. One false</text>
<text x="331" y="816" font-size="12" fill="#111318">step away from the hole, then do your</text>
<text x="331" y="834" font-size="12" fill="#111318">job.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Take two hard steps toward the offset</text>
<text x="331" y="868" font-size="12" fill="#111318">back, then plant and come back behind</text>
<text x="331" y="884" font-size="12" fill="#111318">our tight end's block. Those two</text>
<text x="331" y="902" font-size="12" fill="#111318">steps are the entire play.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">Do not call this until Power Left has gone for real yards. Misdirection off a</text>
<text x="18" y="964" font-size="12" fill="#111318">play they do not fear is just a slower run.</text>
<text x="18" y="980" font-size="12" fill="#111318">The Z is the whole lie. He must run his Power lead path at Power speed and block</text>
<text x="18" y="998" font-size="12" fill="#111318">somebody at the end of it — if he coasts, their backside linebacker never leaves.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="1032" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The fullback's false step is one step, not two. Any more and he is late to the</text>
<text x="18" y="1066" font-size="12" fill="#111318">hole.</text>
<text x="18" y="1082" font-size="12" fill="#111318">With nobody pulling, the tight end kicks the end out himself. Against a</text>
<text x="18" y="1100" font-size="12" fill="#111318">four-linebacker front that leaves the outside linebacker free — the lead back</text>
<text x="18" y="1116" font-size="12" fill="#111318">takes him if he fills, and if he keeps making the tackle, run Toss at him</text>
<text x="18" y="1134" font-size="12" fill="#111318">instead.</text>
</svg>