<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Release inside off his outside</text>
<text x="52" y="596" font-size="12" fill="#111318">shoulder and take the playside</text>
<text x="52" y="612" font-size="12" fill="#111318">linebacker. The end over you is</text>
<text x="52" y="630" font-size="12" fill="#111318">getting kicked out — leave him alone.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="680" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="714" font-size="12" fill="#111318">drive the nose for one count, then</text>
<text x="52" y="732" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="766" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="782" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line,</text>
<text x="52" y="816" font-size="12" fill="#111318">turn up through the hole and block</text>
<text x="52" y="834" font-size="12" fill="#111318">the first wrong shirt you see. Do not</text>
<text x="52" y="850" font-size="12" fill="#111318">go around the pile — go through it.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="884" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="902" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="331" y="630" font-size="12" fill="#111318">Come flat across behind the line and</text>
<text x="331" y="646" font-size="12" fill="#111318">cut off the backside. You are chasing</text>
<text x="331" y="664" font-size="12" fill="#111318">the play, so take the first defender</text>
<text x="331" y="680" font-size="12" fill="#111318">who crosses your path.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open to the left, hand it deep to the</text>
<text x="331" y="714" font-size="12" fill="#111318">tailback, then carry out the boot</text>
<text x="331" y="732" font-size="12" fill="#111318">fake to the edge. The fake is what</text>
<text x="331" y="748" font-size="12" fill="#111318">keeps the backside end honest.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Kick the end out. Aim at his outside</text>
<text x="331" y="782" font-size="12" fill="#111318">hip and drive him toward the</text>
<text x="331" y="800" font-size="12" fill="#111318">sideline. The tailback is running</text>
<text x="331" y="816" font-size="12" fill="#111318">inside of you, so never let him come</text>
<text x="331" y="834" font-size="12" fill="#111318">underneath.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Take the handoff going downhill and</text>
<text x="331" y="868" font-size="12" fill="#111318">aim at the outside hip of our tackle.</text>
<text x="331" y="884" font-size="12" fill="#111318">Follow the guard through the hole.</text>
<text x="331" y="902" font-size="12" fill="#111318">Stay tight to the blocks and do not</text>
<text x="331" y="918" font-size="12" fill="#111318">bounce it outside.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Run this the moment they start cheating a linebacker over to the wing. That is</text>
<text x="18" y="980" font-size="12" fill="#111318">the only reason it is in the book.</text>
<text x="18" y="998" font-size="12" fill="#111318">The fullback is doing the wing's job here, and he is doing it from further away</text>
<text x="18" y="1014" font-size="12" fill="#111318">with less angle. Give him extra reps on the kick-out alone.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Everything else is Power Right in a mirror, so teach the pair together. The line</text>
<text x="18" y="1048" font-size="12" fill="#111318">rules do not change at all.</text>
<text x="18" y="1066" font-size="12" fill="#111318">If the backside end is chasing the tailback down from behind, the quarterback's</text>
<text x="18" y="1082" font-size="12" fill="#111318">boot fake is not being carried out. Fix the fake, not the blocking.</text>
</svg>