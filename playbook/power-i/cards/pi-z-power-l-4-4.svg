<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Leave the end alone — he is getting</text>
<text x="52" y="596" font-size="12" fill="#111318">kicked out. Release past him and take</text>
<text x="52" y="612" font-size="12" fill="#111318">the outside linebacker before he can</text>
<text x="52" y="630" font-size="12" fill="#111318">fill.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">The tackle is head up on you. Hands</text>
<text x="52" y="714" font-size="12" fill="#111318">inside, pads under his, and drive him</text>
<text x="52" y="732" font-size="12" fill="#111318">straight back.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="766" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="52" y="782" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="52" y="800" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="816" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line,</text>
<text x="52" y="834" font-size="12" fill="#111318">turn up through the hole and block</text>
<text x="52" y="850" font-size="12" fill="#111318">the first wrong shirt you see. Do not</text>
<text x="52" y="868" font-size="12" fill="#111318">go around the pile — go through it.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="902" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="918" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="331" y="596" font-size="12" fill="#111318">Cut him off from the play — get your</text>
<text x="331" y="612" font-size="12" fill="#111318">body between him and the ball. You</text>
<text x="331" y="630" font-size="12" fill="#111318">are the last one to it, so never quit</text>
<text x="331" y="646" font-size="12" fill="#111318">on it.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="664" font-size="12" fill="#111318">Take the handoff going left and aim</text>
<text x="331" y="680" font-size="12" fill="#111318">at the outside hip of our left</text>
<text x="331" y="698" font-size="12" fill="#111318">tackle. Follow the fullback's</text>
<text x="331" y="714" font-size="12" fill="#111318">kick-out, then the guard. Stay tight</text>
<text x="331" y="732" font-size="12" fill="#111318">to the blocks — do not bounce it</text>
<text x="331" y="748" font-size="12" fill="#111318">outside.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="766" font-size="12" fill="#111318">Open left and hand the ball deep to</text>
<text x="331" y="782" font-size="12" fill="#111318">the Z as he crosses, then carry out a</text>
<text x="331" y="800" font-size="12" fill="#111318">fake to the right edge.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Kick the end out. Aim at his outside</text>
<text x="331" y="834" font-size="12" fill="#111318">hip and drive him toward the</text>
<text x="331" y="850" font-size="12" fill="#111318">sideline. Everything runs inside of</text>
<text x="331" y="868" font-size="12" fill="#111318">you, so never let him come</text>
<text x="331" y="884" font-size="12" fill="#111318">underneath.</text>
<text x="297" y="902" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="902" font-size="12" fill="#111318">Run at the safety on your side and</text>
<text x="331" y="918" font-size="12" fill="#111318">screen him off. Get in his way and</text>
<text x="331" y="936" font-size="12" fill="#111318">stay there — do not go looking for a</text>
<text x="331" y="952" font-size="12" fill="#111318">knockdown.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Do not call this until they are flying to the Z's side. His alignment is what</text>
<text x="18" y="1014" font-size="12" fill="#111318">makes it — if they are not honouring Power to him, run that first.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Three blockers lead it: the fullback kicks the end, the backside guard pulls up</text>
<text x="18" y="1048" font-size="12" fill="#111318">through the hole, and the tailback follows in behind them. The Z stays tight and</text>
<text x="18" y="1066" font-size="12" fill="#111318">does not bounce.</text>
<text x="18" y="1082" font-size="12" fill="#111318">The tailback does not need a particular man — find the safety if he shows, or</text>
<text x="18" y="1100" font-size="12" fill="#111318">just find work. One more blocker at the point of attack is the whole idea.</text>
<text x="18" y="1116" font-size="12" fill="#111318">This is a patient run for the Z — he is coming from the far side, so the hole is</text>
<text x="18" y="1134" font-size="12" fill="#111318">a half-count later than it looks. Trust the blocks.</text>
</svg>