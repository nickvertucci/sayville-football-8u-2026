<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Cut him off from the play — get your</text>
<text x="52" y="612" font-size="12" fill="#111318">body between him and the ball. You</text>
<text x="52" y="630" font-size="12" fill="#111318">are the last one to it, so never quit</text>
<text x="52" y="646" font-size="12" fill="#111318">on it.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="680" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="698" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">The tackle is head up on you. Cut him</text>
<text x="52" y="732" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="52" y="748" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="52" y="766" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="800" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="52" y="816" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="52" y="834" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="850" font-size="12" fill="#111318">PULL RIGHT. Stay flat, get outside</text>
<text x="52" y="868" font-size="12" fill="#111318">our end and turn up. Block the first</text>
<text x="52" y="884" font-size="12" fill="#111318">defender outside — in this front it</text>
<text x="52" y="902" font-size="12" fill="#111318">is the linebacker. You are the last</text>
<text x="52" y="918" font-size="12" fill="#111318">blocker the carrier has.</text>
<text x="18" y="936" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="936" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="952" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="970" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="331" y="596" font-size="12" fill="#111318">Turn him inside and wall him off. The</text>
<text x="331" y="612" font-size="12" fill="#111318">ball goes around behind you, so he</text>
<text x="331" y="630" font-size="12" fill="#111318">cannot follow it out.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Lead outside our end and block the</text>
<text x="331" y="664" font-size="12" fill="#111318">first defender out there — in this</text>
<text x="331" y="680" font-size="12" fill="#111318">front it is the linebacker. Get your</text>
<text x="331" y="698" font-size="12" fill="#111318">head across him; do not wait for him</text>
<text x="331" y="714" font-size="12" fill="#111318">to come to you.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Open right and get the ball to the</text>
<text x="331" y="748" font-size="12" fill="#111318">tailback deep and early, then carry</text>
<text x="331" y="766" font-size="12" fill="#111318">out a fake up the middle. Do not</text>
<text x="331" y="782" font-size="12" fill="#111318">float it — put it in his hands while</text>
<text x="331" y="800" font-size="12" fill="#111318">he is still gaining width.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Climb to the playside linebacker and</text>
<text x="331" y="834" font-size="12" fill="#111318">get your head across him — he is the</text>
<text x="331" y="850" font-size="12" fill="#111318">man who makes this tackle if nobody</text>
<text x="331" y="868" font-size="12" fill="#111318">gets to him.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="884" font-size="12" fill="#111318">Take the ball and get width first.</text>
<text x="331" y="902" font-size="12" fill="#111318">Stay behind the offset back until you</text>
<text x="331" y="918" font-size="12" fill="#111318">are outside our end, then turn up</text>
<text x="331" y="936" font-size="12" fill="#111318">hard. Turning up too early is the</text>
<text x="331" y="952" font-size="12" fill="#111318">only way this play loses yards.</text>
<line x1="18" y1="976" x2="576" y2="976" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="994" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="1014" font-size="12" fill="#111318">Best call on the hash going to the wide side of the field. Do not call it into</text>
<text x="18" y="1032" font-size="12" fill="#111318">the boundary.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The Z is already behind the line and moving, so he gets to the corner faster than</text>
<text x="18" y="1066" font-size="12" fill="#111318">he would from a tight alignment on the edge — that head start is the whole point</text>
<text x="18" y="1082" font-size="12" fill="#111318">of running it from the backfield.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The carrier must not turn up until he is outside our end. Eight-year-olds cut</text>
<text x="18" y="1116" font-size="12" fill="#111318">upfield the moment they see grass and run into the tackle the play was built to</text>
<text x="18" y="1134" font-size="12" fill="#111318">beat.</text>
<text x="18" y="1150" font-size="12" fill="#111318">If their corner flies up to meet the pull every time, come back inside with Power</text>
<text x="18" y="1168" font-size="12" fill="#111318">Right.</text>
</svg>