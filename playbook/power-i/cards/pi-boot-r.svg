<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards. You are the second</text>
<text x="52" y="630" font-size="12" fill="#111318">look and you arrive late on purpose.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down inside and sell the run.</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody comes through your gap chasing</text>
<text x="52" y="680" font-size="12" fill="#111318">the motion.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Pull flat to the</text>
<text x="52" y="714" font-size="12" fill="#111318">left and run the Jet path — you are</text>
<text x="52" y="732" font-size="12" fill="#111318">the lie, take a linebacker with you.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Block the nose away from the boot.</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody chases through the middle.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="800" font-size="12" fill="#111318">on the nose and drive him away from</text>
<text x="52" y="816" font-size="12" fill="#111318">the boot.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">Hinge and protect the boot side.</text>
<text x="52" y="850" font-size="12" fill="#111318">Nobody comes free outside you — the</text>
<text x="52" y="868" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="331" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="331" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="331" y="646" font-size="12" fill="#111318">Run the Jet motion exactly the way</text>
<text x="331" y="664" font-size="12" fill="#111318">you run it for real — start on the</text>
<text x="331" y="680" font-size="12" fill="#111318">same call, full speed, flat across.</text>
<text x="331" y="698" font-size="12" fill="#111318">Keep going after the fake. You are</text>
<text x="331" y="714" font-size="12" fill="#111318">the reason this play is open.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Fake the jet handoff with both hands,</text>
<text x="331" y="748" font-size="12" fill="#111318">hide the ball on your back hip, and</text>
<text x="331" y="766" font-size="12" fill="#111318">get to the edge the other way. Run it</text>
<text x="331" y="782" font-size="12" fill="#111318">if it is open. Only throw if a</text>
<text x="331" y="800" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Fill straight ahead like Wedge is</text>
<text x="331" y="834" font-size="12" fill="#111318">coming, then block anyone chasing the</text>
<text x="331" y="850" font-size="12" fill="#111318">quarterback from the inside.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="868" font-size="12" fill="#111318">Run the Power path to the right and</text>
<text x="331" y="884" font-size="12" fill="#111318">then keep going to protect the</text>
<text x="331" y="902" font-size="12" fill="#111318">outside. Anybody chasing the</text>
<text x="331" y="918" font-size="12" fill="#111318">quarterback from behind is yours.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Do not call this until Jet Left has been run for real and hurt them. The motion</text>
<text x="18" y="980" font-size="12" fill="#111318">is only a lie if it has been the truth.</text>
<text x="18" y="998" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="1014" font-size="12" fill="#111318">the fake dies and the flat defender is already waiting.</text>
<text x="18" y="1032" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1048" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1066" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="1082" font-size="12" fill="#111318">finds him — the throw is the second choice, not the plan.</text>
<text x="18" y="1100" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>