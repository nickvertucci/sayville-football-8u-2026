<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind.</text>
<text x="52" y="596" font-size="12" fill="#111318">Everything is running away from you,</text>
<text x="52" y="612" font-size="12" fill="#111318">so chase flat down the line and never</text>
<text x="52" y="630" font-size="12" fill="#111318">quit.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="664" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="680" font-size="12" fill="#111318">your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="714" font-size="12" fill="#111318">on the nose for a count, then chase</text>
<text x="52" y="732" font-size="12" fill="#111318">flat behind the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose. Get your body</text>
<text x="52" y="766" font-size="12" fill="#111318">between him and the ball and drive</text>
<text x="52" y="782" font-size="12" fill="#111318">him away from where we are going.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">PULL RIGHT. Stay flat, get outside</text>
<text x="52" y="816" font-size="12" fill="#111318">our end, and turn up. Block the first</text>
<text x="52" y="834" font-size="12" fill="#111318">defender who shows outside — usually</text>
<text x="52" y="850" font-size="12" fill="#111318">the corner. You are the last blocker</text>
<text x="52" y="868" font-size="12" fill="#111318">the carrier has.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="902" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="918" font-size="12" fill="#111318">inside. He must not run down the line</text>
<text x="52" y="936" font-size="12" fill="#111318">with the play.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you out toward the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. Stay on him — the ball is</text>
<text x="331" y="612" font-size="12" fill="#111318">going around you and he cannot be the</text>
<text x="331" y="630" font-size="12" fill="#111318">one to make the tackle.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="331" y="646" font-size="12" fill="#111318">Get width on the snap and lead the</text>
<text x="331" y="664" font-size="12" fill="#111318">tailback around the corner. Block the</text>
<text x="331" y="680" font-size="12" fill="#111318">first man outside our end, and if</text>
<text x="331" y="698" font-size="12" fill="#111318">nobody shows, keep running and find</text>
<text x="331" y="714" font-size="12" fill="#111318">the safety.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Open right and get the ball to the</text>
<text x="331" y="748" font-size="12" fill="#111318">tailback deep and early, then carry</text>
<text x="331" y="766" font-size="12" fill="#111318">out a fake up the middle. Do not</text>
<text x="331" y="782" font-size="12" fill="#111318">float it — put it in his hands while</text>
<text x="331" y="800" font-size="12" fill="#111318">he is still gaining width.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Seal the inside. Anybody crossing the</text>
<text x="331" y="834" font-size="12" fill="#111318">line between our tackle and the ball</text>
<text x="331" y="850" font-size="12" fill="#111318">is yours — the carrier is running</text>
<text x="331" y="868" font-size="12" fill="#111318">outside of you and cannot see them.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="884" font-size="12" fill="#111318">Take the ball and get width first.</text>
<text x="331" y="902" font-size="12" fill="#111318">Stay behind the offset back until you</text>
<text x="331" y="918" font-size="12" fill="#111318">are outside our end, then turn up</text>
<text x="331" y="936" font-size="12" fill="#111318">hard. Turning up too early is the</text>
<text x="331" y="952" font-size="12" fill="#111318">only way this play loses yards.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Best call on the hash going to the wide side of the field. Do not call it into</text>
<text x="18" y="1014" font-size="12" fill="#111318">the boundary.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The offset back has a real head start on this compared to running it from the</text>
<text x="18" y="1048" font-size="12" fill="#111318">wing — he is already behind the line and moving before anybody can widen with</text>
<text x="18" y="1066" font-size="12" fill="#111318">him.</text>
<text x="18" y="1082" font-size="12" fill="#111318">The carrier must not turn up until he is outside our end. Eight-year-olds cut</text>
<text x="18" y="1100" font-size="12" fill="#111318">upfield the moment they see grass and run straight into the tackle the play was</text>
<text x="18" y="1116" font-size="12" fill="#111318">designed to beat.</text>
<text x="18" y="1134" font-size="12" fill="#111318">If their corner is flying up to meet the pull every time, come back inside with</text>
<text x="18" y="1150" font-size="12" fill="#111318">Offset Power Right — same first two steps from the backfield.</text>
</svg>