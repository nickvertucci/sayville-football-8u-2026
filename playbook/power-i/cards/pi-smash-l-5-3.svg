<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="344" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="612" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="630" font-size="12" fill="#111318">man who shows in it. You are the second</text>
<text x="344" y="646" font-size="12" fill="#111318">man through. Go after the fullback,</text>
<text x="344" y="664" font-size="12" fill="#111318">take whoever he did not.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Open left, hand to the tailback, then</text>
<text x="344" y="698" font-size="12" fill="#111318">fake the boot right. It holds the</text>
<text x="344" y="714" font-size="12" fill="#111318">backside end.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="732" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="748" font-size="12" fill="#111318">man who shows in it.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="344" y="782" font-size="12" fill="#111318">center and the left guard, right off</text>
<text x="344" y="800" font-size="12" fill="#111318">the fullback's hip. Do not bounce it.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Two lead blockers in the same gap is the whole point of this formation. The fullback</text>
<text x="18" y="862" font-size="12" fill="#111318">hits it first, the slot is right behind him and takes the next man who shows.</text>
<text x="18" y="878" font-size="12" fill="#111318">The hole is the A-gap, between the center and the left guard. If the tailback bounces</text>
<text x="18" y="896" font-size="12" fill="#111318">it, the play is dead and both his blockers are wasted.</text>
<text x="18" y="912" font-size="12" fill="#111318">Neither lead picks a man before the snap. First one shows, first one gets blocked.</text>
</svg>