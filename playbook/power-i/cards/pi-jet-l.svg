<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the end over you out toward the</text>
<text x="52" y="596" font-size="12" fill="#111318">sideline. Stay on him — the ball is</text>
<text x="52" y="612" font-size="12" fill="#111318">going around you and he cannot be the</text>
<text x="52" y="630" font-size="12" fill="#111318">one to make the tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="680" font-size="12" fill="#111318">inside. He must not run down the line</text>
<text x="52" y="698" font-size="12" fill="#111318">with the play.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody is over you. Pull flat and get</text>
<text x="52" y="732" font-size="12" fill="#111318">outside — you are the lead blocker on</text>
<text x="52" y="748" font-size="12" fill="#111318">the edge. Take the first defender who</text>
<text x="52" y="766" font-size="12" fill="#111318">shows outside our end.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">You have the nose. Get your body</text>
<text x="52" y="800" font-size="12" fill="#111318">between him and the ball and drive</text>
<text x="52" y="816" font-size="12" fill="#111318">him away from where we are going.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="834" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="850" font-size="12" fill="#111318">on the nose for a count, then chase</text>
<text x="52" y="868" font-size="12" fill="#111318">flat behind the play.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="902" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="918" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind.</text>
<text x="331" y="596" font-size="12" fill="#111318">Everything is running away from you,</text>
<text x="331" y="612" font-size="12" fill="#111318">so chase flat down the line and never</text>
<text x="331" y="630" font-size="12" fill="#111318">quit.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="331" y="646" font-size="12" fill="#111318">Start moving on the coach's motion</text>
<text x="331" y="664" font-size="12" fill="#111318">call and be at full speed when you</text>
<text x="331" y="680" font-size="12" fill="#111318">pass the quarterback. Take the ball</text>
<text x="331" y="698" font-size="12" fill="#111318">and get around the corner — do not</text>
<text x="331" y="714" font-size="12" fill="#111318">turn upfield until you are outside</text>
<text x="331" y="732" font-size="12" fill="#111318">our end.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="748" font-size="12" fill="#111318">Turn and hand it back to the wing as</text>
<text x="331" y="766" font-size="12" fill="#111318">he crosses, then keep going the other</text>
<text x="331" y="782" font-size="12" fill="#111318">way with your hands on your belly</text>
<text x="331" y="800" font-size="12" fill="#111318">like you kept it.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Fill straight ahead like Wedge is</text>
<text x="331" y="834" font-size="12" fill="#111318">coming. You are the reason their</text>
<text x="331" y="850" font-size="12" fill="#111318">linebackers step up for one count.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="868" font-size="12" fill="#111318">Run the Power path to the right with</text>
<text x="331" y="884" font-size="12" fill="#111318">your arms tucked like you have the</text>
<text x="331" y="902" font-size="12" fill="#111318">ball. Sell it all the way — you are</text>
<text x="331" y="918" font-size="12" fill="#111318">the reason nobody chases the wing.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Motion is legal in 11-man play, but only one man may be moving at the snap and he</text>
<text x="18" y="980" font-size="12" fill="#111318">cannot be moving toward the line of scrimmage. Teach the wing to run flat across,</text>
<text x="18" y="998" font-size="12" fill="#111318">never forward.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The handoff timing is the whole play. If the wing is slowing down to catch it the</text>
<text x="18" y="1032" font-size="12" fill="#111318">play is dead — snap it when he is a stride from the quarterback and let him run</text>
<text x="18" y="1048" font-size="12" fill="#111318">through it.</text>
<text x="18" y="1066" font-size="12" fill="#111318">Call the motion the same way every single time so the snap count and his start</text>
<text x="18" y="1082" font-size="12" fill="#111318">never drift apart.</text>
<text x="18" y="1100" font-size="12" fill="#111318">Do not install this until Power Right is real. Jet works because they have</text>
<text x="18" y="1116" font-size="12" fill="#111318">already been punished for not honouring the wing side.</text>
<text x="18" y="1134" font-size="12" fill="#111318">If their end chases the wing flat down the line, come back to Power Right the</text>
<text x="18" y="1150" font-size="12" fill="#111318">very next play — he has left the edge.</text>
</svg>