</g></g>
<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him off —</text>
<text x="52" y="596" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="646" font-size="12" fill="#111318">your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside. Never</text>
<text x="52" y="680" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head across his</text>
<text x="52" y="714" font-size="12" fill="#111318">playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="800" font-size="12" fill="#111318">your face.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him inside.</text>
<text x="385" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Get outside the fullback, then take him, then</text>
<text x="385" y="630" font-size="12" fill="#111318">block the right safety.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Quick pitch to the tailback, then run the</text>
<text x="385" y="664" font-size="12" fill="#111318">other way, to the left, like you still have</text>
<text x="385" y="680" font-size="12" fill="#111318">it.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="698" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="714" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="732" font-size="12" fill="#111318">it is the linebacker.</text>
<text x="351" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="748" font-size="12" fill="#111318">Take the pitch on the run and get to the right</text>
<text x="385" y="766" font-size="12" fill="#111318">edge behind your two blockers. Ahead of the</text>
<text x="385" y="782" font-size="12" fill="#111318">quarterback is a fumble.</text>
<line x1="18" y1="806" x2="684" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The pitch goes early. The tailback is seven yards deep and the edge is a long way away — every count</text>
<text x="18" y="862" font-size="12" fill="#111318">he waits is a yard he loses.</text>
<text x="18" y="878" font-size="12" fill="#111318">Two blockers out there and they are not the same block: the fullback takes the force man, the slot</text>
<text x="18" y="896" font-size="12" fill="#111318">goes past him for the corner.</text>
<text x="18" y="912" font-size="12" fill="#111318">The slot is in the backfield, so he has further to run than a split slot does. He leaves on the snap.</text>
</svg>