<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Turn him inside. The ball goes around</text>
<text x="52" y="612" font-size="12" fill="#111318">behind you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the defensive guard,</text>
<text x="52" y="646" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="664" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Defensive guard head up on you. Step</text>
<text x="52" y="698" font-size="12" fill="#111318">past him. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Defensive guard head up on you. Cut him</text>
<text x="52" y="782" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the defensive guard,</text>
<text x="52" y="816" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="834" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="344" y="596" font-size="12" fill="#111318">Cut him off — get between him and the</text>
<text x="344" y="612" font-size="12" fill="#111318">ball.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="630" font-size="12" fill="#111318">Get outside the fullback, then take</text>
<text x="344" y="646" font-size="12" fill="#111318">him, then block the left corner.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Quick pitch to the tailback, then run</text>
<text x="344" y="680" font-size="12" fill="#111318">the other way, to the right, like you</text>
<text x="344" y="698" font-size="12" fill="#111318">still have it.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="732" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="748" font-size="12" fill="#111318">linebacker.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Take the pitch on the run and get to</text>
<text x="344" y="782" font-size="12" fill="#111318">the left edge behind your two blockers.</text>
<text x="344" y="800" font-size="12" fill="#111318">Ahead of the quarterback is a fumble.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The pitch goes early. The tailback is seven yards deep and the edge is a long way</text>
<text x="18" y="896" font-size="12" fill="#111318">away — every count he waits is a yard he loses.</text>
<text x="18" y="912" font-size="12" fill="#111318">Two blockers out there and they are not the same block: the fullback takes the force</text>
<text x="18" y="930" font-size="12" fill="#111318">man, the slot goes past him for the corner.</text>
<text x="18" y="946" font-size="12" fill="#111318">The slot is in the backfield, so he has further to run than a split slot does. He</text>
<text x="18" y="964" font-size="12" fill="#111318">leaves on the snap.</text>
</svg>