<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Leave the end — he is kicked out. Go</text>
<text x="52" y="596" font-size="12" fill="#111318">take the outside linebacker.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Take the handoff going left and aim</text>
<text x="331" y="630" font-size="12" fill="#111318">at the outside hip of our left</text>
<text x="331" y="646" font-size="12" fill="#111318">tackle. Follow the fullback's</text>
<text x="331" y="664" font-size="12" fill="#111318">kick-out. Stay tight to the blocks —</text>
<text x="331" y="680" font-size="12" fill="#111318">do not bounce it outside.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open left and hand the ball deep to</text>
<text x="331" y="714" font-size="12" fill="#111318">the Z as he crosses, then carry out a</text>
<text x="331" y="732" font-size="12" fill="#111318">fake to the right edge.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="748" font-size="12" fill="#111318">Kick the end out. Aim at his outside</text>
<text x="331" y="766" font-size="12" fill="#111318">hip. Never let him come underneath</text>
<text x="331" y="782" font-size="12" fill="#111318">you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="331" y="816" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Do not call this until they are flying to the Z's side. His alignment is what</text>
<text x="18" y="878" font-size="12" fill="#111318">makes it — if they are not honouring Power to him, run that first.</text>
<text x="18" y="896" font-size="12" fill="#111318">Two blockers lead it: the fullback kicks the end and the tailback takes the</text>
<text x="18" y="912" font-size="12" fill="#111318">corner. The Z stays tight behind them and does not bounce.</text>
<text x="18" y="930" font-size="12" fill="#111318">The tailback does not need a particular man — find the safety if he shows, or</text>
<text x="18" y="946" font-size="12" fill="#111318">just find work. One more blocker at the point of attack is the whole idea.</text>
<text x="18" y="964" font-size="12" fill="#111318">This is a patient run for the Z — he is coming from the far side, so the hole is</text>
<text x="18" y="980" font-size="12" fill="#111318">a half-count later than it looks. Trust the blocks.</text>
</svg>