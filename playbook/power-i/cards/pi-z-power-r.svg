<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind.</text>
<text x="52" y="596" font-size="12" fill="#111318">Everything runs away from you — chase</text>
<text x="52" y="612" font-size="12" fill="#111318">flat down the line and never quit.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first man on or</text>
<text x="52" y="646" font-size="12" fill="#111318">inside you — nobody crosses your</text>
<text x="52" y="664" font-size="12" fill="#111318">face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="698" font-size="12" fill="#111318">on the nose for a count, then chase</text>
<text x="52" y="714" font-size="12" fill="#111318">flat behind the play.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">You have the nose. Get your body</text>
<text x="52" y="748" font-size="12" fill="#111318">between him and the ball and drive</text>
<text x="52" y="766" font-size="12" fill="#111318">him away from where we are going.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">PULL RIGHT. Get outside our end and</text>
<text x="52" y="800" font-size="12" fill="#111318">turn up. Block the first man outside</text>
<text x="52" y="816" font-size="12" fill="#111318">— usually the corner. You are the Z's</text>
<text x="52" y="834" font-size="12" fill="#111318">last blocker.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Block down inside. Take the first man</text>
<text x="52" y="868" font-size="12" fill="#111318">on or inside you and seal him —</text>
<text x="52" y="884" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you out toward the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. The ball is going around</text>
<text x="331" y="612" font-size="12" fill="#111318">you — do not let him make the tackle.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Take the handoff and get width. Stay</text>
<text x="331" y="646" font-size="12" fill="#111318">behind the fullback until you are</text>
<text x="331" y="664" font-size="12" fill="#111318">outside our end, then turn up hard.</text>
<text x="331" y="680" font-size="12" fill="#111318">Turning up too early is the only way</text>
<text x="331" y="698" font-size="12" fill="#111318">this loses yards.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Open right and get the ball to the Z</text>
<text x="331" y="732" font-size="12" fill="#111318">deep and early, then carry out a fake</text>
<text x="331" y="748" font-size="12" fill="#111318">up the middle.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Lead the Z around the right end.</text>
<text x="331" y="782" font-size="12" fill="#111318">Block the first man outside our end,</text>
<text x="331" y="800" font-size="12" fill="#111318">and if nobody shows, keep running and</text>
<text x="331" y="816" font-size="12" fill="#111318">find the safety.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="834" font-size="12" fill="#111318">False step to the left and run the</text>
<text x="331" y="850" font-size="12" fill="#111318">Power path that way with your arms</text>
<text x="331" y="868" font-size="12" fill="#111318">tucked, selling the strong-side</text>
<text x="331" y="884" font-size="12" fill="#111318">power. You are the reason the</text>
<text x="331" y="902" font-size="12" fill="#111318">backside stays honest.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">Do not call this until they are flying to the Z's side. His alignment is what</text>
<text x="18" y="964" font-size="12" fill="#111318">makes it — if they are not honouring Power to him, run that first.</text>
<text x="18" y="980" font-size="12" fill="#111318">Two blockers lead it: the fullback and the pulling guard get outside in front of</text>
<text x="18" y="998" font-size="12" fill="#111318">the Z. He stays behind them until he is past our end.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The tailback's fake to the strong side is the whole misdirection. He runs it full</text>
<text x="18" y="1032" font-size="12" fill="#111318">speed with his arms tucked or nobody chases it.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The Z must not turn up until he is outside our end. Coming all the way from the</text>
<text x="18" y="1066" font-size="12" fill="#111318">far side, the temptation to cut it up early is strong — the yards are around the</text>
<text x="18" y="1082" font-size="12" fill="#111318">corner.</text>
</svg>