<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Leave the end — he is kicked out. Go</text>
<text x="52" y="596" font-size="12" fill="#111318">take the outside linebacker.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Kick the end out. Aim at his outside</text>
<text x="331" y="630" font-size="12" fill="#111318">hip. Never let him come underneath</text>
<text x="331" y="646" font-size="12" fill="#111318">you.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="664" font-size="12" fill="#111318">Open to the left, hand it deep to the</text>
<text x="331" y="680" font-size="12" fill="#111318">tailback, then carry out the boot</text>
<text x="331" y="698" font-size="12" fill="#111318">fake to the edge. The fake is what</text>
<text x="331" y="714" font-size="12" fill="#111318">keeps the backside end honest.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Lead through the hole. Block the</text>
<text x="331" y="748" font-size="12" fill="#111318">first man who shows in it.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="766" font-size="12" fill="#111318">Take the handoff going downhill and</text>
<text x="331" y="782" font-size="12" fill="#111318">aim at the outside hip of our tackle.</text>
<text x="331" y="800" font-size="12" fill="#111318">Follow the fullback through the hole.</text>
<text x="331" y="816" font-size="12" fill="#111318">Stay tight to the blocks and do not</text>
<text x="331" y="834" font-size="12" fill="#111318">bounce it outside.</text>
<line x1="18" y1="840" x2="576" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The mirror of Power Right — run it the same week so the defense cannot lean to</text>
<text x="18" y="896" font-size="12" fill="#111318">the Z side.</text>
<text x="18" y="912" font-size="12" fill="#111318">The Z leads from the backfield, so he arrives fast but with a tight angle. He</text>
<text x="18" y="930" font-size="12" fill="#111318">must leave on the snap and attack the end's outside hip, or the end slides under</text>
<text x="18" y="946" font-size="12" fill="#111318">him.</text>
<text x="18" y="964" font-size="12" fill="#111318">The fullback's man is whoever shows in the hole, not one he picks before the</text>
<text x="18" y="980" font-size="12" fill="#111318">snap.</text>
<text x="18" y="998" font-size="12" fill="#111318">The tailback's worst habit is bouncing it wide for green grass. The yards are</text>
<text x="18" y="1014" font-size="12" fill="#111318">inside the Z's kick-out — drill it tight until it is automatic.</text>
</svg>