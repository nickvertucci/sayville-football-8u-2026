<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him off —</text>
<text x="52" y="596" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="646" font-size="12" fill="#111318">your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside. Never</text>
<text x="52" y="680" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head across his</text>
<text x="52" y="714" font-size="12" fill="#111318">playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then take the</text>
<text x="52" y="748" font-size="12" fill="#111318">middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="800" font-size="12" fill="#111318">your face.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Kick the defensive end out. Aim at his outside</text>
<text x="385" y="596" font-size="12" fill="#111318">hip. Never let him come underneath you.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the safety and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Open right and hand deep to the left halfback</text>
<text x="385" y="664" font-size="12" fill="#111318">as he crosses, then fake the boot. It holds</text>
<text x="385" y="680" font-size="12" fill="#111318">the backside end.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="698" font-size="12" fill="#111318">Cross behind the quarterback, take the handoff</text>
<text x="385" y="714" font-size="12" fill="#111318">and hit it downhill at our tackle's outside</text>
<text x="385" y="732" font-size="12" fill="#111318">hip. Never bounce it outside.</text>
<text x="351" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="748" font-size="12" fill="#111318">Lead through the hole. Block the first man who</text>
<text x="385" y="766" font-size="12" fill="#111318">shows in it.</text>
<line x1="18" y1="806" x2="684" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The same Power as the Regular I, run from two backs instead of a stack. The tight end takes the end</text>
<text x="18" y="862" font-size="12" fill="#111318">man and the right halfback leads through the hole.</text>
<text x="18" y="878" font-size="12" fill="#111318">The runner is the back on the far side. He has further to travel, so he has to start on the snap --</text>
<text x="18" y="896" font-size="12" fill="#111318">no false step, no waiting to see the hole.</text>
<text x="18" y="912" font-size="12" fill="#111318">The yards are inside the tight end's block. If the halfback bounces it wide looking for grass, the</text>
<text x="18" y="930" font-size="12" fill="#111318">play is dead.</text>
</svg>