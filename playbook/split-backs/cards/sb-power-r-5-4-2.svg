<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="331" y="630" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Open to the playside and hand deep to</text>
<text x="331" y="664" font-size="12" fill="#111318">the back crossing from the backside.</text>
<text x="331" y="680" font-size="12" fill="#111318">Let him come to you, then fake away.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="698" font-size="12" fill="#111318">You carry it. Cross behind the</text>
<text x="331" y="714" font-size="12" fill="#111318">quarterback, take the handoff deep,</text>
<text x="331" y="732" font-size="12" fill="#111318">then press the outside hip of our</text>
<text x="331" y="748" font-size="12" fill="#111318">tackle and turn up inside the blocks.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="766" font-size="12" fill="#111318">Lead through the hole. Block the</text>
<text x="331" y="782" font-size="12" fill="#111318">first man who shows in it.</text>
<line x1="18" y1="806" x2="576" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Identical blocking to Split Counter. The line learns one set of rules and gets</text>
<text x="18" y="862" font-size="12" fill="#111318">two plays out of it — say that out loud when you install the second one.</text>
<text x="18" y="878" font-size="12" fill="#111318">The near back's block on the playside linebacker is the play. Drill it on its</text>
<text x="18" y="896" font-size="12" fill="#111318">own.</text>
<text x="18" y="912" font-size="12" fill="#111318">The carrier travels further than the blocker, and that is the point — he arrives</text>
<text x="18" y="930" font-size="12" fill="#111318">behind the lead, not beside it.</text>
<text x="18" y="946" font-size="12" fill="#111318">If the handoff is late, the quarterback is reaching. He holds the ball still and</text>
<text x="18" y="964" font-size="12" fill="#111318">lets the back run through it.</text>
<text x="18" y="980" font-size="12" fill="#111318">Against a four-linebacker front there is an outside linebacker nobody blocks. The</text>
<text x="18" y="998" font-size="12" fill="#111318">near back has to take him if he fills, and if they keep winning there, the answer</text>
<text x="18" y="1014" font-size="12" fill="#111318">is the Pitch — it gets outside him instead of running at him.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Nobody blocks outside our end on this one — no kick-out and nobody leading out</text>
<text x="18" y="1048" font-size="12" fill="#111318">there. Against a four-linebacker front their outside linebacker is free, so if</text>
<text x="18" y="1066" font-size="12" fill="#111318">they are playing four, go get the edge with Pitch or Keep instead.</text>
</svg>