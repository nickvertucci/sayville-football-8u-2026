<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="52" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="344" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Open playside and hand deep to the back</text>
<text x="344" y="664" font-size="12" fill="#111318">crossing behind you. Let him come to</text>
<text x="344" y="680" font-size="12" fill="#111318">you, then fake away.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="698" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="714" font-size="12" fill="#111318">man who shows in it.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="732" font-size="12" fill="#111318">Cross behind the quarterback, take the</text>
<text x="344" y="748" font-size="12" fill="#111318">handoff deep, then press our tackle's</text>
<text x="344" y="766" font-size="12" fill="#111318">outside hip. Turn up inside the blocks.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Identical blocking to Split Counter. The line learns one set of rules and gets two</text>
<text x="18" y="862" font-size="12" fill="#111318">plays out of it.</text>
<text x="18" y="878" font-size="12" fill="#111318">The near back's block in the hole is the play. He takes the first man who shows in it</text>
<text x="18" y="896" font-size="12" fill="#111318">rather than a man picked before the snap. Drill it on its own.</text>
<text x="18" y="912" font-size="12" fill="#111318">The carrier travels further than the blocker, and that is the point — he arrives</text>
<text x="18" y="930" font-size="12" fill="#111318">behind the lead, not beside it.</text>
<text x="18" y="946" font-size="12" fill="#111318">If the handoff is late, the quarterback is reaching. He holds the ball still and lets</text>
<text x="18" y="964" font-size="12" fill="#111318">the back run through it.</text>
<text x="18" y="980" font-size="12" fill="#111318">Against a four-linebacker front nobody is assigned to their outside linebacker, and</text>
<text x="18" y="998" font-size="12" fill="#111318">on this side there is no Z out there to screen him — the near back is leading into</text>
<text x="18" y="1014" font-size="12" fill="#111318">the hole and has to take him if he fills. If they keep winning there, the answer is</text>
<text x="18" y="1032" font-size="12" fill="#111318">the Pitch: it gets outside him instead of running at him.</text>
</svg>