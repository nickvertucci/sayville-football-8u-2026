<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Show the ball to the back going</text>
<text x="331" y="664" font-size="12" fill="#111318">right, pull it in on your back hip,</text>
<text x="331" y="680" font-size="12" fill="#111318">and get outside our end. Tuck it on</text>
<text x="331" y="698" font-size="12" fill="#111318">the first step and go north the</text>
<text x="331" y="714" font-size="12" fill="#111318">moment the edge is sealed — do not</text>
<text x="331" y="732" font-size="12" fill="#111318">drift sideways looking for more.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="748" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="766" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="782" font-size="12" fill="#111318">corner.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="800" font-size="12" fill="#111318">Run the sweep path away at full speed</text>
<text x="331" y="816" font-size="12" fill="#111318">with your arms tucked. You are the</text>
<text x="331" y="834" font-size="12" fill="#111318">lie, and the linebackers only leave</text>
<text x="331" y="850" font-size="12" fill="#111318">if you are worth watching.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">Blocked exactly like Pitch — the line does not learn a new rule, only a new name.</text>
<text x="18" y="912" font-size="12" fill="#111318">Say that out loud when you install it.</text>
<text x="18" y="930" font-size="12" fill="#111318">This is the one play that moves the split man, so the huddle hears which side he</text>
<text x="18" y="946" font-size="12" fill="#111318">is on: Z Right or Z Left. Count seven on the line before the snap like always.</text>
<text x="18" y="964" font-size="12" fill="#111318">The fake is the play. If nobody looks at the back going the other way, the</text>
<text x="18" y="980" font-size="12" fill="#111318">quarterback is running straight into a linebacker who never left.</text>
<text x="18" y="998" font-size="12" fill="#111318">The quarterback is a runner here and nothing else. Tuck it on the first step, get</text>
<text x="18" y="1014" font-size="12" fill="#111318">to the edge, and turn up — a quarterback who drifts sideways looking for more</text>
<text x="18" y="1032" font-size="12" fill="#111318">gets caught from behind.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Do not call it until Pitch has been working. Their corner has to believe the ball</text>
<text x="18" y="1066" font-size="12" fill="#111318">is going wide before a keep inside him is worth anything.</text>
</svg>