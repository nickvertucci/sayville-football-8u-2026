<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion.</text>
<text x="52" y="596" font-size="12" fill="#111318">At the snap run flat behind the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback, take the handoff at full</text>
<text x="52" y="630" font-size="12" fill="#111318">speed and get to the right edge. Turn</text>
<text x="52" y="646" font-size="12" fill="#111318">up outside the halfbacks.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Tackle on your inside shoulder. Cut</text>
<text x="52" y="680" font-size="12" fill="#111318">him off — get between him and the</text>
<text x="52" y="698" font-size="12" fill="#111318">ball.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="732" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="766" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="800" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="850" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="331" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Open right and hand the ball to the</text>
<text x="331" y="664" font-size="12" fill="#111318">left tight end as he comes across</text>
<text x="331" y="680" font-size="12" fill="#111318">behind you, then fake a run to the</text>
<text x="331" y="698" font-size="12" fill="#111318">left.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="714" font-size="12" fill="#111318">Lead outside our end, then turn up</text>
<text x="331" y="732" font-size="12" fill="#111318">inside — the playside linebacker is</text>
<text x="331" y="748" font-size="12" fill="#111318">the man who shows. Head across him.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="766" font-size="12" fill="#111318">Lead outside our end, then turn up</text>
<text x="331" y="782" font-size="12" fill="#111318">inside — the playside linebacker is</text>
<text x="331" y="800" font-size="12" fill="#111318">the man who shows. Head across him.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance, so the play is legal</text>
<text x="18" y="912" font-size="12" fill="#111318">and nothing tips it off.</text>
<text x="18" y="930" font-size="12" fill="#111318">The handoff is the whole play: the quarterback opens right and puts the ball in</text>
<text x="18" y="946" font-size="12" fill="#111318">the end's belly at full speed, then carries out his fake.</text>
<text x="18" y="964" font-size="12" fill="#111318">Both halfbacks bubble out to the right ahead of the end and double team the</text>
<text x="18" y="980" font-size="12" fill="#111318">outside linebacker together. Two of them on him is what gets the end around the</text>
<text x="18" y="998" font-size="12" fill="#111318">corner.</text>
</svg>