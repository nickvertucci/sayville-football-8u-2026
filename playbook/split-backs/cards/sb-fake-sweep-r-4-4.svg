<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left defensive end, then</text>
<text x="52" y="612" font-size="12" fill="#111318">block the left outside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="664" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right defensive guard, then</text>
<text x="52" y="714" font-size="12" fill="#111318">block the right inside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder.</text>
<text x="344" y="596" font-size="12" fill="#111318">Turn him inside. The ball goes around</text>
<text x="344" y="612" font-size="12" fill="#111318">behind you.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="630" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="646" font-size="12" fill="#111318">Stay in his way.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Fake the handoff to the left halfback,</text>
<text x="344" y="680" font-size="12" fill="#111318">then roll back right and sweep it, flat</text>
<text x="344" y="698" font-size="12" fill="#111318">and fast, behind the right halfback.</text>
<text x="344" y="714" font-size="12" fill="#111318">Turn up outside his block.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Take the fake from the quarterback and</text>
<text x="344" y="748" font-size="12" fill="#111318">run hard to the left like you have the</text>
<text x="344" y="766" font-size="12" fill="#111318">ball. Sell it all the way — you are the</text>
<text x="344" y="782" font-size="12" fill="#111318">reason the defense goes the wrong way.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="800" font-size="12" fill="#111318">Bubble out around the right tight end,</text>
<text x="344" y="816" font-size="12" fill="#111318">then block the right outside</text>
<text x="344" y="834" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The fake has to look real: the quarterback puts the ball at the left halfback's belly</text>
<text x="18" y="896" font-size="12" fill="#111318">and pulls it back out.</text>
<text x="18" y="912" font-size="12" fill="#111318">The left halfback's fake is the play. If he jogs, nobody follows him and the defense</text>
<text x="18" y="930" font-size="12" fill="#111318">is waiting on the right.</text>
<text x="18" y="946" font-size="12" fill="#111318">After the fake the quarterback gets back to the right fast, stays behind the right</text>
<text x="18" y="964" font-size="12" fill="#111318">halfback until the block is made, then turns it up.</text>
</svg>