<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left end, then block the</text>
<text x="52" y="612" font-size="12" fill="#111318">left outside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the left tackle, then block</text>
<text x="52" y="664" font-size="12" fill="#111318">the left inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right tackle.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right tackle, then block</text>
<text x="52" y="714" font-size="12" fill="#111318">the right inside linebacker.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="331" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="331" y="612" font-size="12" fill="#111318">you.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="630" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="646" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="664" font-size="12" fill="#111318">Fake the handoff to the left</text>
<text x="331" y="680" font-size="12" fill="#111318">halfback, then roll back right and</text>
<text x="331" y="698" font-size="12" fill="#111318">sweep it, flat and fast, behind the</text>
<text x="331" y="714" font-size="12" fill="#111318">right halfback. Turn up outside his</text>
<text x="331" y="732" font-size="12" fill="#111318">block.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="748" font-size="12" fill="#111318">Take the fake from the quarterback</text>
<text x="331" y="766" font-size="12" fill="#111318">and run hard to the left like you</text>
<text x="331" y="782" font-size="12" fill="#111318">have the ball. Sell it all the way —</text>
<text x="331" y="800" font-size="12" fill="#111318">you are the reason the defense goes</text>
<text x="331" y="816" font-size="12" fill="#111318">the wrong way.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="834" font-size="12" fill="#111318">Bubble out around the right tight</text>
<text x="331" y="850" font-size="12" fill="#111318">end, then block the right outside</text>
<text x="331" y="868" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="874" x2="576" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">The fake has to look real: the quarterback puts the ball at the left halfback's</text>
<text x="18" y="930" font-size="12" fill="#111318">belly and pulls it back out.</text>
<text x="18" y="946" font-size="12" fill="#111318">The left halfback's fake is the play. If he jogs, nobody follows him and the</text>
<text x="18" y="964" font-size="12" fill="#111318">defense is waiting on the right.</text>
<text x="18" y="980" font-size="12" fill="#111318">After the fake the quarterback gets back to the right fast, stays behind the</text>
<text x="18" y="998" font-size="12" fill="#111318">right halfback until the block is made, then turns it up.</text>
</svg>