<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Seal the edge. Block the end over you</text>
<text x="52" y="596" font-size="12" fill="#111318">and turn him inside — the quarterback</text>
<text x="52" y="612" font-size="12" fill="#111318">is going around behind you, so he</text>
<text x="52" y="630" font-size="12" fill="#111318">cannot be allowed to follow him out.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Reach the tackle on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Get your head across him —</text>
<text x="52" y="680" font-size="12" fill="#111318">he cannot be allowed to run down the</text>
<text x="52" y="698" font-size="12" fill="#111318">line after this.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="732" font-size="12" fill="#111318">middle linebacker and cut him off</text>
<text x="52" y="748" font-size="12" fill="#111318">from the sideline.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Reach the nose. Get your head across</text>
<text x="52" y="782" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="816" font-size="12" fill="#111318">backside — nothing chases this from</text>
<text x="52" y="834" font-size="12" fill="#111318">behind.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="868" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="884" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Block the corner over you and drive</text>
<text x="331" y="646" font-size="12" fill="#111318">him toward the sideline. You moved</text>
<text x="331" y="664" font-size="12" fill="#111318">over here for this block — he is the</text>
<text x="331" y="680" font-size="12" fill="#111318">only man out there who can catch the</text>
<text x="331" y="698" font-size="12" fill="#111318">quarterback.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Show the ball to the back going</text>
<text x="331" y="732" font-size="12" fill="#111318">right, pull it in on your back hip,</text>
<text x="331" y="748" font-size="12" fill="#111318">and get outside our end. Tuck it on</text>
<text x="331" y="766" font-size="12" fill="#111318">the first step and go north the</text>
<text x="331" y="782" font-size="12" fill="#111318">moment the edge is sealed — do not</text>
<text x="331" y="800" font-size="12" fill="#111318">drift sideways looking for more.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="816" font-size="12" fill="#111318">Get outside our end ahead of the</text>
<text x="331" y="834" font-size="12" fill="#111318">quarterback and block the first man</text>
<text x="331" y="850" font-size="12" fill="#111318">outside. He is running off your</text>
<text x="331" y="868" font-size="12" fill="#111318">shoulder, so do not let that man</text>
<text x="331" y="884" font-size="12" fill="#111318">cross your face to the inside.</text>
<text x="297" y="902" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="902" font-size="12" fill="#111318">Run the sweep path away at full speed</text>
<text x="331" y="918" font-size="12" fill="#111318">with your arms tucked. You are the</text>
<text x="331" y="936" font-size="12" fill="#111318">lie, and the linebackers only leave</text>
<text x="331" y="952" font-size="12" fill="#111318">if you are worth watching.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Blocked exactly like Pitch — the line does not learn a new rule, only a new name.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Say that out loud when you install it.</text>
<text x="18" y="1032" font-size="12" fill="#111318">This is the one play that moves the split man, so the huddle hears which side he</text>
<text x="18" y="1048" font-size="12" fill="#111318">is on: Z Right or Z Left. Count seven on the line before the snap like always.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The fake is the play. If nobody looks at the back going the other way, the</text>
<text x="18" y="1082" font-size="12" fill="#111318">quarterback is running straight into a linebacker who never left.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The quarterback is a runner here and nothing else. Tuck it on the first step, get</text>
<text x="18" y="1116" font-size="12" fill="#111318">to the edge, and turn up — a quarterback who drifts sideways looking for more</text>
<text x="18" y="1134" font-size="12" fill="#111318">gets caught from behind.</text>
<text x="18" y="1150" font-size="12" fill="#111318">Do not call it until Pitch has been working. Their corner has to believe the ball</text>
<text x="18" y="1168" font-size="12" fill="#111318">is going wide before a keep inside him is worth anything.</text>
</svg>