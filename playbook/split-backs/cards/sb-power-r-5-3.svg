<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="630" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="646" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="782" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="800" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Leave the defensive end — he is kicked</text>
<text x="344" y="596" font-size="12" fill="#111318">out. Go take the outside linebacker.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="612" font-size="12" fill="#111318">Kick the defensive end out. Aim at his</text>
<text x="344" y="630" font-size="12" fill="#111318">outside hip. Never let him come</text>
<text x="344" y="646" font-size="12" fill="#111318">underneath you.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Open right and hand deep to the left</text>
<text x="344" y="680" font-size="12" fill="#111318">halfback as he crosses, then fake the</text>
<text x="344" y="698" font-size="12" fill="#111318">boot. It holds the backside end.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Cross behind the quarterback, take the</text>
<text x="344" y="732" font-size="12" fill="#111318">handoff and hit it downhill at our</text>
<text x="344" y="748" font-size="12" fill="#111318">tackle's outside hip. Never bounce it</text>
<text x="344" y="766" font-size="12" fill="#111318">outside.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="782" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="800" font-size="12" fill="#111318">man who shows in it.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The same Power as the Regular I, run from two backs instead of a stack. The slot</text>
<text x="18" y="862" font-size="12" fill="#111318">kicks the end out and the right halfback leads through the hole.</text>
<text x="18" y="878" font-size="12" fill="#111318">The runner is the back on the far side. He has further to travel, so he has to start</text>
<text x="18" y="896" font-size="12" fill="#111318">on the snap -- no false step, no waiting to see the hole.</text>
<text x="18" y="912" font-size="12" fill="#111318">The yards are inside the slot's kick-out. If the halfback bounces it wide looking for</text>
<text x="18" y="930" font-size="12" fill="#111318">grass, the play is dead.</text>
</svg>