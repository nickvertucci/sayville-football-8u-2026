<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Seal the edge. Block the end over you</text>
<text x="52" y="596" font-size="12" fill="#111318">and turn him inside — the ball comes</text>
<text x="52" y="612" font-size="12" fill="#111318">back around behind you, so he cannot</text>
<text x="52" y="630" font-size="12" fill="#111318">be allowed to follow it out.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Reach the tackle on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder and get your head across</text>
<text x="52" y="680" font-size="12" fill="#111318">him. The ball is coming back to your</text>
<text x="52" y="698" font-size="12" fill="#111318">side, so he cannot run down the line</text>
<text x="52" y="714" font-size="12" fill="#111318">after it.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="748" font-size="12" fill="#111318">middle linebacker and cut him off</text>
<text x="52" y="766" font-size="12" fill="#111318">from the sideline the ball is going</text>
<text x="52" y="782" font-size="12" fill="#111318">to.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="800" font-size="12" fill="#111318">Reach the nose to your left. Get your</text>
<text x="52" y="816" font-size="12" fill="#111318">head across that shoulder — the ball</text>
<text x="52" y="834" font-size="12" fill="#111318">finishes on that side, whatever the</text>
<text x="52" y="850" font-size="12" fill="#111318">backfield is doing.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="868" font-size="12" fill="#111318">Nobody is over you. Cut off behind</text>
<text x="52" y="884" font-size="12" fill="#111318">you. This play takes a long time and</text>
<text x="52" y="902" font-size="12" fill="#111318">everything that catches it comes from</text>
<text x="52" y="918" font-size="12" fill="#111318">here.</text>
<text x="18" y="936" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="936" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="952" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="970" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you and drive him</text>
<text x="331" y="596" font-size="12" fill="#111318">out, exactly like the Keep. He is the</text>
<text x="331" y="612" font-size="12" fill="#111318">one man quick enough to catch this</text>
<text x="331" y="630" font-size="12" fill="#111318">from behind, and he only stays put if</text>
<text x="331" y="646" font-size="12" fill="#111318">your block looks the same as it</text>
<text x="331" y="664" font-size="12" fill="#111318">always does.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="680" font-size="12" fill="#111318">Come back behind the line the moment</text>
<text x="331" y="698" font-size="12" fill="#111318">the ball is snapped, take the pitch</text>
<text x="331" y="714" font-size="12" fill="#111318">going the other way, and get outside</text>
<text x="331" y="732" font-size="12" fill="#111318">our end. Stay behind the quarterback</text>
<text x="331" y="748" font-size="12" fill="#111318">until you have it — a pitch that goes</text>
<text x="331" y="766" font-size="12" fill="#111318">forward is a fumble.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="782" font-size="12" fill="#111318">Start the Keep right — same first</text>
<text x="331" y="800" font-size="12" fill="#111318">three steps, same ball on the hip —</text>
<text x="331" y="816" font-size="12" fill="#111318">then pitch it back underneath to the</text>
<text x="331" y="834" font-size="12" fill="#111318">split man crossing your face. Pitch</text>
<text x="331" y="850" font-size="12" fill="#111318">it back, never forward, then keep</text>
<text x="331" y="868" font-size="12" fill="#111318">running the Keep as if you still have</text>
<text x="331" y="884" font-size="12" fill="#111318">it.</text>
<text x="297" y="902" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="902" font-size="12" fill="#111318">Get outside our end ahead of the ball</text>
<text x="331" y="918" font-size="12" fill="#111318">and block the first man outside.</text>
<text x="331" y="936" font-size="12" fill="#111318">Everybody else on this play is</text>
<text x="331" y="952" font-size="12" fill="#111318">telling a lie — you are the only</text>
<text x="331" y="970" font-size="12" fill="#111318">blocker out here, so you cannot miss.</text>
<text x="297" y="986" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="986" font-size="12" fill="#111318">Run your Keep block exactly the way</text>
<text x="331" y="1004" font-size="12" fill="#111318">you always run it. You are blocking</text>
<text x="331" y="1020" font-size="12" fill="#111318">for a quarterback who does not have</text>
<text x="331" y="1038" font-size="12" fill="#111318">the ball, and the moment you do that</text>
<text x="331" y="1054" font-size="12" fill="#111318">at half speed this play stops working</text>
<text x="331" y="1072" font-size="12" fill="#111318">forever.</text>
<line x1="18" y1="1078" x2="576" y2="1078" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="1096" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="1116" font-size="12" fill="#111318">This is the Keep Right for the first second and a half, and that is the whole</text>
<text x="18" y="1134" font-size="12" fill="#111318">play. Install it the week after the Keep has hurt somebody, never before.</text>
<text x="18" y="1150" font-size="12" fill="#111318">The far back leaves on the same track he leaves on for the Keep — the difference</text>
<text x="18" y="1168" font-size="12" fill="#111318">is that this time somebody is following him. The defense cannot tell those two</text>
<text x="18" y="1184" font-size="12" fill="#111318">apart, which is the point.</text>
<text x="18" y="1202" font-size="12" fill="#111318">The pitch goes backward. Teach it as a flip to a man running past behind you, not</text>
<text x="18" y="1218" font-size="12" fill="#111318">a throw to a man ahead of you.</text>
<text x="18" y="1236" font-size="12" fill="#111318">The near back blocks for a quarterback with no ball. Tell him that out loud, then</text>
<text x="18" y="1252" font-size="12" fill="#111318">tell him it is the reason the play scores.</text>
<text x="18" y="1270" font-size="12" fill="#111318">The split man is the slowest-developing ball carrier in the book. If the line</text>
<text x="18" y="1286" font-size="12" fill="#111318">cannot hold its blocks for a three count, run Pitch instead.</text>
</svg>