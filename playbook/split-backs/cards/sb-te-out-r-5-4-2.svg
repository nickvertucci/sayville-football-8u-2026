<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="596" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="646" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="664" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="698" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="714" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="748" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="766" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="800" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="816" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="850" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="868" font-size="12" fill="#111318">quarterback.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Take one step up, then slant out flat</text>
<text x="344" y="596" font-size="12" fill="#111318">toward the right sideline, almost along</text>
<text x="344" y="612" font-size="12" fill="#111318">the line of scrimmage. Look for the</text>
<text x="344" y="630" font-size="12" fill="#111318">ball right away.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="646" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="344" y="664" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Take the snap, take one step and throw</text>
<text x="344" y="698" font-size="12" fill="#111318">to the right tight end as he slants</text>
<text x="344" y="714" font-size="12" fill="#111318">out. If he is covered, tuck it and run.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Step up and out, hands up. Pick up</text>
<text x="344" y="748" font-size="12" fill="#111318">anybody coming at the quarterback.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="766" font-size="12" fill="#111318">Step up and out, hands up. Pick up</text>
<text x="344" y="782" font-size="12" fill="#111318">anybody coming at the quarterback.</text>
<line x1="18" y1="874" x2="603" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">Everybody but the tight end and the SL pass blocks: step back, hands up, stay between</text>
<text x="18" y="930" font-size="12" fill="#111318">your man and the quarterback.</text>
<text x="18" y="946" font-size="12" fill="#111318">The slant stays flat — one step up and out, almost on the line of scrimmage. Any</text>
<text x="18" y="964" font-size="12" fill="#111318">deeper and he runs into the linebackers.</text>
<text x="18" y="980" font-size="12" fill="#111318">The quarterback throws it as soon as the tight end clears the end. If he is covered,</text>
<text x="18" y="998" font-size="12" fill="#111318">tuck it and run — no second look.</text>
</svg>