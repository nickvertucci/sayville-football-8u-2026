<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="52" y="596" font-size="12" fill="#111318">out toward the sideline. The ball</text>
<text x="52" y="612" font-size="12" fill="#111318">goes inside you — he cannot be the</text>
<text x="52" y="630" font-size="12" fill="#111318">one who makes the tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Double the nose with the man beside</text>
<text x="52" y="714" font-size="12" fill="#111318">you and drive him off the spot, then</text>
<text x="52" y="732" font-size="12" fill="#111318">come off onto the middle linebacker</text>
<text x="52" y="748" font-size="12" fill="#111318">when he shows.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Reach the nose to your left. Get your</text>
<text x="52" y="782" font-size="12" fill="#111318">head across that shoulder so he</text>
<text x="52" y="800" font-size="12" fill="#111318">cannot run down the line after the</text>
<text x="52" y="816" font-size="12" fill="#111318">ball.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="834" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="850" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="52" y="868" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="902" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="918" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="331" y="612" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="331" y="630" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="331" y="664" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="331" y="680" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Fake the pitch to the right, then</text>
<text x="331" y="714" font-size="12" fill="#111318">turn back and hand the ball to the</text>
<text x="331" y="732" font-size="12" fill="#111318">other back coming across. The fake</text>
<text x="331" y="748" font-size="12" fill="#111318">comes first.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="766" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="331" y="782" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="331" y="800" font-size="12" fill="#111318">the lie.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="816" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="331" y="834" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="331" y="850" font-size="12" fill="#111318">behind the down blocks.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="980" font-size="12" fill="#111318">No pullers and no lead blocker, so this hits faster than Power off exactly the</text>
<text x="18" y="998" font-size="12" fill="#111318">same line rules. The line has to hold its blocks while the ball carrier crosses.</text>
<text x="18" y="1014" font-size="12" fill="#111318">There is no crack block on this side — the Z is on the other end of the</text>
<text x="18" y="1032" font-size="12" fill="#111318">formation. The playside guard's climb to the middle linebacker has to be on time</text>
<text x="18" y="1048" font-size="12" fill="#111318">or there is nobody else for him.</text>
<text x="18" y="1066" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
<text x="18" y="1082" font-size="12" fill="#111318">The Z lines up on the right, so on this one he is cutting off the backside</text>
<text x="18" y="1100" font-size="12" fill="#111318">instead of cracking the playside linebacker the way he does on Counter Right.</text>
<text x="18" y="1116" font-size="12" fill="#111318">That linebacker is unblocked in every front — the near back's fake has to hold</text>
<text x="18" y="1134" font-size="12" fill="#111318">him for a count or this play is a two-yard gain.</text>
<text x="18" y="1150" font-size="12" fill="#111318">Nobody blocks outside our end on this one — no kick-out and no puller. Against a</text>
<text x="18" y="1168" font-size="12" fill="#111318">four-linebacker front their outside linebacker is free, so if they are playing</text>
<text x="18" y="1184" font-size="12" fill="#111318">four, go get the edge with Pitch or Keep instead.</text>
</svg>