<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Climb to the playside linebacker.</text>
<text x="331" y="630" font-size="12" fill="#111318">Head across him. Leave like it is a</text>
<text x="331" y="646" font-size="12" fill="#111318">route so he never sees you. Not low.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="664" font-size="12" fill="#111318">Fake the pitch to the left, then turn</text>
<text x="331" y="680" font-size="12" fill="#111318">back and hand the ball to the other</text>
<text x="331" y="698" font-size="12" fill="#111318">back coming across. The fake comes</text>
<text x="331" y="714" font-size="12" fill="#111318">first.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="732" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="331" y="748" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="331" y="766" font-size="12" fill="#111318">behind the down blocks.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="782" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="331" y="800" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="331" y="816" font-size="12" fill="#111318">the lie.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="878" font-size="12" fill="#111318">No lead blocker at all, so this hits faster than Power off exactly the same line</text>
<text x="18" y="896" font-size="12" fill="#111318">rules. The line has to hold its blocks while the ball carrier crosses.</text>
<text x="18" y="912" font-size="12" fill="#111318">The Z's crack on the playside linebacker is what springs this one. Drill it on</text>
<text x="18" y="930" font-size="12" fill="#111318">its own, and drill leaving flat and low-shouldered so it looks like a route until</text>
<text x="18" y="946" font-size="12" fill="#111318">it is too late.</text>
<text x="18" y="964" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
<text x="18" y="980" font-size="12" fill="#111318">Against a four-linebacker front there is an outside linebacker nobody blocks. The</text>
<text x="18" y="998" font-size="12" fill="#111318">Z cracks the inside one, so it is the outside one who is free — if he keeps</text>
<text x="18" y="1014" font-size="12" fill="#111318">making the tackle, the answer is the Pitch, which gets outside him instead of</text>
<text x="18" y="1032" font-size="12" fill="#111318">running at him.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Nobody blocks outside our end on this one — no kick-out and nobody leading out</text>
<text x="18" y="1066" font-size="12" fill="#111318">there. Against a four-linebacker front their outside linebacker is free, so if</text>
<text x="18" y="1082" font-size="12" fill="#111318">they are playing four, go get the edge with Pitch or Keep instead.</text>
</svg>