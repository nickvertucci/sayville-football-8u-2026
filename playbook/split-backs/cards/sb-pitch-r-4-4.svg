<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Cut him off from the play — get your</text>
<text x="52" y="612" font-size="12" fill="#111318">body between him and the ball. You</text>
<text x="52" y="630" font-size="12" fill="#111318">are the last one to it, so never quit</text>
<text x="52" y="646" font-size="12" fill="#111318">on it.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="680" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="698" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">The tackle is head up on you. Cut him</text>
<text x="52" y="732" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="52" y="748" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="52" y="766" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="800" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="52" y="816" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="52" y="834" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="850" font-size="12" fill="#111318">The tackle is head up on you. Step</text>
<text x="52" y="868" font-size="12" fill="#111318">past him. Climb to the playside</text>
<text x="52" y="884" font-size="12" fill="#111318">linebacker and get your head across</text>
<text x="52" y="902" font-size="12" fill="#111318">him — he is the man who makes this</text>
<text x="52" y="918" font-size="12" fill="#111318">tackle if nobody gets to him.</text>
<text x="18" y="936" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="936" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="952" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="970" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="331" y="596" font-size="12" fill="#111318">Turn him inside and wall him off. The</text>
<text x="331" y="612" font-size="12" fill="#111318">ball goes around behind you, so he</text>
<text x="331" y="630" font-size="12" fill="#111318">cannot follow it out.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Run at the corner on your side and</text>
<text x="331" y="664" font-size="12" fill="#111318">screen him off. Get in his way and</text>
<text x="331" y="680" font-size="12" fill="#111318">stay there — do not go looking for a</text>
<text x="331" y="698" font-size="12" fill="#111318">knockdown.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Fake the dive to the near back,</text>
<text x="331" y="732" font-size="12" fill="#111318">attack the outside, and pitch the</text>
<text x="331" y="748" font-size="12" fill="#111318">ball to the trailing back before you</text>
<text x="331" y="766" font-size="12" fill="#111318">get touched. Pitch early, not late.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="782" font-size="12" fill="#111318">Run flat behind everybody, stay</text>
<text x="331" y="800" font-size="12" fill="#111318">outside and behind the quarterback,</text>
<text x="331" y="816" font-size="12" fill="#111318">and catch the pitch on the run. Never</text>
<text x="331" y="834" font-size="12" fill="#111318">get ahead of him — a pitch that goes</text>
<text x="331" y="850" font-size="12" fill="#111318">forward is a fumble.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="868" font-size="12" fill="#111318">Lead outside our end and block the</text>
<text x="331" y="884" font-size="12" fill="#111318">first defender out there — in this</text>
<text x="331" y="902" font-size="12" fill="#111318">front it is the linebacker. Get your</text>
<text x="331" y="918" font-size="12" fill="#111318">head across him; do not wait for him</text>
<text x="331" y="936" font-size="12" fill="#111318">to come to you. Step at the dive</text>
<text x="331" y="952" font-size="12" fill="#111318">first to hold their linebackers.</text>
<line x1="18" y1="976" x2="576" y2="976" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="994" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="1014" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it</text>
<text x="18" y="1032" font-size="12" fill="#111318">on the ground.</text>
<text x="18" y="1048" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The back taking the pitch must stay behind the quarterback until he has the ball.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Getting ahead means the pitch goes forward, which is a fumble waiting to happen.</text>
<text x="18" y="1100" font-size="12" fill="#111318">Everything depends on the corner being blocked, and out here the split man does</text>
<text x="18" y="1116" font-size="12" fill="#111318">it — which is what frees both backs to fake and lead. Drill him on beating the</text>
<text x="18" y="1134" font-size="12" fill="#111318">corner to the spot without holding.</text>
</svg>