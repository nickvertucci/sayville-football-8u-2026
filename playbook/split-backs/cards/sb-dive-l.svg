<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="52" y="596" font-size="12" fill="#111318">out and away from the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="646" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody is over you. Double the nose</text>
<text x="52" y="680" font-size="12" fill="#111318">with the center, and come off onto</text>
<text x="52" y="698" font-size="12" fill="#111318">the middle linebacker when he shows.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You and the playside guard double the</text>
<text x="52" y="732" font-size="12" fill="#111318">nose. Drive him off the spot — the</text>
<text x="52" y="748" font-size="12" fill="#111318">hole is left off his back.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Step back inside</text>
<text x="52" y="782" font-size="12" fill="#111318">and cut off anyone chasing through</text>
<text x="52" y="800" font-size="12" fill="#111318">the middle.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Get your head across him</text>
<text x="52" y="850" font-size="12" fill="#111318">and wall him off so he cannot chase.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Sprint at the corner over you and</text>
<text x="331" y="646" font-size="12" fill="#111318">screen him off. The ball is going</text>
<text x="331" y="664" font-size="12" fill="#111318">away from you, so he is the one man</text>
<text x="331" y="680" font-size="12" fill="#111318">on your side who can still run it</text>
<text x="331" y="698" font-size="12" fill="#111318">down.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Take the snap, open left and hand the</text>
<text x="331" y="732" font-size="12" fill="#111318">ball to the near back at two yards.</text>
<text x="331" y="748" font-size="12" fill="#111318">Then carry out the pitch fake the</text>
<text x="331" y="766" font-size="12" fill="#111318">other way.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="782" font-size="12" fill="#111318">Aim at the outside hip of the center,</text>
<text x="331" y="800" font-size="12" fill="#111318">right off the double team. Take the</text>
<text x="331" y="816" font-size="12" fill="#111318">ball and get north — there is no hole</text>
<text x="331" y="834" font-size="12" fill="#111318">to look for.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="850" font-size="12" fill="#111318">Run the pitch path away at full speed</text>
<text x="331" y="868" font-size="12" fill="#111318">with your arms tucked. You are the</text>
<text x="331" y="884" font-size="12" fill="#111318">lie.</text>
<line x1="18" y1="892" x2="576" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Snap to handoff should be under a second. If the back is waiting on the ball, the</text>
<text x="18" y="946" font-size="12" fill="#111318">play is already dead.</text>
<text x="18" y="964" font-size="12" fill="#111318">The back away from the ball runs his pitch path every single time. Two backs</text>
<text x="18" y="980" font-size="12" fill="#111318">means the fake is half the play, not a spare part of it.</text>
<text x="18" y="998" font-size="12" fill="#111318">The ball carrier runs at a spot, not at a defender. Give him the outside hip of</text>
<text x="18" y="1014" font-size="12" fill="#111318">the center and let him go.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Run it both ways. Once their middle linebacker knows which gap the dive hits, it</text>
<text x="18" y="1048" font-size="12" fill="#111318">stops being quick.</text>
</svg>