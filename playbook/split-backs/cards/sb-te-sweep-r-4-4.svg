<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion.</text>
<text x="52" y="596" font-size="12" fill="#111318">At the snap run flat behind the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback, take the handoff at full</text>
<text x="52" y="630" font-size="12" fill="#111318">speed and get to the right edge. Turn</text>
<text x="52" y="646" font-size="12" fill="#111318">up outside the halfbacks.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="714" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="748" font-size="12" fill="#111318">Help on the right defensive guard, then</text>
<text x="52" y="766" font-size="12" fill="#111318">block the right inside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="612" font-size="12" fill="#111318">Stay in his way.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="630" font-size="12" fill="#111318">Open right and hand the ball to the</text>
<text x="344" y="646" font-size="12" fill="#111318">left tight end as he comes across</text>
<text x="344" y="664" font-size="12" fill="#111318">behind you, then fake a run to the</text>
<text x="344" y="680" font-size="12" fill="#111318">left.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="698" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="714" font-size="12" fill="#111318">team the linebacker with the right</text>
<text x="344" y="732" font-size="12" fill="#111318">halfback.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="748" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="766" font-size="12" fill="#111318">team the linebacker with the left</text>
<text x="344" y="782" font-size="12" fill="#111318">halfback.</text>
<line x1="18" y1="790" x2="603" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance, so the play is legal and</text>
<text x="18" y="844" font-size="12" fill="#111318">nothing tips it off.</text>
<text x="18" y="862" font-size="12" fill="#111318">The handoff is the whole play: the quarterback opens right and puts the ball in the</text>
<text x="18" y="878" font-size="12" fill="#111318">end's belly at full speed, then carries out his fake.</text>
<text x="18" y="896" font-size="12" fill="#111318">Both halfbacks bubble out to the right ahead of the end and double team the outside</text>
<text x="18" y="912" font-size="12" fill="#111318">linebacker together. Two of them on him is what gets the end around the corner.</text>
</svg>