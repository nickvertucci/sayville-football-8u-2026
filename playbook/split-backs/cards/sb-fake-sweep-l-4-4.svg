<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder. Turn</text>
<text x="52" y="596" font-size="12" fill="#111318">him inside. The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="630" font-size="12" fill="#111318">downfield and get the left inside linebacker.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="664" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="680" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="714" font-size="12" fill="#111318">downfield and get the right inside linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="748" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="766" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="800" font-size="12" fill="#111318">downfield and get the right outside</text>
<text x="52" y="816" font-size="12" fill="#111318">linebacker.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder. Cut him</text>
<text x="385" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Fake the handoff to the right halfback, then</text>
<text x="385" y="664" font-size="12" fill="#111318">roll back left and sweep it, flat and fast,</text>
<text x="385" y="680" font-size="12" fill="#111318">behind the left halfback. Turn up outside his</text>
<text x="385" y="698" font-size="12" fill="#111318">block.</text>
<text x="351" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="714" font-size="12" fill="#111318">Bubble out around the left tight end, then</text>
<text x="385" y="732" font-size="12" fill="#111318">block the left outside linebacker.</text>
<text x="351" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="748" font-size="12" fill="#111318">Take the fake from the quarterback and run</text>
<text x="385" y="766" font-size="12" fill="#111318">hard to the right like you have the ball. Sell</text>
<text x="385" y="782" font-size="12" fill="#111318">it all the way — you are the reason the</text>
<text x="385" y="800" font-size="12" fill="#111318">defense goes the wrong way.</text>
<line x1="18" y1="824" x2="684" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">The fake has to look real: the quarterback puts the ball at the right halfback's belly and pulls it</text>
<text x="18" y="878" font-size="12" fill="#111318">back out.</text>
<text x="18" y="896" font-size="12" fill="#111318">The right halfback's fake is the play. If he jogs, nobody follows him and the defense is waiting on</text>
<text x="18" y="912" font-size="12" fill="#111318">the left.</text>
<text x="18" y="930" font-size="12" fill="#111318">After the fake the quarterback gets back to the left fast, stays behind the left halfback until the</text>
<text x="18" y="946" font-size="12" fill="#111318">block is made, then turns it up.</text>
</svg>