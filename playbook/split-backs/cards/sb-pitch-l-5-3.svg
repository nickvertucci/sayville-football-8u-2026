<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="331" y="630" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Open left, get to the edge, and pitch</text>
<text x="331" y="664" font-size="12" fill="#111318">the ball to the trailing back before</text>
<text x="331" y="680" font-size="12" fill="#111318">you get touched. There is no dive</text>
<text x="331" y="698" font-size="12" fill="#111318">fake on this one — sell it with your</text>
<text x="331" y="714" font-size="12" fill="#111318">eyes and get out there.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="732" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="748" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="766" font-size="12" fill="#111318">corner.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="782" font-size="12" fill="#111318">Run flat behind everybody, stay</text>
<text x="331" y="800" font-size="12" fill="#111318">outside and behind the quarterback,</text>
<text x="331" y="816" font-size="12" fill="#111318">and catch the pitch on the run. Never</text>
<text x="331" y="834" font-size="12" fill="#111318">get ahead of him — a pitch that goes</text>
<text x="331" y="850" font-size="12" fill="#111318">forward is a fumble.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it</text>
<text x="18" y="912" font-size="12" fill="#111318">on the ground.</text>
<text x="18" y="930" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="946" font-size="12" fill="#111318">The back taking the pitch must stay behind the quarterback until he has the ball.</text>
<text x="18" y="964" font-size="12" fill="#111318">Getting ahead means the pitch goes forward, which is a fumble waiting to happen.</text>
<text x="18" y="980" font-size="12" fill="#111318">Everything depends on the corner being blocked and there is no receiver on this</text>
<text x="18" y="998" font-size="12" fill="#111318">side to do it, so the near back leaves early and there is no fake to hold</text>
<text x="18" y="1014" font-size="12" fill="#111318">anybody. If their corner is quick, call it to the other side instead.</text>
</svg>