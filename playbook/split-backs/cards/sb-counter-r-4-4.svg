<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="52" y="596" font-size="12" fill="#111318">Cut him off from the play — get your</text>
<text x="52" y="612" font-size="12" fill="#111318">body between him and the ball. You</text>
<text x="52" y="630" font-size="12" fill="#111318">are the last one to it, so never quit</text>
<text x="52" y="646" font-size="12" fill="#111318">on it.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="680" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="698" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">The tackle is head up on you. Cut him</text>
<text x="52" y="732" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="52" y="748" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="52" y="766" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="800" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="52" y="816" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="52" y="834" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="850" font-size="12" fill="#111318">The tackle is head up on you. Hands</text>
<text x="52" y="868" font-size="12" fill="#111318">inside, pads under his, and drive him</text>
<text x="52" y="884" font-size="12" fill="#111318">straight back.</text>
<text x="18" y="902" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="902" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="918" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="936" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="331" y="596" font-size="12" fill="#111318">Drive him out toward the sideline.</text>
<text x="331" y="612" font-size="12" fill="#111318">The ball goes inside you — he cannot</text>
<text x="331" y="630" font-size="12" fill="#111318">be the one who makes the tackle.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="331" y="664" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="331" y="680" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="331" y="698" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="331" y="714" font-size="12" fill="#111318">Leave like you are running a route so</text>
<text x="331" y="732" font-size="12" fill="#111318">he never sees you coming, and do not</text>
<text x="331" y="748" font-size="12" fill="#111318">go low.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="766" font-size="12" fill="#111318">Fake the pitch to the left, then turn</text>
<text x="331" y="782" font-size="12" fill="#111318">back and hand the ball to the other</text>
<text x="331" y="800" font-size="12" fill="#111318">back coming across. The fake comes</text>
<text x="331" y="816" font-size="12" fill="#111318">first.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="834" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="331" y="850" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="331" y="868" font-size="12" fill="#111318">behind the down blocks.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="884" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="331" y="902" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="331" y="918" font-size="12" fill="#111318">the lie.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="998" font-size="12" fill="#111318">No pullers and no lead blocker, so this hits faster than Power off exactly the</text>
<text x="18" y="1014" font-size="12" fill="#111318">same line rules. The line has to hold its blocks while the ball carrier crosses.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The Z's crack on the playside linebacker is what springs this one. Drill it on</text>
<text x="18" y="1048" font-size="12" fill="#111318">its own, and drill leaving flat and low-shouldered so it looks like a route until</text>
<text x="18" y="1066" font-size="12" fill="#111318">it is too late.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
<text x="18" y="1100" font-size="12" fill="#111318">Against a four-linebacker front there is an outside linebacker nobody blocks. The</text>
<text x="18" y="1116" font-size="12" fill="#111318">Z cracks the inside one, so it is the outside one who is free — if he keeps</text>
<text x="18" y="1134" font-size="12" fill="#111318">making the tackle, the answer is the Pitch, which gets outside him instead of</text>
<text x="18" y="1150" font-size="12" fill="#111318">running at him.</text>
<text x="18" y="1168" font-size="12" fill="#111318">Nobody blocks outside our end on this one — no kick-out and no puller. Against a</text>
<text x="18" y="1184" font-size="12" fill="#111318">four-linebacker front their outside linebacker is free, so if they are playing</text>
<text x="18" y="1202" font-size="12" fill="#111318">four, go get the edge with Pitch or Keep instead.</text>
</svg>