<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="680" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="748" font-size="12" fill="#111318">Climb to the playside linebacker. Head</text>
<text x="52" y="766" font-size="12" fill="#111318">across him.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="344" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="344" y="612" font-size="12" fill="#111318">you.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="630" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="646" font-size="12" fill="#111318">Stay in his way.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Fake to the back going left, hide the</text>
<text x="344" y="680" font-size="12" fill="#111318">ball, get outside our end. Turn up the</text>
<text x="344" y="698" font-size="12" fill="#111318">moment the edge seals.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Run the sweep path away full speed,</text>
<text x="344" y="732" font-size="12" fill="#111318">arms tucked. Linebackers only leave if</text>
<text x="344" y="748" font-size="12" fill="#111318">you are worth watching.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="766" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="782" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="800" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="824" x2="603" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Blocked exactly like Pitch — the line does not learn a new rule, only a new name. Say</text>
<text x="18" y="878" font-size="12" fill="#111318">that out loud when you install it.</text>
<text x="18" y="896" font-size="12" fill="#111318">This is the one play that moves the split man, so the huddle hears which side he is</text>
<text x="18" y="912" font-size="12" fill="#111318">on: SL Right or SL Left. Count seven on the line before the snap like always.</text>
<text x="18" y="930" font-size="12" fill="#111318">The fake is the play. If nobody looks at the back going the other way, the</text>
<text x="18" y="946" font-size="12" fill="#111318">quarterback is running straight into a linebacker who never left.</text>
<text x="18" y="964" font-size="12" fill="#111318">Do not call it until Pitch has been working. Their corner has to believe the ball is</text>
<text x="18" y="980" font-size="12" fill="#111318">going wide before a keep inside him is worth anything.</text>
</svg>