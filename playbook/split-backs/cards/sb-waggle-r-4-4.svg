<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards. You are the second</text>
<text x="52" y="630" font-size="12" fill="#111318">look and you arrive late on purpose.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Block down on the tackle — he is head</text>
<text x="52" y="714" font-size="12" fill="#111318">up on you. Get your head across him;</text>
<text x="52" y="732" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="766" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="52" y="782" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">The tackle is head up on you. Hands</text>
<text x="52" y="816" font-size="12" fill="#111318">inside, pads under his, and drive him</text>
<text x="52" y="834" font-size="12" fill="#111318">straight back.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="868" font-size="12" fill="#111318">Nobody comes free past you — the</text>
<text x="52" y="884" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="331" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="331" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Run straight down the field and take</text>
<text x="331" y="664" font-size="12" fill="#111318">the corner with you. Nobody is</text>
<text x="331" y="680" font-size="12" fill="#111318">throwing you the ball — you are the</text>
<text x="331" y="698" font-size="12" fill="#111318">reason the flat is empty.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Fake the dive to the near back with</text>
<text x="331" y="732" font-size="12" fill="#111318">both hands, hide the ball on your</text>
<text x="331" y="748" font-size="12" fill="#111318">back hip, and get to the edge. Run it</text>
<text x="331" y="766" font-size="12" fill="#111318">if it is open. Only throw if a</text>
<text x="331" y="782" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="800" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="331" y="816" font-size="12" fill="#111318">Nobody comes free past you — the</text>
<text x="331" y="834" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="331" y="850" font-size="12" fill="#111318">Cross behind the line to the waggle</text>
<text x="331" y="868" font-size="12" fill="#111318">side before you set.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="884" font-size="12" fill="#111318">Run the dive path full speed with</text>
<text x="331" y="902" font-size="12" fill="#111318">your arms tucked like you have it,</text>
<text x="331" y="918" font-size="12" fill="#111318">and block the first defender who</text>
<text x="331" y="936" font-size="12" fill="#111318">meets you. You are the lie.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">One pass in this formation is the right number. This is a running offence and the</text>
<text x="18" y="998" font-size="12" fill="#111318">pass exists so the defence cannot put nine men in the box and forget about the</text>
<text x="18" y="1014" font-size="12" fill="#111318">edge.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="1048" font-size="12" fill="#111318">the fake dies.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The dive fake is the whole play. If that back does not get hit by somebody, he</text>
<text x="18" y="1082" font-size="12" fill="#111318">did not sell it.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The Z running off the corner is what empties the flat. He never gets the ball on</text>
<text x="18" y="1116" font-size="12" fill="#111318">this one and he sprints anyway — the day he jogs is the day the corner sits on</text>
<text x="18" y="1134" font-size="12" fill="#111318">the tight end.</text>
<text x="18" y="1150" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1168" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1184" font-size="12" fill="#111318">Run first, throw second. One throw, then tuck it — no scrambling backwards, ever.</text>
</svg>