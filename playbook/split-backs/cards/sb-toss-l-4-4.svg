<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Block the left inside linebacker.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="612" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="630" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="646" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right inside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">Block the left corner.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Quick pitch to the right halfback, then</text>
<text x="344" y="630" font-size="12" fill="#111318">run the other way, to the right, like</text>
<text x="344" y="646" font-size="12" fill="#111318">you still have it.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="664" font-size="12" fill="#111318">Bubble around the left tight end, then</text>
<text x="344" y="680" font-size="12" fill="#111318">block the left outside linebacker.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="698" font-size="12" fill="#111318">Run flat, outside and behind the</text>
<text x="344" y="714" font-size="12" fill="#111318">quarterback, and catch the pitch on the</text>
<text x="344" y="732" font-size="12" fill="#111318">run. Ahead of him is a fumble.</text>
<line x1="18" y1="738" x2="603" y2="738" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="756" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="776" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on</text>
<text x="18" y="794" font-size="12" fill="#111318">the ground.</text>
<text x="18" y="810" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="828" font-size="12" fill="#111318">Everything depends on the edge being blocked, and out here the split man does it —</text>
<text x="18" y="844" font-size="12" fill="#111318">which is what frees both backs to fake and lead. Drill him on beating that man to the</text>
<text x="18" y="862" font-size="12" fill="#111318">spot without holding.</text>
</svg>