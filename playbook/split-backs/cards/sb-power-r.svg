<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="52" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="646" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="664" font-size="12" fill="#111318">your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="698" font-size="12" fill="#111318">backside.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="732" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="748" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Climb straight to</text>
<text x="52" y="782" font-size="12" fill="#111318">the middle linebacker and take him</text>
<text x="52" y="800" font-size="12" fill="#111318">wherever he goes.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="850" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you and drive him</text>
<text x="331" y="596" font-size="12" fill="#111318">out, away from the hole. Nobody is</text>
<text x="331" y="612" font-size="12" fill="#111318">kicking him out for you — he is</text>
<text x="331" y="630" font-size="12" fill="#111318">yours.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Stalk the corner over you and stay in</text>
<text x="331" y="664" font-size="12" fill="#111318">front of him. If the ball bounces</text>
<text x="331" y="680" font-size="12" fill="#111318">outside, you are the reason it can.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open to the playside and hand deep to</text>
<text x="331" y="714" font-size="12" fill="#111318">the back crossing from the backside.</text>
<text x="331" y="732" font-size="12" fill="#111318">Let him come to you, then fake away.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="748" font-size="12" fill="#111318">You carry it. Cross behind the</text>
<text x="331" y="766" font-size="12" fill="#111318">quarterback, take the handoff deep,</text>
<text x="331" y="782" font-size="12" fill="#111318">then press the outside hip of our</text>
<text x="331" y="800" font-size="12" fill="#111318">tackle and turn up inside the blocks.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="816" font-size="12" fill="#111318">Lead up through the hole and block</text>
<text x="331" y="834" font-size="12" fill="#111318">the playside linebacker. You are the</text>
<text x="331" y="850" font-size="12" fill="#111318">lead blocker — the ball is right</text>
<text x="331" y="868" font-size="12" fill="#111318">behind you.</text>
<line x1="18" y1="874" x2="576" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">Identical blocking to Split Counter. The line learns one set of rules and gets</text>
<text x="18" y="930" font-size="12" fill="#111318">two plays out of it — say that out loud when you install the second one.</text>
<text x="18" y="946" font-size="12" fill="#111318">The near back's block on the playside linebacker is the play. Drill it on its</text>
<text x="18" y="964" font-size="12" fill="#111318">own.</text>
<text x="18" y="980" font-size="12" fill="#111318">The carrier travels further than the blocker, and that is the point — he arrives</text>
<text x="18" y="998" font-size="12" fill="#111318">behind the lead, not beside it.</text>
<text x="18" y="1014" font-size="12" fill="#111318">If the handoff is late, the quarterback is reaching. He holds the ball still and</text>
<text x="18" y="1032" font-size="12" fill="#111318">lets the back run through it.</text>
</svg>