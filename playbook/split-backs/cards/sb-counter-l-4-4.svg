<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Drive</text>
<text x="52" y="596" font-size="12" fill="#111318">him to the sideline. The ball goes</text>
<text x="52" y="612" font-size="12" fill="#111318">inside you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="698" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="732" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="766" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on</text>
<text x="331" y="630" font-size="12" fill="#111318">the play.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Fake the pitch right, then turn back</text>
<text x="331" y="664" font-size="12" fill="#111318">and hand to the back coming across.</text>
<text x="331" y="680" font-size="12" fill="#111318">Fake first.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="698" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="331" y="714" font-size="12" fill="#111318">speed, arms tucked. You are the lie.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="732" font-size="12" fill="#111318">Take two hard steps at the fake, then</text>
<text x="331" y="748" font-size="12" fill="#111318">plant and come back behind the down</text>
<text x="331" y="766" font-size="12" fill="#111318">blocks.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="878" font-size="12" fill="#111318">No lead blocker at all, so this hits faster than Power off all but the same line</text>
<text x="18" y="896" font-size="12" fill="#111318">rules — only the playside guard's climb differs, and only against the 5-3. The</text>
<text x="18" y="912" font-size="12" fill="#111318">line has to hold its blocks while the ball carrier crosses.</text>
<text x="18" y="930" font-size="12" fill="#111318">There is no crack block on this side — the SL is on the other end of the</text>
<text x="18" y="946" font-size="12" fill="#111318">formation. What the playside guard does instead depends on the front: against the</text>
<text x="18" y="964" font-size="12" fill="#111318">4-4 he is covered and simply drives the man over him, and against the 5-3 and</text>
<text x="18" y="980" font-size="12" fill="#111318">5-4-2 he is free to help on the nose and climb. Do not teach him a climb he only</text>
<text x="18" y="998" font-size="12" fill="#111318">makes twice out of three times.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The SL lines up on the right, so on this one he is cutting off the backside</text>
<text x="18" y="1048" font-size="12" fill="#111318">instead of cracking the outside linebacker the way he does on Counter Right.</text>
<text x="18" y="1066" font-size="12" fill="#111318">Against a four-linebacker front that outside linebacker is unblocked and there is</text>
<text x="18" y="1082" font-size="12" fill="#111318">nobody left to get to him — the fake has to hold him for a count or this play is</text>
<text x="18" y="1100" font-size="12" fill="#111318">a two-yard gain. Against the 5-3 the playside guard's climb reaches him.</text>
</svg>