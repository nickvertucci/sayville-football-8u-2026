<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion. At the</text>
<text x="52" y="596" font-size="12" fill="#111318">snap run flat behind the quarterback, take the</text>
<text x="52" y="612" font-size="12" fill="#111318">handoff at full speed and get to the right</text>
<text x="52" y="630" font-size="12" fill="#111318">edge. Turn up outside the backs.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="664" font-size="12" fill="#111318">tackle on you. Hands inside, pads under his,</text>
<text x="52" y="680" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="714" font-size="12" fill="#111318">downfield and get the left inside linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">O — your gap is empty, so take the nose on</text>
<text x="52" y="748" font-size="12" fill="#111318">you. Hands inside, pads under his, drive him</text>
<text x="52" y="766" font-size="12" fill="#111318">back.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="800" font-size="12" fill="#111318">downfield and get the right inside linebacker.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="834" font-size="12" fill="#111318">tackle on you. Hands inside, pads under his,</text>
<text x="52" y="850" font-size="12" fill="#111318">drive him back.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him inside.</text>
<text x="385" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the safety and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Open right and hand the ball to the left tight</text>
<text x="385" y="664" font-size="12" fill="#111318">end as he comes across behind you, then fake a</text>
<text x="385" y="680" font-size="12" fill="#111318">run to the left.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="698" font-size="12" fill="#111318">Bubble around the Y, then block the right</text>
<text x="385" y="714" font-size="12" fill="#111318">outside linebacker.</text>
<text x="351" y="732" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="732" font-size="12" fill="#111318">Bubble around the Y, then double team the</text>
<text x="385" y="748" font-size="12" fill="#111318">right safety with the Z.</text>
</svg>