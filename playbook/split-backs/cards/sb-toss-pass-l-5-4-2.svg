<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the end the way you do on the</text>
<text x="52" y="596" font-size="12" fill="#111318">toss, then slip outside him and run up</text>
<text x="52" y="612" font-size="12" fill="#111318">the sideline. Look back over your</text>
<text x="52" y="630" font-size="12" fill="#111318">outside shoulder.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="664" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="680" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="714" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="732" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="766" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="782" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="816" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="834" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="52" y="868" font-size="12" fill="#111318">stay between your man and the</text>
<text x="52" y="884" font-size="12" fill="#111318">quarterback.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Pass block: step back, hands up, and</text>
<text x="344" y="596" font-size="12" fill="#111318">stay between your man and the</text>
<text x="344" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="630" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="344" y="646" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Pitch it exactly the way you pitch the</text>
<text x="344" y="680" font-size="12" fill="#111318">toss, then run right like you still</text>
<text x="344" y="698" font-size="12" fill="#111318">have it. Do not turn and watch the</text>
<text x="344" y="714" font-size="12" fill="#111318">throw.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Step at the dive, then bubble outside</text>
<text x="344" y="748" font-size="12" fill="#111318">our end and take the first man out</text>
<text x="344" y="766" font-size="12" fill="#111318">there. He is the one who gets to the</text>
<text x="344" y="782" font-size="12" fill="#111318">thrower.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="800" font-size="12" fill="#111318">Catch the pitch and run the toss. At</text>
<text x="344" y="816" font-size="12" fill="#111318">our end, pull up behind the line and</text>
<text x="344" y="834" font-size="12" fill="#111318">throw it up the sideline to the tight</text>
<text x="344" y="850" font-size="12" fill="#111318">end.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Everything is the toss until he pulls up. Same pitch, same path, same speed -- a</text>
<text x="18" y="946" font-size="12" fill="#111318">halfback who slows down to throw has told them.</text>
<text x="18" y="964" font-size="12" fill="#111318">He throws from behind the line. Crossing it is a penalty, so drill the pull-up, not</text>
<text x="18" y="980" font-size="12" fill="#111318">the arm.</text>
<text x="18" y="998" font-size="12" fill="#111318">The split man blocks out there exactly as he does on the toss. That block is the</text>
<text x="18" y="1014" font-size="12" fill="#111318">toss, and it is what the corner is watching instead of the end.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Call it after the toss has hurt them, on first or second down, where an incompletion</text>
<text x="18" y="1048" font-size="12" fill="#111318">costs nothing.</text>
</svg>