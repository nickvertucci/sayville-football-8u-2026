<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="52" y="612" font-size="12" fill="#111318">This one takes a long time, and he is</text>
<text x="52" y="630" font-size="12" fill="#111318">quick enough to catch it.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="714" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="782" font-size="12" fill="#111318">Climb to the playside linebacker.</text>
<text x="52" y="800" font-size="12" fill="#111318">Head across him.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="850" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="331" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="331" y="612" font-size="12" fill="#111318">you.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Come back behind the line the moment</text>
<text x="331" y="646" font-size="12" fill="#111318">the ball is snapped, take the pitch</text>
<text x="331" y="664" font-size="12" fill="#111318">going the other way, and get outside</text>
<text x="331" y="680" font-size="12" fill="#111318">our end. Stay behind the quarterback</text>
<text x="331" y="698" font-size="12" fill="#111318">until you have it — a pitch that goes</text>
<text x="331" y="714" font-size="12" fill="#111318">forward is a fumble.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Start the Keep left — same first</text>
<text x="331" y="748" font-size="12" fill="#111318">three steps, same ball on the hip —</text>
<text x="331" y="766" font-size="12" fill="#111318">then pitch it back underneath to the</text>
<text x="331" y="782" font-size="12" fill="#111318">split man crossing your face. Pitch</text>
<text x="331" y="800" font-size="12" fill="#111318">it back, never forward, then keep</text>
<text x="331" y="816" font-size="12" fill="#111318">running the Keep as if you still have</text>
<text x="331" y="834" font-size="12" fill="#111318">it.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="850" font-size="12" fill="#111318">Run your Keep block exactly as</text>
<text x="331" y="868" font-size="12" fill="#111318">always. At half speed, this play dies</text>
<text x="331" y="884" font-size="12" fill="#111318">for good.</text>
<text x="297" y="902" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="902" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="918" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="936" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">This is the Keep Left for the first second and a half, and that is the whole</text>
<text x="18" y="998" font-size="12" fill="#111318">play. Install it the week after the Keep has hurt somebody, never before.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The far back leaves on the same track he leaves on for the Keep — the difference</text>
<text x="18" y="1032" font-size="12" fill="#111318">is that this time somebody is following him. The defense cannot tell those two</text>
<text x="18" y="1048" font-size="12" fill="#111318">apart, which is the point.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The pitch goes backward. Teach it as a flip to a man running past behind you, not</text>
<text x="18" y="1082" font-size="12" fill="#111318">a throw to a man ahead of you.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The near back blocks for a quarterback with no ball. Tell him that out loud, then</text>
<text x="18" y="1116" font-size="12" fill="#111318">tell him it is the reason the play scores.</text>
<text x="18" y="1134" font-size="12" fill="#111318">The split man is the slowest-developing ball carrier in the book. If the line</text>
<text x="18" y="1150" font-size="12" fill="#111318">cannot hold its blocks for a three count, run Pitch instead.</text>
</svg>