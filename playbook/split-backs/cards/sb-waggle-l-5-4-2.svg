<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Bump the end, then release to the flat</text>
<text x="52" y="596" font-size="12" fill="#111318">at four yards in front of the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="646" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="714" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Block down on the nose, inside</text>
<text x="52" y="748" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="766" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Bump the end, then cross the field to</text>
<text x="344" y="596" font-size="12" fill="#111318">eight yards. Second look, late on</text>
<text x="344" y="612" font-size="12" fill="#111318">purpose.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="630" font-size="12" fill="#111318">Sprint deep from the back side toward</text>
<text x="344" y="646" font-size="12" fill="#111318">the middle. Nobody throws you the ball</text>
<text x="344" y="664" font-size="12" fill="#111318">— you hold their deep men.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Fake the dive away from your roll, ball</text>
<text x="344" y="698" font-size="12" fill="#111318">on your hip, run the edge. Throw only</text>
<text x="344" y="714" font-size="12" fill="#111318">when they take you.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="344" y="748" font-size="12" fill="#111318">Nobody gets past you. You are already</text>
<text x="344" y="766" font-size="12" fill="#111318">on the side he rolls to — do not chase</text>
<text x="344" y="782" font-size="12" fill="#111318">the fake.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="800" font-size="12" fill="#111318">Run the dive path full speed, arms</text>
<text x="344" y="816" font-size="12" fill="#111318">tucked. Linebackers only leave if you</text>
<text x="344" y="834" font-size="12" fill="#111318">are worth watching.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">One pass in this formation is the right number. This is a running offence and the</text>
<text x="18" y="896" font-size="12" fill="#111318">pass exists so the defence cannot put nine men in the box and forget about the edge.</text>
<text x="18" y="912" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes the</text>
<text x="18" y="930" font-size="12" fill="#111318">fake dies.</text>
<text x="18" y="946" font-size="12" fill="#111318">The dive fake is the whole play. If that back does not get hit by somebody, he did</text>
<text x="18" y="964" font-size="12" fill="#111318">not sell it.</text>
<text x="18" y="980" font-size="12" fill="#111318">The dive comes from the back away from the roll. The back on the side he rolls to</text>
<text x="18" y="998" font-size="12" fill="#111318">never chases it — he stays home and protects that edge. Get those two backwards and</text>
<text x="18" y="1014" font-size="12" fill="#111318">the quarterback runs into his own blocker.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The Z is on the wrong end of the formation for this one, so he cannot clear the edge</text>
<text x="18" y="1048" font-size="12" fill="#111318">the quarterback is rolling to. He runs deep from the back side instead and holds</text>
<text x="18" y="1066" font-size="12" fill="#111318">their deep men there, which is what keeps the crosser open.</text>
<text x="18" y="1082" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="1100" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="1116" font-size="12" fill="#111318">Run first, throw second. One throw, then tuck it — no scrambling backwards, ever.</text>
</svg>