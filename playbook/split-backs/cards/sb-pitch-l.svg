<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Seal the edge. Block the end over you</text>
<text x="52" y="596" font-size="12" fill="#111318">and turn him inside — the ball is</text>
<text x="52" y="612" font-size="12" fill="#111318">going around behind you, so he cannot</text>
<text x="52" y="630" font-size="12" fill="#111318">be allowed to follow it out.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Reach the tackle on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Get your head across him —</text>
<text x="52" y="680" font-size="12" fill="#111318">he cannot be allowed to run down the</text>
<text x="52" y="698" font-size="12" fill="#111318">line after this.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="732" font-size="12" fill="#111318">middle linebacker and cut him off</text>
<text x="52" y="748" font-size="12" fill="#111318">from the sideline.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Reach the nose. Get your head across</text>
<text x="52" y="782" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="816" font-size="12" fill="#111318">backside — nothing chases this from</text>
<text x="52" y="834" font-size="12" fill="#111318">behind.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="868" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="884" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Release inside and chase the play</text>
<text x="331" y="646" font-size="12" fill="#111318">across the field. You are the only</text>
<text x="331" y="664" font-size="12" fill="#111318">one fast enough to catch a defender</text>
<text x="331" y="680" font-size="12" fill="#111318">running it down from behind.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open left, get to the edge, and pitch</text>
<text x="331" y="714" font-size="12" fill="#111318">the ball to the trailing back before</text>
<text x="331" y="732" font-size="12" fill="#111318">you get touched. There is no dive</text>
<text x="331" y="748" font-size="12" fill="#111318">fake on this one — sell it with your</text>
<text x="331" y="766" font-size="12" fill="#111318">eyes and get out there.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="782" font-size="12" fill="#111318">Beat the ball to the corner and block</text>
<text x="331" y="800" font-size="12" fill="#111318">him. Drive him toward the sideline so</text>
<text x="331" y="816" font-size="12" fill="#111318">the ball can turn up inside you —</text>
<text x="331" y="834" font-size="12" fill="#111318">there is no receiver out here to do</text>
<text x="331" y="850" font-size="12" fill="#111318">it for you.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="868" font-size="12" fill="#111318">Run flat behind everybody, stay</text>
<text x="331" y="884" font-size="12" fill="#111318">outside and behind the quarterback,</text>
<text x="331" y="902" font-size="12" fill="#111318">and catch the pitch on the run. Never</text>
<text x="331" y="918" font-size="12" fill="#111318">get ahead of him — a pitch that goes</text>
<text x="331" y="936" font-size="12" fill="#111318">forward is a fumble.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it</text>
<text x="18" y="998" font-size="12" fill="#111318">on the ground.</text>
<text x="18" y="1014" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The back taking the pitch must stay behind the quarterback until he has the ball.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Getting ahead means the pitch goes forward, which is a fumble waiting to happen.</text>
<text x="18" y="1066" font-size="12" fill="#111318">Everything depends on the corner being blocked and there is no receiver on this</text>
<text x="18" y="1082" font-size="12" fill="#111318">side to do it, so the near back leaves early and there is no fake to hold</text>
<text x="18" y="1100" font-size="12" fill="#111318">anybody. If their corner is quick, call it to the other side instead.</text>
</svg>