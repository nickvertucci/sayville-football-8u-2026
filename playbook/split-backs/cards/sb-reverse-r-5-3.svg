<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball. This one</text>
<text x="52" y="612" font-size="12" fill="#111318">takes a long time, and he is quick</text>
<text x="52" y="630" font-size="12" fill="#111318">enough to catch it.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="714" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="748" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="782" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="816" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="834" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="344" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Come back behind the line the moment</text>
<text x="344" y="630" font-size="12" fill="#111318">the ball is snapped, take the pitch</text>
<text x="344" y="646" font-size="12" fill="#111318">going the other way, and get outside</text>
<text x="344" y="664" font-size="12" fill="#111318">our end. Stay behind the quarterback</text>
<text x="344" y="680" font-size="12" fill="#111318">until you have it — a pitch that goes</text>
<text x="344" y="698" font-size="12" fill="#111318">forward is a fumble.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="714" font-size="12" fill="#111318">Start the Keep left. Pitch it back</text>
<text x="344" y="732" font-size="12" fill="#111318">underneath — never forward — to the</text>
<text x="344" y="748" font-size="12" fill="#111318">split man crossing your face, then run</text>
<text x="344" y="766" font-size="12" fill="#111318">the Keep like you still have it.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="782" font-size="12" fill="#111318">Run your Keep block exactly as always.</text>
<text x="344" y="800" font-size="12" fill="#111318">At half speed, this play dies for good.</text>
<text x="310" y="816" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="816" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="834" font-size="12" fill="#111318">man out there — here it is the corner.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">This is the Keep Left for the first second and a half, and that is the whole play.</text>
<text x="18" y="896" font-size="12" fill="#111318">Install it the week after the Keep has hurt somebody, never before.</text>
<text x="18" y="912" font-size="12" fill="#111318">The far back leaves on the same track he leaves on for the Keep — the difference is</text>
<text x="18" y="930" font-size="12" fill="#111318">that this time somebody is following him. The defense cannot tell those two apart,</text>
<text x="18" y="946" font-size="12" fill="#111318">which is the point.</text>
<text x="18" y="964" font-size="12" fill="#111318">The pitch goes backward. Teach it as a flip to a man running past behind you, not a</text>
<text x="18" y="980" font-size="12" fill="#111318">throw to a man ahead of you.</text>
<text x="18" y="998" font-size="12" fill="#111318">The near back blocks for a quarterback with no ball. Tell him that out loud, then</text>
<text x="18" y="1014" font-size="12" fill="#111318">tell him it is the reason the play scores.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The split man is the slowest-developing ball carrier in the book. If the line cannot</text>
<text x="18" y="1048" font-size="12" fill="#111318">hold its blocks for a three count, run Pitch instead.</text>
</svg>