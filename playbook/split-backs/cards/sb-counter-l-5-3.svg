<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="52" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="344" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Fake the pitch right, then turn back</text>
<text x="344" y="664" font-size="12" fill="#111318">and hand to the back coming across.</text>
<text x="344" y="680" font-size="12" fill="#111318">Fake first.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="698" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="344" y="714" font-size="12" fill="#111318">speed, arms tucked. You are the lie.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="732" font-size="12" fill="#111318">Take two hard steps at the fake, then</text>
<text x="344" y="748" font-size="12" fill="#111318">plant and come back behind the down</text>
<text x="344" y="766" font-size="12" fill="#111318">blocks.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="862" font-size="12" fill="#111318">No lead blocker at all, so this hits faster than Power off all but the same line</text>
<text x="18" y="878" font-size="12" fill="#111318">rules — only the playside guard's climb differs, and only against the 5-3. The line</text>
<text x="18" y="896" font-size="12" fill="#111318">has to hold its blocks while the ball carrier crosses.</text>
<text x="18" y="912" font-size="12" fill="#111318">There is no crack block on this side — the Z is on the other end of the formation.</text>
<text x="18" y="930" font-size="12" fill="#111318">What the playside guard does instead depends on the front: against the 4-4 he is</text>
<text x="18" y="946" font-size="12" fill="#111318">covered and simply drives the man over him, and against the 5-3 and 5-4-2 he is free</text>
<text x="18" y="964" font-size="12" fill="#111318">to help on the nose and climb. Do not teach him a climb he only makes twice out of</text>
<text x="18" y="980" font-size="12" fill="#111318">three times.</text>
<text x="18" y="998" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The Z lines up on the right, so on this one he is cutting off the backside instead of</text>
<text x="18" y="1032" font-size="12" fill="#111318">cracking the outside linebacker the way he does on Counter Right. Against a</text>
<text x="18" y="1048" font-size="12" fill="#111318">four-linebacker front that outside linebacker is unblocked and there is nobody left</text>
<text x="18" y="1066" font-size="12" fill="#111318">to get to him — the fake has to hold him for a count or this play is a two-yard gain.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Against the 5-3 the playside guard's climb reaches him.</text>
</svg>