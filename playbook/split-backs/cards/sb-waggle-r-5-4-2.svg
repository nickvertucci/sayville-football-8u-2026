<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards. You are the second look</text>
<text x="52" y="630" font-size="12" fill="#111318">and you arrive late on purpose.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Block down on the nose, inside</text>
<text x="52" y="714" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="732" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="766" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="800" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="834" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="344" y="596" font-size="12" fill="#111318">then release to the flat at four yards</text>
<text x="344" y="612" font-size="12" fill="#111318">and stay in front of the quarterback.</text>
<text x="344" y="630" font-size="12" fill="#111318">You are the easy throw.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="646" font-size="12" fill="#111318">Run straight down the field and take</text>
<text x="344" y="664" font-size="12" fill="#111318">the corner with you. Nobody is throwing</text>
<text x="344" y="680" font-size="12" fill="#111318">you the ball — you are the reason the</text>
<text x="344" y="698" font-size="12" fill="#111318">flat is empty.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="714" font-size="12" fill="#111318">Fake the dive to the near back with</text>
<text x="344" y="732" font-size="12" fill="#111318">both hands, hide the ball on your back</text>
<text x="344" y="748" font-size="12" fill="#111318">hip, and get to the edge. Run it if it</text>
<text x="344" y="766" font-size="12" fill="#111318">is open. Only throw if a defender comes</text>
<text x="344" y="782" font-size="12" fill="#111318">up to take you.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="800" font-size="12" fill="#111318">Run the dive path full speed with your</text>
<text x="344" y="816" font-size="12" fill="#111318">arms tucked like you have it. Their</text>
<text x="344" y="834" font-size="12" fill="#111318">linebackers only leave if you are worth</text>
<text x="344" y="850" font-size="12" fill="#111318">watching.</text>
<text x="310" y="868" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="868" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="344" y="884" font-size="12" fill="#111318">Nobody gets past you. You are already</text>
<text x="344" y="902" font-size="12" fill="#111318">on the side he rolls to — do not chase</text>
<text x="344" y="918" font-size="12" fill="#111318">the fake.</text>
<line x1="18" y1="926" x2="603" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">One pass in this formation is the right number. This is a running offence and the</text>
<text x="18" y="980" font-size="12" fill="#111318">pass exists so the defence cannot put nine men in the box and forget about the edge.</text>
<text x="18" y="998" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes the</text>
<text x="18" y="1014" font-size="12" fill="#111318">fake dies.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The dive fake is the whole play. If that back does not get hit by somebody, he did</text>
<text x="18" y="1048" font-size="12" fill="#111318">not sell it.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The Z running off the corner is what empties the flat. He never gets the ball on this</text>
<text x="18" y="1082" font-size="12" fill="#111318">one and he sprints anyway — the day he jogs is the day the corner sits on the tight</text>
<text x="18" y="1100" font-size="12" fill="#111318">end.</text>
<text x="18" y="1116" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="1134" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="1150" font-size="12" fill="#111318">Run first, throw second. One throw, then tuck it — no scrambling backwards, ever.</text>
</svg>