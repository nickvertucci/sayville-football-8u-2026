<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Run straight downfield and take the defender</text>
<text x="52" y="568" font-size="12" fill="#111318">covering you with you.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="602" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="636" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Snap and block the man over you. If nobody is</text>
<text x="52" y="670" font-size="12" fill="#111318">over you, help to the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="704" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="738" font-size="12" fill="#111318">front of you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Release inside, run five yards, then sit down</text>
<text x="385" y="568" font-size="12" fill="#111318">in the open grass and face the quarterback.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="586" font-size="12" fill="#111318">Run straight up the field and clear the</text>
<text x="385" y="602" font-size="12" fill="#111318">defenders out of the tight end's window.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="620" font-size="12" fill="#111318">Three steps back and throw. If the tight end</text>
<text x="385" y="636" font-size="12" fill="#111318">is covered, throw it at his feet — never hold</text>
<text x="385" y="654" font-size="12" fill="#111318">it.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="670" font-size="12" fill="#111318">Block anybody who comes free on your side. Do</text>
<text x="385" y="688" font-size="12" fill="#111318">not release.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Block anybody who comes free on your side. Do</text>
<text x="385" y="722" font-size="12" fill="#111318">not release.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">Three steps and the ball is out. Count it out loud in practice.</text>
<text x="18" y="800" font-size="12" fill="#111318">The flanker's job is to run off the defender over the tight end. He will never touch the ball on</text>
<text x="18" y="818" font-size="12" fill="#111318">this play and that is the point.</text>
<text x="18" y="834" font-size="12" fill="#111318">Throwing it at his feet is a good outcome. Teach that early so nobody takes a sack.</text>
</svg>