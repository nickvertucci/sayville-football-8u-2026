<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Block the defender covering you. He is the one</text>
<text x="52" y="568" font-size="12" fill="#111318">who can make this tackle.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="620" font-size="12" fill="#111318">Block the nose. Do not let him cross your</text>
<text x="52" y="636" font-size="12" fill="#111318">face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="654" font-size="12" fill="#111318">PULL LEFT. Stay flat and kick out the first</text>
<text x="52" y="670" font-size="12" fill="#111318">defender outside our tackle.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="688" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="704" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="385" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="586" font-size="12" fill="#111318">Come across behind the line and cut off</text>
<text x="385" y="602" font-size="12" fill="#111318">anybody chasing from the backside.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="620" font-size="12" fill="#111318">Fake the toss to the halfback going right,</text>
<text x="385" y="636" font-size="12" fill="#111318">then turn back and hand to the fullback. Sell</text>
<text x="385" y="654" font-size="12" fill="#111318">the fake first.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="670" font-size="12" fill="#111318">Take one step toward the fake, then plant and</text>
<text x="385" y="688" font-size="12" fill="#111318">run behind the pulling guard.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Run the full toss path at full speed with your</text>
<text x="385" y="722" font-size="12" fill="#111318">arms tucked. You are the decoy.</text>
<line x1="18" y1="728" x2="684" y2="728" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="746" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="766" font-size="12" fill="#111318">Run the toss two or three times first. This play only exists because of that one.</text>
<text x="18" y="784" font-size="12" fill="#111318">The fullback's first step is toward the fake. If he leans the wrong way early, their linebacker</text>
<text x="18" y="800" font-size="12" fill="#111318">never moves.</text>
</svg>