</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Run a route straight downfield. Sell the pass.</text>
<text x="18" y="568" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="568" font-size="12" fill="#111318">Set like pass protection for one count, then</text>
<text x="52" y="586" font-size="12" fill="#111318">drive your man wherever he wants to go.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">Set like pass protection, then drive your man</text>
<text x="52" y="620" font-size="12" fill="#111318">past the play.</text>
<text x="18" y="636" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="636" font-size="12" fill="#111318">Set for one count, then block the nose and</text>
<text x="52" y="654" font-size="12" fill="#111318">turn him. The hole is behind you.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">Set like pass protection, then drive your man</text>
<text x="52" y="688" font-size="12" fill="#111318">past the play.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Set like pass protection, then drive your man</text>
<text x="52" y="722" font-size="12" fill="#111318">past the play.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Release like a route for two steps, then block</text>
<text x="385" y="568" font-size="12" fill="#111318">the closest linebacker.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="586" font-size="12" fill="#111318">Run a route straight downfield. Sell the pass.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="602" font-size="12" fill="#111318">Drop three steps holding the ball high like</text>
<text x="385" y="620" font-size="12" fill="#111318">you are throwing, then hand it to the halfback</text>
<text x="385" y="636" font-size="12" fill="#111318">on his way past.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="654" font-size="12" fill="#111318">Step up and block anybody who comes free. Sell</text>
<text x="385" y="670" font-size="12" fill="#111318">the protection.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="688" font-size="12" fill="#111318">Wait one full count with your hands ready like</text>
<text x="385" y="704" font-size="12" fill="#111318">you are protecting, then take the handoff and</text>
<text x="385" y="722" font-size="12" fill="#111318">run right up the middle.</text>
<line x1="18" y1="728" x2="684" y2="728" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="746" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="766" font-size="12" fill="#111318">The halfback waiting that extra count is the entire play. He will want to leave early — do not let</text>
<text x="18" y="784" font-size="12" fill="#111318">him.</text>
<text x="18" y="800" font-size="12" fill="#111318">Only call this after we have actually thrown the ball. A draw off a run-only offense fools nobody.</text>
</svg>