</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Run off the defender covering you and take him</text>
<text x="52" y="568" font-size="12" fill="#111318">out of the play.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="602" font-size="12" fill="#111318">last one to the ball.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="636" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Reach the man over you. If nobody is over you,</text>
<text x="52" y="670" font-size="12" fill="#111318">cut off the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Reach the first defender to the playside. Head</text>
<text x="52" y="704" font-size="12" fill="#111318">across his outside shoulder.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Reach the man on or outside you. If you cannot</text>
<text x="52" y="738" font-size="12" fill="#111318">reach him, run him past the play.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Reach the man over you and turn him in. Let</text>
<text x="385" y="568" font-size="12" fill="#111318">the ball go around you.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="586" font-size="12" fill="#111318">Block the deepest defender on your side. Run</text>
<text x="385" y="602" font-size="12" fill="#111318">at his outside number.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="620" font-size="12" fill="#111318">Reverse pivot and toss the ball out in front</text>
<text x="385" y="636" font-size="12" fill="#111318">of the halfback so he catches it running. Then</text>
<text x="385" y="654" font-size="12" fill="#111318">get out of the way.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="670" font-size="12" fill="#111318">Beat the halfback to the corner and kick out</text>
<text x="385" y="688" font-size="12" fill="#111318">the first defender who shows.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Catch the toss on the run and get to the</text>
<text x="385" y="722" font-size="12" fill="#111318">corner. Turn up off the fullback's block, not</text>
<text x="385" y="738" font-size="12" fill="#111318">before.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">The toss goes out in front. If the halfback has to stop for it the play is dead.</text>
<text x="18" y="800" font-size="12" fill="#111318">Best call when they have walked a defender out to cover our flanker — that is one fewer man in the</text>
<text x="18" y="818" font-size="12" fill="#111318">box.</text>
</svg>