<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Run off the defender covering you. Take him</text>
<text x="52" y="568" font-size="12" fill="#111318">deep and take him with you.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="602" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="636" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Block the first defender to the backside.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">Block the man over you and drive him inside.</text>
<text x="52" y="688" font-size="12" fill="#111318">You are the inside wall of the hole.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Block the man over you and drive him outside.</text>
<text x="52" y="722" font-size="12" fill="#111318">You are the outside wall of the hole.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block the man over you and turn him out.</text>
<text x="351" y="568" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="568" font-size="12" fill="#111318">Block the defender covering you. Get in his</text>
<text x="385" y="586" font-size="12" fill="#111318">way and stay between him and the ball.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="602" font-size="12" fill="#111318">Open to the playside and hand the ball to the</text>
<text x="385" y="620" font-size="12" fill="#111318">halfback at four yards, then get out of the</text>
<text x="385" y="636" font-size="12" fill="#111318">way.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="654" font-size="12" fill="#111318">Lead through the hole between the guard and</text>
<text x="385" y="670" font-size="12" fill="#111318">the tackle. Put your facemask on the</text>
<text x="385" y="688" font-size="12" fill="#111318">linebacker and move him.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Take the handoff, get downhill behind the</text>
<text x="385" y="722" font-size="12" fill="#111318">fullback, and cut off his block.</text>
<line x1="18" y1="728" x2="684" y2="728" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="746" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="766" font-size="12" fill="#111318">The fullback has to beat the halfback to the hole. Walk through the timing before you run it live.</text>
<text x="18" y="784" font-size="12" fill="#111318">Teach the halfback to cut off the fullback's back, not to pick a hole before he gets there.</text>
</svg>