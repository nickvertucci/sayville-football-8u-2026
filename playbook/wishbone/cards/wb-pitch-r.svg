</g></g>
<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never quit</text>
<text x="52" y="612" font-size="12" fill="#111318">on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="646" font-size="12" fill="#111318">or inside you — nobody crosses your</text>
<text x="52" y="664" font-size="12" fill="#111318">face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="698" font-size="12" fill="#111318">backside — nothing chases this from</text>
<text x="52" y="714" font-size="12" fill="#111318">behind.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Reach the nose. Get your head across</text>
<text x="52" y="748" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Climb to the middle</text>
<text x="52" y="782" font-size="12" fill="#111318">linebacker and cut him off from the</text>
<text x="52" y="800" font-size="12" fill="#111318">sideline.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">The tackle is on your inside shoulder.</text>
<text x="52" y="834" font-size="12" fill="#111318">Get your head across him and wall him</text>
<text x="52" y="850" font-size="12" fill="#111318">off so he cannot chase.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Release outside and block the deepest</text>
<text x="344" y="596" font-size="12" fill="#111318">defender on your side.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Fake the dive to the fullback, attack</text>
<text x="344" y="630" font-size="12" fill="#111318">the outside, and pitch the ball to the</text>
<text x="344" y="646" font-size="12" fill="#111318">trailing halfback before you get</text>
<text x="344" y="664" font-size="12" fill="#111318">touched. Pitch early, not late.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="680" font-size="12" fill="#111318">Run the dive path and get tackled. Your</text>
<text x="344" y="698" font-size="12" fill="#111318">fake is what keeps their linebackers</text>
<text x="344" y="714" font-size="12" fill="#111318">inside.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Run flat behind everybody, stay outside</text>
<text x="344" y="748" font-size="12" fill="#111318">and behind the quarterback, and catch</text>
<text x="344" y="766" font-size="12" fill="#111318">the pitch on the run. Never get ahead</text>
<text x="344" y="782" font-size="12" fill="#111318">of him — a pitch that goes forward is a</text>
<text x="344" y="800" font-size="12" fill="#111318">fumble.</text>
<text x="310" y="816" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="816" font-size="12" fill="#111318">Beat the ball to the edge and kick out</text>
<text x="344" y="834" font-size="12" fill="#111318">the first defender outside. Drive him</text>
<text x="344" y="850" font-size="12" fill="#111318">toward the sideline — the ball is</text>
<text x="344" y="868" font-size="12" fill="#111318">cutting up inside your block, so never</text>
<text x="344" y="884" font-size="12" fill="#111318">let him fall back in.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on</text>
<text x="18" y="946" font-size="12" fill="#111318">the ground.</text>
<text x="18" y="964" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="980" font-size="12" fill="#111318">The halfback must stay behind the quarterback until he has the ball. Getting ahead</text>
<text x="18" y="998" font-size="12" fill="#111318">means the pitch goes forward, which is a fumble waiting to happen.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The pitch man is the backside halfback, not the playside one. He has the whole</text>
<text x="18" y="1032" font-size="12" fill="#111318">formation to cross, so he leaves on the snap and runs flat — if he bellies back he</text>
<text x="18" y="1048" font-size="12" fill="#111318">never catches up to the corner.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The playside halfback is the reason this play works. He gets to the edge before the</text>
<text x="18" y="1082" font-size="12" fill="#111318">ball and kicks the contain defender out; without him the quarterback is pitching into</text>
<text x="18" y="1100" font-size="12" fill="#111318">an unblocked man.</text>
<text x="18" y="1116" font-size="12" fill="#111318">Teach the carrier to run up inside the kick-out, not around it. Eight-year-olds want</text>
<text x="18" y="1134" font-size="12" fill="#111318">to keep bouncing toward the sideline, and that is how a six-yard gain turns into a</text>
<text x="18" y="1150" font-size="12" fill="#111318">loss.</text>
<text x="18" y="1168" font-size="12" fill="#111318">Drill the two backs together before you drill the pitch. If they leave at the same</text>
<text x="18" y="1184" font-size="12" fill="#111318">speed the blocker never gets in front, and the carrier catches the ball with nobody</text>
<text x="18" y="1202" font-size="12" fill="#111318">to run behind.</text>
</svg>