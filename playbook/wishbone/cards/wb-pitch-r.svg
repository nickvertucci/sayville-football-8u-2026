</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="602" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="636" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Reach the man over you; if nobody is over you,</text>
<text x="52" y="670" font-size="12" fill="#111318">cut off the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Reach the first defender to the playside.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Reach the man on or outside you. If you cannot</text>
<text x="52" y="722" font-size="12" fill="#111318">reach him, run him past the play.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Release outside and block the deepest defender</text>
<text x="385" y="568" font-size="12" fill="#111318">on your side.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="586" font-size="12" fill="#111318">Fake the dive to the fullback, attack the</text>
<text x="385" y="602" font-size="12" fill="#111318">outside, and pitch the ball to the halfback</text>
<text x="385" y="620" font-size="12" fill="#111318">before you get touched. Pitch early, not late.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="636" font-size="12" fill="#111318">Run the dive path and get tackled. Your fake</text>
<text x="385" y="654" font-size="12" fill="#111318">is what keeps their linebackers inside.</text>
<text x="351" y="670" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="670" font-size="12" fill="#111318">Run behind the quarterback and get to the</text>
<text x="385" y="688" font-size="12" fill="#111318">corner ahead of the ball. Kick out the first</text>
<text x="385" y="704" font-size="12" fill="#111318">defender who shows.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="722" font-size="12" fill="#111318">Stay outside and behind the quarterback, catch</text>
<text x="385" y="738" font-size="12" fill="#111318">the pitch on the run, and get to the corner.</text>
<text x="385" y="756" font-size="12" fill="#111318">Never stop your feet.</text>
<line x1="18" y1="762" x2="684" y2="762" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="780" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="800" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on the ground.</text>
<text x="18" y="818" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="834" font-size="12" fill="#111318">The halfback must stay behind the quarterback until he has the ball. Getting ahead means the pitch</text>
<text x="18" y="852" font-size="12" fill="#111318">goes forward, which is a fumble waiting to happen.</text>
</svg>