<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="630" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="646" font-size="12" fill="#111318">face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="680" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="698" font-size="12" fill="#111318">face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Reach the man over you; if nobody is</text>
<text x="52" y="732" font-size="12" fill="#111318">over you, cut off the backside.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Reach the first defender to the</text>
<text x="52" y="766" font-size="12" fill="#111318">playside.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Reach the man on or outside you. If you</text>
<text x="52" y="800" font-size="12" fill="#111318">cannot reach him, run him past the</text>
<text x="52" y="816" font-size="12" fill="#111318">play.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Release outside and block the deepest</text>
<text x="344" y="596" font-size="12" fill="#111318">defender on your side.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Fake the dive to the fullback, attack</text>
<text x="344" y="630" font-size="12" fill="#111318">the outside, and pitch the ball to the</text>
<text x="344" y="646" font-size="12" fill="#111318">halfback before you get touched. Pitch</text>
<text x="344" y="664" font-size="12" fill="#111318">early, not late.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="680" font-size="12" fill="#111318">Run the dive path and get tackled. Your</text>
<text x="344" y="698" font-size="12" fill="#111318">fake is what keeps their linebackers</text>
<text x="344" y="714" font-size="12" fill="#111318">inside.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Run behind the quarterback and get to</text>
<text x="344" y="748" font-size="12" fill="#111318">the corner ahead of the ball. Kick out</text>
<text x="344" y="766" font-size="12" fill="#111318">the first defender who shows.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="782" font-size="12" fill="#111318">Stay outside and behind the</text>
<text x="344" y="800" font-size="12" fill="#111318">quarterback, catch the pitch on the</text>
<text x="344" y="816" font-size="12" fill="#111318">run, and get to the corner. Never stop</text>
<text x="344" y="834" font-size="12" fill="#111318">your feet.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on</text>
<text x="18" y="896" font-size="12" fill="#111318">the ground.</text>
<text x="18" y="912" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="930" font-size="12" fill="#111318">The halfback must stay behind the quarterback until he has the ball. Getting ahead</text>
<text x="18" y="946" font-size="12" fill="#111318">means the pitch goes forward, which is a fumble waiting to happen.</text>
</svg>