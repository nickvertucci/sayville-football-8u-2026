<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block down inside. The man outside you</text>
<text x="52" y="596" font-size="12" fill="#111318">belongs to the fullback.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="630" font-size="12" fill="#111318">you.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="664" font-size="12" fill="#111318">you.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="680" font-size="12" fill="#111318">Block back on the backside gap.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="698" font-size="12" fill="#111318">PULL LEFT. Run flat behind the line and</text>
<text x="52" y="714" font-size="12" fill="#111318">turn up outside our end. Take the first</text>
<text x="52" y="732" font-size="12" fill="#111318">wrong-colored jersey.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="748" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="766" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="782" font-size="12" fill="#111318">face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="596" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Reverse pivot and hand the ball to the</text>
<text x="344" y="630" font-size="12" fill="#111318">playside halfback, then carry out the</text>
<text x="344" y="646" font-size="12" fill="#111318">fake away from the play.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="664" font-size="12" fill="#111318">Kick out the first defender outside our</text>
<text x="344" y="680" font-size="12" fill="#111318">end. Aim at his inside hip and run</text>
<text x="344" y="698" font-size="12" fill="#111318">through him.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Take the handoff, press the outside hip</text>
<text x="344" y="732" font-size="12" fill="#111318">of our end, then turn up inside the</text>
<text x="344" y="748" font-size="12" fill="#111318">blocks.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="766" font-size="12" fill="#111318">Run behind the quarterback and lead</text>
<text x="344" y="782" font-size="12" fill="#111318">through the hole. Block the first</text>
<text x="344" y="800" font-size="12" fill="#111318">jersey inside the kick-out.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Two lead blockers and a pulling guard all arrive in the same place. Walk it through</text>
<text x="18" y="862" font-size="12" fill="#111318">slowly first or they will run into each other.</text>
<text x="18" y="878" font-size="12" fill="#111318">The ball carrier is patient for one step, then goes. Teach the pause.</text>
</svg>