<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Release inside off his outside</text>
<text x="52" y="596" font-size="12" fill="#111318">shoulder and take the playside</text>
<text x="52" y="612" font-size="12" fill="#111318">linebacker. The end over you is being</text>
<text x="52" y="630" font-size="12" fill="#111318">kicked out — leave him alone.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="680" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="714" font-size="12" fill="#111318">drive the nose for one count, then</text>
<text x="52" y="732" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="766" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="782" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">PULL LEFT. Run flat behind the line</text>
<text x="52" y="816" font-size="12" fill="#111318">and turn up in the open gap between</text>
<text x="52" y="834" font-size="12" fill="#111318">our tackle and our end. Take the</text>
<text x="52" y="850" font-size="12" fill="#111318">first wrong-colored jersey.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="884" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="902" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="630" font-size="12" fill="#111318">Open to the playside and hand deep to</text>
<text x="331" y="646" font-size="12" fill="#111318">the halfback crossing from the</text>
<text x="331" y="664" font-size="12" fill="#111318">backside. Let him come to you, then</text>
<text x="331" y="680" font-size="12" fill="#111318">fake away.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="698" font-size="12" fill="#111318">Kick out the end. Aim at his inside</text>
<text x="331" y="714" font-size="12" fill="#111318">hip and run through him.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="732" font-size="12" fill="#111318">Lead through the hole ahead of the</text>
<text x="331" y="748" font-size="12" fill="#111318">ball. Take the first jersey inside</text>
<text x="331" y="766" font-size="12" fill="#111318">the kick-out.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="782" font-size="12" fill="#111318">You carry it. Cross behind the</text>
<text x="331" y="800" font-size="12" fill="#111318">fullback, take the handoff deep, then</text>
<text x="331" y="816" font-size="12" fill="#111318">press the outside hip of our tackle</text>
<text x="331" y="834" font-size="12" fill="#111318">and turn up inside the blocks.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">The far halfback travels further than the near one, and that is the point — he</text>
<text x="18" y="964" font-size="12" fill="#111318">arrives behind the pulling guard instead of beating him to the hole.</text>
<text x="18" y="980" font-size="12" fill="#111318">Two lead blockers and a pulling guard arrive in the same place. Walk it through</text>
<text x="18" y="998" font-size="12" fill="#111318">slowly first or they will run into each other.</text>
<text x="18" y="1014" font-size="12" fill="#111318">If the handoff is late, the quarterback is reaching. He holds the ball still and</text>
<text x="18" y="1032" font-size="12" fill="#111318">lets the back run through it.</text>
</svg>