<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="646" font-size="12" fill="#111318">your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head across his</text>
<text x="52" y="714" font-size="12" fill="#111318">playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside. Never</text>
<text x="52" y="748" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="800" font-size="12" fill="#111318">your face.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him off —</text>
<text x="385" y="596" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="612" font-size="12" fill="#111318">Quick pitch to the right halfback, then run</text>
<text x="385" y="630" font-size="12" fill="#111318">the other way, to the right, like you still</text>
<text x="385" y="646" font-size="12" fill="#111318">have it.</text>
<text x="351" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="664" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="680" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="698" font-size="12" fill="#111318">it is the corner.</text>
<text x="351" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="714" font-size="12" fill="#111318">Bubble out around our end — do not run up into</text>
<text x="385" y="732" font-size="12" fill="#111318">the line. Block the first man out there; here</text>
<text x="385" y="748" font-size="12" fill="#111318">it is the corner. Step at the dive first to</text>
<text x="385" y="766" font-size="12" fill="#111318">hold their linebackers.</text>
<text x="351" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="782" font-size="12" fill="#111318">Run flat, outside and behind the quarterback,</text>
<text x="385" y="800" font-size="12" fill="#111318">and catch the pitch on the run. Ahead of him</text>
<text x="385" y="816" font-size="12" fill="#111318">is a fumble.</text>
<line x1="18" y1="824" x2="684" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on the ground.</text>
<text x="18" y="878" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="896" font-size="12" fill="#111318">The fullback and the left halfback both go to the edge. The right halfback stays behind them and</text>
<text x="18" y="912" font-size="12" fill="#111318">turns up in the alley.</text>
</svg>