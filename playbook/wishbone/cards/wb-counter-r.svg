<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="52" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="646" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="664" font-size="12" fill="#111318">your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="698" font-size="12" fill="#111318">backside.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="732" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="748" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Climb straight to</text>
<text x="52" y="782" font-size="12" fill="#111318">the middle linebacker and take him</text>
<text x="52" y="800" font-size="12" fill="#111318">wherever he goes.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="850" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you and drive him</text>
<text x="331" y="596" font-size="12" fill="#111318">out, away from the hole. Nobody is</text>
<text x="331" y="612" font-size="12" fill="#111318">kicking him out for you — he is</text>
<text x="331" y="630" font-size="12" fill="#111318">yours.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Fake the pitch to the left, then turn</text>
<text x="331" y="664" font-size="12" fill="#111318">back and hand the ball to the other</text>
<text x="331" y="680" font-size="12" fill="#111318">halfback coming across. The fake</text>
<text x="331" y="698" font-size="12" fill="#111318">comes first.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="714" font-size="12" fill="#111318">Step at the dive to hold them, then</text>
<text x="331" y="732" font-size="12" fill="#111318">go up through the hole and block the</text>
<text x="331" y="748" font-size="12" fill="#111318">playside linebacker. You are the lead</text>
<text x="331" y="766" font-size="12" fill="#111318">blocker — the ball is right behind</text>
<text x="331" y="782" font-size="12" fill="#111318">you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="800" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="331" y="816" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="331" y="834" font-size="12" fill="#111318">behind the pulling guard.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="850" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="331" y="868" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="331" y="884" font-size="12" fill="#111318">the lie.</text>
<line x1="18" y1="892" x2="576" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="946" font-size="12" fill="#111318">No pullers, so this hits faster than Power. The line has to hold its blocks while</text>
<text x="18" y="964" font-size="12" fill="#111318">the ball carrier crosses, but nobody is waiting on a guard to get there.</text>
<text x="18" y="980" font-size="12" fill="#111318">The fullback's block on the playside linebacker is what springs it. Drill that</text>
<text x="18" y="998" font-size="12" fill="#111318">block on its own.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Two hard steps toward the fake before he comes back. A shuffle fools nobody.</text>
</svg>