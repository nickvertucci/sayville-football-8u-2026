<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block down inside. The man outside you</text>
<text x="52" y="542" font-size="12" fill="#111318">is being kicked out.</text>
<text x="18" y="558" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="558" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="576" font-size="12" fill="#111318">you.</text>
<text x="18" y="592" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="592" font-size="12" fill="#111318">PULL LEFT. Stay flat and kick out the</text>
<text x="52" y="610" font-size="12" fill="#111318">first defender outside our end.</text>
<text x="18" y="626" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="626" font-size="12" fill="#111318">Block the nose. Do not let him cross</text>
<text x="52" y="644" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="660" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="660" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="678" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="694" font-size="12" fill="#111318">face.</text>
<text x="18" y="712" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="712" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="728" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="746" font-size="12" fill="#111318">face.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="558" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="558" font-size="12" fill="#111318">Fake the pitch to the right, then turn</text>
<text x="344" y="576" font-size="12" fill="#111318">back and hand the ball to the other</text>
<text x="344" y="592" font-size="12" fill="#111318">halfback coming across. The fake comes</text>
<text x="344" y="610" font-size="12" fill="#111318">first.</text>
<text x="310" y="626" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="626" font-size="12" fill="#111318">Run the dive path and get hit. Same as</text>
<text x="344" y="644" font-size="12" fill="#111318">every other play.</text>
<text x="310" y="660" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="660" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="344" y="678" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="344" y="694" font-size="12" fill="#111318">the lie.</text>
<text x="310" y="712" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="712" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="344" y="728" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="344" y="746" font-size="12" fill="#111318">behind the pulling guard.</text>
<line x1="18" y1="752" x2="603" y2="752" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="770" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="790" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="808" font-size="12" fill="#111318">The ball carrier crosses behind the fullback, so the timing is slow on purpose. The</text>
<text x="18" y="824" font-size="12" fill="#111318">line has to hold blocks an extra count.</text>
</svg>