<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Release inside off his outside shoulder</text>
<text x="52" y="596" font-size="12" fill="#111318">and take the playside linebacker. The</text>
<text x="52" y="612" font-size="12" fill="#111318">end over you is being kicked out —</text>
<text x="52" y="630" font-size="12" fill="#111318">leave him alone.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">The tackle is on your inside shoulder.</text>
<text x="52" y="664" font-size="12" fill="#111318">Block him down and seal him inside —</text>
<text x="52" y="680" font-size="12" fill="#111318">that is what opens the hole.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">PULL LEFT. Stay flat and kick out the</text>
<text x="52" y="714" font-size="12" fill="#111318">end on the playside.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="748" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="766" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="800" font-size="12" fill="#111318">backside.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="834" font-size="12" fill="#111318">or inside you — nobody crosses your</text>
<text x="52" y="850" font-size="12" fill="#111318">face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="344" y="596" font-size="12" fill="#111318">the last one to the ball, so never quit</text>
<text x="344" y="612" font-size="12" fill="#111318">on the play.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="630" font-size="12" fill="#111318">Fake the pitch to the right, then turn</text>
<text x="344" y="646" font-size="12" fill="#111318">back and hand the ball to the other</text>
<text x="344" y="664" font-size="12" fill="#111318">halfback coming across. The fake comes</text>
<text x="344" y="680" font-size="12" fill="#111318">first.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Run the dive path and get hit. Same as</text>
<text x="344" y="714" font-size="12" fill="#111318">every other play.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Run the full pitch path away at full</text>
<text x="344" y="748" font-size="12" fill="#111318">speed with your arms tucked. You are</text>
<text x="344" y="766" font-size="12" fill="#111318">the lie.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="782" font-size="12" fill="#111318">Take two hard steps toward the fake,</text>
<text x="344" y="800" font-size="12" fill="#111318">then plant and come all the way back</text>
<text x="344" y="816" font-size="12" fill="#111318">behind the pulling guard.</text>
<line x1="18" y1="858" x2="603" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">Do not call this until the pitch has been working. It is the counter-punch.</text>
<text x="18" y="912" font-size="12" fill="#111318">The ball carrier crosses behind the fullback, so the timing is slow on purpose. The</text>
<text x="18" y="930" font-size="12" fill="#111318">line has to hold blocks an extra count.</text>
</svg>