<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="602" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Block the man over you and drive him off the</text>
<text x="52" y="636" font-size="12" fill="#111318">ball.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Snap and block the man over you. If nobody is</text>
<text x="52" y="670" font-size="12" fill="#111318">over you, climb to the middle linebacker.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Block the man over you and drive him off the</text>
<text x="52" y="704" font-size="12" fill="#111318">ball.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="738" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="385" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="586" font-size="12" fill="#111318">Take the snap and hand the ball to the</text>
<text x="385" y="602" font-size="12" fill="#111318">fullback at two yards. Then fake to the</text>
<text x="385" y="620" font-size="12" fill="#111318">outside.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="636" font-size="12" fill="#111318">Run straight ahead behind the center. Take the</text>
<text x="385" y="654" font-size="12" fill="#111318">ball and get north — there is no hole to look</text>
<text x="385" y="670" font-size="12" fill="#111318">for.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="385" y="688" font-size="12" fill="#111318">Run the pitch path to your side at full speed</text>
<text x="385" y="704" font-size="12" fill="#111318">and sell it.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="385" y="722" font-size="12" fill="#111318">Run the pitch path to your side at full speed</text>
<text x="385" y="738" font-size="12" fill="#111318">and sell it.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">Both halfbacks run their fakes every single time. Three threats or none.</text>
<text x="18" y="800" font-size="12" fill="#111318">The fullback does not read anything. He runs at the center's back and keeps his feet moving.</text>
</svg>