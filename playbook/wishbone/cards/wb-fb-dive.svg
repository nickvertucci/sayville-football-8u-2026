<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="52" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="18" y="558" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="558" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="576" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="592" font-size="12" fill="#111318">face.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">Block the man over you and drive him</text>
<text x="52" y="626" font-size="12" fill="#111318">off the ball.</text>
<text x="18" y="644" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="644" font-size="12" fill="#111318">Snap and block the man over you. If</text>
<text x="52" y="660" font-size="12" fill="#111318">nobody is over you, climb to the middle</text>
<text x="52" y="678" font-size="12" fill="#111318">linebacker.</text>
<text x="18" y="694" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="694" font-size="12" fill="#111318">Block the man over you and drive him</text>
<text x="52" y="712" font-size="12" fill="#111318">off the ball.</text>
<text x="18" y="728" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="728" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="746" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="762" font-size="12" fill="#111318">face.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="558" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="558" font-size="12" fill="#111318">Take the snap and hand the ball to the</text>
<text x="344" y="576" font-size="12" fill="#111318">fullback at two yards. Then fake to the</text>
<text x="344" y="592" font-size="12" fill="#111318">outside.</text>
<text x="310" y="610" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="610" font-size="12" fill="#111318">Run straight ahead behind the center.</text>
<text x="344" y="626" font-size="12" fill="#111318">Take the ball and get north — there is</text>
<text x="344" y="644" font-size="12" fill="#111318">no hole to look for.</text>
<text x="310" y="660" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="660" font-size="12" fill="#111318">Run the pitch path to your side at full</text>
<text x="344" y="678" font-size="12" fill="#111318">speed and sell it.</text>
<text x="310" y="694" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="694" font-size="12" fill="#111318">Run the pitch path to your side at full</text>
<text x="344" y="712" font-size="12" fill="#111318">speed and sell it.</text>
<line x1="18" y1="770" x2="603" y2="770" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="788" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="808" font-size="12" fill="#111318">Both halfbacks run their fakes every single time. Three threats or none.</text>
<text x="18" y="824" font-size="12" fill="#111318">The fullback does not read anything. He runs at the center's back and keeps his feet</text>
<text x="18" y="842" font-size="12" fill="#111318">moving.</text>
</svg>