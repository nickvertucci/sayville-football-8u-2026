<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="52" y="596" font-size="12" fill="#111318">out and away from the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Climb straight to the linebacker on</text>
<text x="52" y="630" font-size="12" fill="#111318">your side. The tackle inside you</text>
<text x="52" y="646" font-size="12" fill="#111318">belongs to the guard.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody is over you. Block out on the</text>
<text x="52" y="680" font-size="12" fill="#111318">tackle in the gap outside you and open</text>
<text x="52" y="698" font-size="12" fill="#111318">the hole.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You have the nose alone, head up. Drive</text>
<text x="52" y="732" font-size="12" fill="#111318">him straight back off the ball.</text>
<text x="52" y="748" font-size="12" fill="#111318">Everything on this play depends on it.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Block out on the</text>
<text x="52" y="782" font-size="12" fill="#111318">tackle in the gap outside you and open</text>
<text x="52" y="800" font-size="12" fill="#111318">the hole.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Climb straight to the linebacker on</text>
<text x="52" y="834" font-size="12" fill="#111318">your side. The tackle inside you</text>
<text x="52" y="850" font-size="12" fill="#111318">belongs to the guard.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="344" y="596" font-size="12" fill="#111318">out and away from the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Take the snap and hand the ball to the</text>
<text x="344" y="630" font-size="12" fill="#111318">fullback at two yards. Then fake to the</text>
<text x="344" y="646" font-size="12" fill="#111318">outside.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="664" font-size="12" fill="#111318">Run straight ahead behind the center.</text>
<text x="344" y="680" font-size="12" fill="#111318">Take the ball and get north — there is</text>
<text x="344" y="698" font-size="12" fill="#111318">no hole to look for.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Run the pitch path to your side at full</text>
<text x="344" y="732" font-size="12" fill="#111318">speed and sell it.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="748" font-size="12" fill="#111318">Run the pitch path to your side at full</text>
<text x="344" y="766" font-size="12" fill="#111318">speed and sell it.</text>
<line x1="18" y1="858" x2="603" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">Both halfbacks run their fakes every single time. Three threats or none.</text>
<text x="18" y="912" font-size="12" fill="#111318">The fullback does not read anything. He runs at the center's back and keeps his feet</text>
<text x="18" y="930" font-size="12" fill="#111318">moving.</text>
</svg>