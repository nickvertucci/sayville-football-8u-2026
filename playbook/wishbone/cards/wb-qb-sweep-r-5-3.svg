<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head across</text>
<text x="52" y="714" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside. The</text>
<text x="358" y="596" font-size="12" fill="#111318">ball goes around behind you.</text>
<text x="324" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="612" font-size="12" fill="#111318">Take the snap and sweep right, flat and</text>
<text x="358" y="630" font-size="12" fill="#111318">fast, behind the fullback. Turn up</text>
<text x="358" y="646" font-size="12" fill="#111318">outside his block.</text>
<text x="324" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="358" y="664" font-size="12" fill="#111318">Lead outside our end. Block the first man</text>
<text x="358" y="680" font-size="12" fill="#111318">out there — here it is the corner.</text>
<text x="324" y="698" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="358" y="698" font-size="12" fill="#111318">Run hard to the left like you have the</text>
<text x="358" y="714" font-size="12" fill="#111318">ball. Sell it all the way — you are the</text>
<text x="358" y="732" font-size="12" fill="#111318">reason the defense goes the wrong way.</text>
<text x="324" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="358" y="748" font-size="12" fill="#111318">Lead outside our end. Block the first man</text>
<text x="358" y="766" font-size="12" fill="#111318">out there — here it is the corner.</text>
<line x1="18" y1="806" x2="630" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The quarterback keeps it every time — tell him before the snap, there is no read.</text>
<text x="18" y="862" font-size="12" fill="#111318">The left halfback's fake is the play. If he jogs, nobody follows him and the defense is</text>
<text x="18" y="878" font-size="12" fill="#111318">waiting at the edge.</text>
<text x="18" y="896" font-size="12" fill="#111318">The quarterback stays behind the fullback until the block is made, then turns it up.</text>
</svg>