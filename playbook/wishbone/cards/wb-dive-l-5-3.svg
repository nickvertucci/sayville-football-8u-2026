<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Defensive tackle on your inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Help on the defensive tackle,</text>
<text x="52" y="646" font-size="12" fill="#111318">then take the playside linebacker.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the nose, inside</text>
<text x="52" y="680" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="698" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="732" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="766" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="800" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="816" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="344" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Open left, hand to the fullback, then</text>
<text x="344" y="630" font-size="12" fill="#111318">fake the boot right. It holds the</text>
<text x="344" y="646" font-size="12" fill="#111318">backside end.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="664" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="344" y="680" font-size="12" fill="#111318">left guard and the left tackle. One</text>
<text x="344" y="698" font-size="12" fill="#111318">cut, then get north. Do not bounce it.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="714" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="732" font-size="12" fill="#111318">man who shows in it.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="748" font-size="12" fill="#111318">Run hard to the right like you have the</text>
<text x="344" y="766" font-size="12" fill="#111318">ball. You are what holds the backside.</text>
<line x1="18" y1="824" x2="603" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Dive is the B-gap — between the guard and the tackle. Faster than Power, wider than</text>
<text x="18" y="878" font-size="12" fill="#111318">Smash.</text>
<text x="18" y="896" font-size="12" fill="#111318">The fullback takes it downhill and gets north. One cut off the double team, never a</text>
<text x="18" y="912" font-size="12" fill="#111318">bounce.</text>
</svg>