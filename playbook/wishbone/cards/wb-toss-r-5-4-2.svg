</g></g>
<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="630" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="646" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="782" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="800" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him</text>
<text x="344" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="344" y="612" font-size="12" fill="#111318">you.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="630" font-size="12" fill="#111318">Quick pitch to the left halfback, then</text>
<text x="344" y="646" font-size="12" fill="#111318">run the other way, to the left, like</text>
<text x="344" y="664" font-size="12" fill="#111318">you still have it.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="680" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="698" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="714" font-size="12" fill="#111318">linebacker.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="344" y="732" font-size="12" fill="#111318">Run flat, outside and behind the</text>
<text x="344" y="748" font-size="12" fill="#111318">quarterback, and catch the pitch on the</text>
<text x="344" y="766" font-size="12" fill="#111318">run. Ahead of him is a fumble.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="344" y="782" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="800" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="816" font-size="12" fill="#111318">linebacker. Step at the dive first to</text>
<text x="344" y="834" font-size="12" fill="#111318">hold their linebackers.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">The pitch goes early. A quarterback who waits to be tackled first will pitch it on</text>
<text x="18" y="896" font-size="12" fill="#111318">the ground.</text>
<text x="18" y="912" font-size="12" fill="#111318">This is not a read at this age — tell him before the snap that he is pitching it.</text>
<text x="18" y="930" font-size="12" fill="#111318">The fullback and the right halfback both go to the edge. The left halfback stays</text>
<text x="18" y="946" font-size="12" fill="#111318">behind them and turns up in the alley.</text>
</svg>