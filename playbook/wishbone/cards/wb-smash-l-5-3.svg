<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="612" font-size="12" fill="#111318">Open left, hand to the fullback, then</text>
<text x="331" y="630" font-size="12" fill="#111318">fake the boot right. It holds the</text>
<text x="331" y="646" font-size="12" fill="#111318">backside end.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="664" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="331" y="680" font-size="12" fill="#111318">center and the left guard. Do not</text>
<text x="331" y="698" font-size="12" fill="#111318">bounce it.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">LH</text>
<text x="331" y="714" font-size="12" fill="#111318">Lead through the hole. Block the</text>
<text x="331" y="732" font-size="12" fill="#111318">first man who shows in it.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">RH</text>
<text x="331" y="748" font-size="12" fill="#111318">Run hard to the right like you have</text>
<text x="331" y="766" font-size="12" fill="#111318">the ball. You are what holds the</text>
<text x="331" y="782" font-size="12" fill="#111318">backside.</text>
<line x1="18" y1="806" x2="576" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">The fullback is the runner here, not the lead. The hole is the A-gap — between</text>
<text x="18" y="862" font-size="12" fill="#111318">the center and the left guard.</text>
<text x="18" y="878" font-size="12" fill="#111318">The left halfback leads through that gap. If the fullback bounces, the play is</text>
<text x="18" y="896" font-size="12" fill="#111318">dead.</text>
</svg>