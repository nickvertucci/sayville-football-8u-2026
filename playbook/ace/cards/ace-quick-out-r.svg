<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Run straight downfield and take your defender</text>
<text x="52" y="568" font-size="12" fill="#111318">with you.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="602" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="636" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Snap and block the man over you. If nobody is</text>
<text x="52" y="670" font-size="12" fill="#111318">over you, help to the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="704" font-size="12" fill="#111318">front of you.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Fire out at the man over you and keep him in</text>
<text x="52" y="738" font-size="12" fill="#111318">front of you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Release inside, run five yards, and sit down</text>
<text x="385" y="568" font-size="12" fill="#111318">facing the quarterback. You are the safety</text>
<text x="385" y="586" font-size="12" fill="#111318">valve.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">W</text>
<text x="385" y="602" font-size="12" fill="#111318">Run straight downfield. Take your defender</text>
<text x="385" y="620" font-size="12" fill="#111318">away from the middle.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="636" font-size="12" fill="#111318">Run five yards straight upfield, then break</text>
<text x="385" y="654" font-size="12" fill="#111318">flat to the sideline. Look for the ball the</text>
<text x="385" y="670" font-size="12" fill="#111318">instant you turn.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="688" font-size="12" fill="#111318">Three steps and throw to the flanker breaking</text>
<text x="385" y="704" font-size="12" fill="#111318">out. If he is covered, come back to the tight</text>
<text x="385" y="722" font-size="12" fill="#111318">end sitting down. Never hold it.</text>
<text x="351" y="738" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="738" font-size="12" fill="#111318">Check for anybody coming free, then release to</text>
<text x="385" y="756" font-size="12" fill="#111318">the flat on the backside as the last option.</text>
<line x1="18" y1="762" x2="684" y2="762" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="780" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="800" font-size="12" fill="#111318">The ball comes out on the third step whether or not he is open. Count it in practice.</text>
<text x="18" y="818" font-size="12" fill="#111318">A throw to the sideline that falls incomplete is a fine outcome. A sack is not.</text>
<text x="18" y="834" font-size="12" fill="#111318">Best call against a defense that has walked everybody into the box to stop our runs.</text>
</svg>