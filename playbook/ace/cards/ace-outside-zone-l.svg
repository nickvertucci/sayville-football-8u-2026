<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Block the defender covering you and screen him</text>
<text x="52" y="568" font-size="12" fill="#111318">away from the sideline.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Reach the man on or outside you. If you cannot</text>
<text x="52" y="602" font-size="12" fill="#111318">reach him, run him past the play.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Reach the man on or outside you and get your</text>
<text x="52" y="636" font-size="12" fill="#111318">head across.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Reach playside. If nobody is there, cut off</text>
<text x="52" y="670" font-size="12" fill="#111318">the backside.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Reach playside and cut off anybody chasing.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="722" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="385" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">W</text>
<text x="385" y="586" font-size="12" fill="#111318">Block the defender covering you. Get in his</text>
<text x="385" y="602" font-size="12" fill="#111318">way and stay there.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="620" font-size="12" fill="#111318">Chase across behind the line and cut off</text>
<text x="385" y="636" font-size="12" fill="#111318">anybody trailing the play.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="654" font-size="12" fill="#111318">Open to the playside, hand it deep to the back</text>
<text x="385" y="670" font-size="12" fill="#111318">on the run, then fake the other way.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="688" font-size="12" fill="#111318">Take the ball on the run and stretch it toward</text>
<text x="385" y="704" font-size="12" fill="#111318">the sideline. Look inside as you go — the</text>
<text x="385" y="722" font-size="12" fill="#111318">moment a crease opens, plant and go north.</text>
<line x1="18" y1="728" x2="684" y2="728" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="746" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="766" font-size="12" fill="#111318">The back's eyes are inside while his feet go outside. That is the hard part — drill it walking.</text>
<text x="18" y="784" font-size="12" fill="#111318">If their end chases hard down the line, the crease is behind him. Tell the back to expect it.</text>
</svg>