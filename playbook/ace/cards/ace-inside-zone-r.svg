<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="552" font-size="12" fill="#111318">Block the defender covering you. Stay between</text>
<text x="52" y="568" font-size="12" fill="#111318">him and the middle of the field.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Step playside and block whoever shows in your</text>
<text x="52" y="602" font-size="12" fill="#111318">gap. If nobody does, climb to the linebacker.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Step playside and block whoever shows in your</text>
<text x="52" y="636" font-size="12" fill="#111318">gap.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Step playside and block whoever shows. If</text>
<text x="52" y="670" font-size="12" fill="#111318">nobody is there, help the guard and climb.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="688" font-size="12" fill="#111318">Step playside and block whoever shows in your</text>
<text x="52" y="704" font-size="12" fill="#111318">gap.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="722" font-size="12" fill="#111318">Step playside and block whoever shows in your</text>
<text x="52" y="738" font-size="12" fill="#111318">gap.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">TE</text>
<text x="385" y="552" font-size="12" fill="#111318">Step playside and block the man over you. Turn</text>
<text x="385" y="568" font-size="12" fill="#111318">him however he wants to go.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">W</text>
<text x="385" y="586" font-size="12" fill="#111318">Block the defender covering you and stay on</text>
<text x="385" y="602" font-size="12" fill="#111318">him.</text>
<text x="351" y="620" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="620" font-size="12" fill="#111318">Block the defender covering you and stay on</text>
<text x="385" y="636" font-size="12" fill="#111318">him.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="654" font-size="12" fill="#111318">Open playside, hand the ball to the back at</text>
<text x="385" y="670" font-size="12" fill="#111318">three yards, then carry out a fake to the</text>
<text x="385" y="688" font-size="12" fill="#111318">backside.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="704" font-size="12" fill="#111318">Aim at the playside guard's outside hip. Take</text>
<text x="385" y="722" font-size="12" fill="#111318">the ball, run to the first crease that opens,</text>
<text x="385" y="738" font-size="12" fill="#111318">and go north through it. One cut only.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">Everybody steps the same direction. That is the whole rule — do not teach eleven different</text>
<text x="18" y="800" font-size="12" fill="#111318">assignments.</text>
<text x="18" y="818" font-size="12" fill="#111318">One cut and go. A back who dances behind this line loses yards.</text>
<text x="18" y="834" font-size="12" fill="#111318">Count how many defenders are in the box before you call it. If it is six or fewer, run it again.</text>
</svg>