</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Release across and settle at eight yards on</text>
<text x="52" y="568" font-size="12" fill="#111318">the boot side. Find open grass.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">PULL RIGHT like the sweep. You are selling the</text>
<text x="52" y="620" font-size="12" fill="#111318">run — take a linebacker with you.</text>
<text x="18" y="636" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="636" font-size="12" fill="#111318">Block back toward the boot side. Nobody chases</text>
<text x="52" y="654" font-size="12" fill="#111318">through the middle.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">Hinge and protect. Nobody comes free — the</text>
<text x="52" y="688" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Hinge and protect the boot side. Nobody comes</text>
<text x="52" y="722" font-size="12" fill="#111318">free outside you.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Engage their end for a count, then release to</text>
<text x="385" y="568" font-size="12" fill="#111318">the flat at four yards. You are the easy</text>
<text x="385" y="586" font-size="12" fill="#111318">throw.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="385" y="602" font-size="12" fill="#111318">Release outside and run a corner route — eight</text>
<text x="385" y="620" font-size="12" fill="#111318">yards, then break for the flag.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="636" font-size="12" fill="#111318">Fake to the fullback, fake the sweep to the</text>
<text x="385" y="654" font-size="12" fill="#111318">halfback, then hide the ball and get to the</text>
<text x="385" y="670" font-size="12" fill="#111318">edge. Throw the flat first, the corner second,</text>
<text x="385" y="688" font-size="12" fill="#111318">and run it if neither is there.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="704" font-size="12" fill="#111318">Trap path into the line and get hit. Your fake</text>
<text x="385" y="722" font-size="12" fill="#111318">is what freezes their linebackers.</text>
<text x="351" y="738" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="738" font-size="12" fill="#111318">Run the full sweep path at full speed with</text>
<text x="385" y="756" font-size="12" fill="#111318">your arms tucked. Sell it to the sideline.</text>
<line x1="18" y1="762" x2="684" y2="762" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="780" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="800" font-size="12" fill="#111318">Every fake has to be real. This play is only open because they have seen the Buck Sweep four times</text>
<text x="18" y="818" font-size="12" fill="#111318">already.</text>
<text x="18" y="834" font-size="12" fill="#111318">No blitzing is allowed at this age, so the quarterback has time. Teach him to get to the edge and</text>
<text x="18" y="852" font-size="12" fill="#111318">look up.</text>
<text x="18" y="868" font-size="12" fill="#111318">Two reads and then run. Never let him drift backwards hunting a third option.</text>
</svg>