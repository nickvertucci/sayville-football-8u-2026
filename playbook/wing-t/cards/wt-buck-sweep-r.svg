</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="602" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">PULL RIGHT. You are the first guard — turn up</text>
<text x="52" y="636" font-size="12" fill="#111318">outside our end and kick out the first</text>
<text x="52" y="654" font-size="12" fill="#111318">defender who shows.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="670" font-size="12" fill="#111318">Reach the man over you and cut off the</text>
<text x="52" y="688" font-size="12" fill="#111318">backside. You are alone in there — get it</text>
<text x="52" y="704" font-size="12" fill="#111318">done.</text>
<text x="18" y="722" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="722" font-size="12" fill="#111318">PULL RIGHT. You are the second guard — run</text>
<text x="52" y="738" font-size="12" fill="#111318">behind the first one and turn up inside his</text>
<text x="52" y="756" font-size="12" fill="#111318">block. Take the linebacker.</text>
<text x="18" y="772" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="772" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="52" y="790" font-size="12" fill="#111318">Nobody chases through your gap.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="351" y="568" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="385" y="568" font-size="12" fill="#111318">Block the first defender outside our end and</text>
<text x="385" y="586" font-size="12" fill="#111318">drive him wider. Open the corner.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="602" font-size="12" fill="#111318">Reverse pivot, fake to the fullback with both</text>
<text x="385" y="620" font-size="12" fill="#111318">hands, then hand the ball to the halfback</text>
<text x="385" y="636" font-size="12" fill="#111318">going wide. Carry out the bootleg fake.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="654" font-size="12" fill="#111318">Run the trap path right at the guard's gap and</text>
<text x="385" y="670" font-size="12" fill="#111318">get tackled. You will not have the ball. That</text>
<text x="385" y="688" font-size="12" fill="#111318">is the job.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Take the handoff on the run, get behind both</text>
<text x="385" y="722" font-size="12" fill="#111318">guards, and turn up off their blocks. Do not</text>
<text x="385" y="738" font-size="12" fill="#111318">outrun them to the corner.</text>
<line x1="18" y1="796" x2="684" y2="796" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="814" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="834" font-size="12" fill="#111318">Two pulling guards is the hardest thing we ask anyone to do. Drill it with no defense until they can</text>
<text x="18" y="852" font-size="12" fill="#111318">do it in their sleep.</text>
<text x="18" y="868" font-size="12" fill="#111318">The fullback's fake has to draw a hit. If nobody tackles him, their linebackers are already chasing</text>
<text x="18" y="886" font-size="12" fill="#111318">the halfback.</text>
<text x="18" y="902" font-size="12" fill="#111318">The halfback stays behind the guards. If he beats them to the corner he has no blockers and it is a</text>
<text x="18" y="920" font-size="12" fill="#111318">five-yard loss.</text>
</svg>