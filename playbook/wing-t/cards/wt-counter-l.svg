<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block down inside. The man outside you is</text>
<text x="52" y="568" font-size="12" fill="#111318">being kicked out.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="620" font-size="12" fill="#111318">Block the nose. Do not let him cross your</text>
<text x="52" y="636" font-size="12" fill="#111318">face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="654" font-size="12" fill="#111318">PULL LEFT. Stay flat and kick out the first</text>
<text x="52" y="670" font-size="12" fill="#111318">defender outside our end.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="688" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="704" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="385" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">WB</text>
<text x="385" y="586" font-size="12" fill="#111318">Take one hard step upfield like the sweep is</text>
<text x="385" y="602" font-size="12" fill="#111318">coming, then come back and cut off the</text>
<text x="385" y="620" font-size="12" fill="#111318">backside.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="636" font-size="12" fill="#111318">Fake the sweep to the wing side with both</text>
<text x="385" y="654" font-size="12" fill="#111318">hands, then turn back and hand to the</text>
<text x="385" y="670" font-size="12" fill="#111318">halfback. The fake comes first.</text>
<text x="351" y="688" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="688" font-size="12" fill="#111318">Trap path into the line and get hit.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">HB</text>
<text x="385" y="704" font-size="12" fill="#111318">Take two hard steps toward the sweep, then</text>
<text x="385" y="722" font-size="12" fill="#111318">plant and come back behind the pulling guard.</text>
<text x="385" y="738" font-size="12" fill="#111318">Those steps are the play.</text>
<line x1="18" y1="746" x2="684" y2="746" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="764" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="784" font-size="12" fill="#111318">Only worth calling once the Buck Sweep has hurt them. Misdirection off a play they do not fear is</text>
<text x="18" y="800" font-size="12" fill="#111318">just a slow run.</text>
<text x="18" y="818" font-size="12" fill="#111318">The halfback's counter steps must be full speed. A shuffle fools nobody.</text>
</svg>