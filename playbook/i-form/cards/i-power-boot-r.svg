<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards on the boot side. You</text>
<text x="52" y="630" font-size="12" fill="#111318">are the second look and you arrive</text>
<text x="52" y="646" font-size="12" fill="#111318">late on purpose.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down inside and sell the run.</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody comes through your gap chasing</text>
<text x="52" y="698" font-size="12" fill="#111318">the power fake.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody is over you. Pull flat to the</text>
<text x="52" y="732" font-size="12" fill="#111318">left and run the Power path — you are</text>
<text x="52" y="748" font-size="12" fill="#111318">the lie, take a linebacker with you.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Block the nose away from the boot.</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody chases through the middle.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="816" font-size="12" fill="#111318">on the nose and drive him away from</text>
<text x="52" y="834" font-size="12" fill="#111318">the boot.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Hinge and protect the boot side.</text>
<text x="52" y="868" font-size="12" fill="#111318">Nobody comes free outside you — the</text>
<text x="52" y="884" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="331" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="331" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Release straight downfield outside</text>
<text x="331" y="664" font-size="12" fill="#111318">the end and run the corner off —</text>
<text x="331" y="680" font-size="12" fill="#111318">clear him out so the flat opens</text>
<text x="331" y="698" font-size="12" fill="#111318">underneath, then you are the deep</text>
<text x="331" y="714" font-size="12" fill="#111318">shot if he sits.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Fake the handoff to the tailback</text>
<text x="331" y="748" font-size="12" fill="#111318">going left, hide the ball on your</text>
<text x="331" y="766" font-size="12" fill="#111318">back hip, and get to the right edge.</text>
<text x="331" y="782" font-size="12" fill="#111318">Run it if it is open. Only throw if a</text>
<text x="331" y="800" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Run your Power lead path to the left</text>
<text x="331" y="834" font-size="12" fill="#111318">and block whoever shows. Sell it,</text>
<text x="331" y="850" font-size="12" fill="#111318">then look back for anyone chasing the</text>
<text x="331" y="868" font-size="12" fill="#111318">quarterback.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="884" font-size="12" fill="#111318">Run the Power path to the left with</text>
<text x="331" y="902" font-size="12" fill="#111318">your arms tucked like you have the</text>
<text x="331" y="918" font-size="12" fill="#111318">ball. Sell it all the way — you are</text>
<text x="331" y="936" font-size="12" fill="#111318">the reason nobody stays home on the</text>
<text x="331" y="952" font-size="12" fill="#111318">boot.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Do not call this until Power Left has hurt them. The whole play is a lie about</text>
<text x="18" y="1014" font-size="12" fill="#111318">Power, so Power has to be worth lying about.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="1048" font-size="12" fill="#111318">the fake dies and the flat defender is waiting.</text>
<text x="18" y="1066" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1082" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1100" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="1116" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="1134" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>