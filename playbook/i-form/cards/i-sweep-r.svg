<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="52" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="18" y="558" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="558" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="576" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="592" font-size="12" fill="#111318">face.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="626" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="644" font-size="12" fill="#111318">face.</text>
<text x="18" y="660" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="660" font-size="12" fill="#111318">Reach the man over you. If nobody is</text>
<text x="52" y="678" font-size="12" fill="#111318">over you, cut off the backside gap.</text>
<text x="18" y="694" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="694" font-size="12" fill="#111318">Reach the first defender to the</text>
<text x="52" y="712" font-size="12" fill="#111318">playside. Get your head across his</text>
<text x="52" y="728" font-size="12" fill="#111318">outside shoulder.</text>
<text x="18" y="746" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="746" font-size="12" fill="#111318">Reach the man on or outside you. If you</text>
<text x="52" y="762" font-size="12" fill="#111318">cannot reach him, run him past the</text>
<text x="52" y="780" font-size="12" fill="#111318">play.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Reach the man over you and turn him in.</text>
<text x="344" y="542" font-size="12" fill="#111318">Let the ball go around you.</text>
<text x="310" y="558" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="558" font-size="12" fill="#111318">Block the deepest defender on your</text>
<text x="344" y="576" font-size="12" fill="#111318">side. Run at his outside number and</text>
<text x="344" y="592" font-size="12" fill="#111318">screen him away from the ball.</text>
<text x="310" y="610" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="610" font-size="12" fill="#111318">Reverse pivot and hand the ball to the</text>
<text x="344" y="626" font-size="12" fill="#111318">tailback as deep as you can. Then boot</text>
<text x="344" y="644" font-size="12" fill="#111318">away and sell it.</text>
<text x="310" y="660" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="660" font-size="12" fill="#111318">Get to the corner ahead of the tailback</text>
<text x="344" y="678" font-size="12" fill="#111318">and kick out the first defender who</text>
<text x="344" y="694" font-size="12" fill="#111318">shows. You are the lead blocker — beat</text>
<text x="344" y="712" font-size="12" fill="#111318">him there.</text>
<text x="310" y="728" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="728" font-size="12" fill="#111318">Take the handoff going full speed and</text>
<text x="344" y="746" font-size="12" fill="#111318">get to the corner. Turn up when the</text>
<text x="344" y="762" font-size="12" fill="#111318">fullback blocks somebody, not before.</text>
<text x="344" y="780" font-size="12" fill="#111318">Never stop your feet.</text>
<line x1="18" y1="786" x2="603" y2="786" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="804" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="824" font-size="12" fill="#111318">The tailback is deeper here than the wing is in Tight, so he has time to get outside</text>
<text x="18" y="842" font-size="12" fill="#111318">— but only if he is at full speed by the handoff.</text>
<text x="18" y="858" font-size="12" fill="#111318">The fullback has to beat the tailback to the corner. If he is trailing, the play has</text>
<text x="18" y="876" font-size="12" fill="#111318">no lead blocker.</text>
<text x="18" y="892" font-size="12" fill="#111318">One rule for the tailback: turn up off the fullback's block. Running to the sideline</text>
<text x="18" y="910" font-size="12" fill="#111318">is how this play loses eight yards.</text>
<text x="18" y="926" font-size="12" fill="#111318">Watch our end reach-blocking. If he cannot reach their end, run I Power to that side</text>
<text x="18" y="944" font-size="12" fill="#111318">instead.</text>
</svg>