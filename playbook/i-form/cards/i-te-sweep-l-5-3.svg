</g></g>
<line x1="18" y1="540" x2="630" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside. The</text>
<text x="52" y="596" font-size="12" fill="#111318">ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head across</text>
<text x="52" y="714" font-size="12" fill="#111318">his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle on your inside shoulder. Cut him</text>
<text x="52" y="782" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="324" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="358" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion. At</text>
<text x="358" y="596" font-size="12" fill="#111318">the snap run flat behind the quarterback,</text>
<text x="358" y="612" font-size="12" fill="#111318">take the handoff at full speed and get to</text>
<text x="358" y="630" font-size="12" fill="#111318">the left edge. Turn up outside the</text>
<text x="358" y="646" font-size="12" fill="#111318">fullback.</text>
<text x="324" y="664" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="358" y="664" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="358" y="680" font-size="12" fill="#111318">Stay in his way.</text>
<text x="324" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="358" y="698" font-size="12" fill="#111318">Open left and hand the ball to the right</text>
<text x="358" y="714" font-size="12" fill="#111318">tight end as he comes across behind you,</text>
<text x="358" y="732" font-size="12" fill="#111318">then fake a run to the right.</text>
<text x="324" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="358" y="748" font-size="12" fill="#111318">Lead outside our end, then turn up inside</text>
<text x="358" y="766" font-size="12" fill="#111318">— the playside linebacker is the man who</text>
<text x="358" y="782" font-size="12" fill="#111318">shows. Head across him.</text>
<text x="324" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="358" y="800" font-size="12" fill="#111318">Run at the outside linebacker and screen</text>
<text x="358" y="816" font-size="12" fill="#111318">him off. Stay in his way.</text>
<line x1="18" y1="824" x2="630" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance, so the play is legal and</text>
<text x="18" y="878" font-size="12" fill="#111318">nothing tips it off.</text>
<text x="18" y="896" font-size="12" fill="#111318">The handoff is the whole play: the quarterback opens left and puts the ball in the end's</text>
<text x="18" y="912" font-size="12" fill="#111318">belly at full speed, then carries out his fake.</text>
<text x="18" y="930" font-size="12" fill="#111318">Both backs bubble out to the left ahead of the end and double team the outside linebacker</text>
<text x="18" y="946" font-size="12" fill="#111318">together. Two of them on him is what gets the end around the corner.</text>
</svg>