<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="596" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="612" font-size="12" fill="#111318">look for a man.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="646" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="664" font-size="12" fill="#111318">look for a man.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="698" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="714" font-size="12" fill="#111318">look for a man.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="748" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="766" font-size="12" fill="#111318">look for a man. You are the tip of the</text>
<text x="52" y="782" font-size="12" fill="#111318">wedge — everybody comes to you.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="816" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="834" font-size="12" fill="#111318">look for a man.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="868" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="52" y="884" font-size="12" fill="#111318">look for a man.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="344" y="596" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="344" y="612" font-size="12" fill="#111318">look for a man.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="630" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="646" font-size="12" fill="#111318">Stay in his way. Nothing comes around</text>
<text x="344" y="664" font-size="12" fill="#111318">the outside into the back of the wedge.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Snap it and hand to the tailback</text>
<text x="344" y="698" font-size="12" fill="#111318">immediately, then stay out of his way.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="344" y="732" font-size="12" fill="#111318">beside you, and push. Low pads — never</text>
<text x="344" y="748" font-size="12" fill="#111318">look for a man. Both hands on the</text>
<text x="344" y="766" font-size="12" fill="#111318">tailback's back and drive. You are</text>
<text x="344" y="782" font-size="12" fill="#111318">pushing, not blocking.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="800" font-size="12" fill="#111318">Hand on the center's back, pads low,</text>
<text x="344" y="816" font-size="12" fill="#111318">follow the wedge. Never cut or bounce —</text>
<text x="344" y="834" font-size="12" fill="#111318">the hole moves with you.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Two yards is a good wedge. Do not call it needing four.</text>
<text x="18" y="946" font-size="12" fill="#111318">Expect the heaviest front the league allows inside the five. It does not change the</text>
<text x="18" y="964" font-size="12" fill="#111318">call — nobody is picking a man anyway.</text>
<text x="18" y="980" font-size="12" fill="#111318">Nothing in the league rulebook prohibits wedge blocking for 11-man play, but it is</text>
<text x="18" y="998" font-size="12" fill="#111318">the first thing leagues take away. Re-check it every season before you install it.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Coach the shoulders, not the feet. If there is daylight between two linemen the wedge</text>
<text x="18" y="1032" font-size="12" fill="#111318">is a line of five men getting pushed backwards instead of one thing moving forward.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Low pads win this and nothing else does. The team that stands up loses.</text>
</svg>