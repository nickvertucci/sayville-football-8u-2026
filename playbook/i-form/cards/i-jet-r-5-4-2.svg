<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="331" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Start moving on the coach's motion</text>
<text x="331" y="630" font-size="12" fill="#111318">call and be at full speed when you</text>
<text x="331" y="646" font-size="12" fill="#111318">pass the quarterback. Take the pitch</text>
<text x="331" y="664" font-size="12" fill="#111318">and get around the corner — do not</text>
<text x="331" y="680" font-size="12" fill="#111318">turn upfield until you are outside</text>
<text x="331" y="698" font-size="12" fill="#111318">our end.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Turn and pitch it out to the Z as he</text>
<text x="331" y="732" font-size="12" fill="#111318">crosses, then carry out a boot fake</text>
<text x="331" y="748" font-size="12" fill="#111318">back to the left with your hands on</text>
<text x="331" y="766" font-size="12" fill="#111318">your belly.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Fill like Wedge is coming, then take</text>
<text x="331" y="800" font-size="12" fill="#111318">anyone chasing from inside.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="816" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="834" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="850" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">This is the answer when they start flying with the motion on Jet Left. Same</text>
<text x="18" y="912" font-size="12" fill="#111318">motion, same speed, coming from the other side.</text>
<text x="18" y="930" font-size="12" fill="#111318">Motion is legal in 11-man play, but only one man may be moving at the snap and he</text>
<text x="18" y="946" font-size="12" fill="#111318">cannot be moving toward the line. Keep the Z flat.</text>
<text x="18" y="964" font-size="12" fill="#111318">The pitch has to beat the Z to the corner. Get it to him deep and early so he</text>
<text x="18" y="980" font-size="12" fill="#111318">never breaks stride.</text>
<text x="18" y="998" font-size="12" fill="#111318">The tailback is the carrier's last blocker. If the corner beats him outside, the</text>
<text x="18" y="1014" font-size="12" fill="#111318">play dies — drill the block on air.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Do not install this until Jet Left is real. It only works because they have been</text>
<text x="18" y="1048" font-size="12" fill="#111318">punished for leaving with the motion.</text>
</svg>