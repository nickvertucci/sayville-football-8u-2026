<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the man over you and turn him</text>
<text x="52" y="596" font-size="12" fill="#111318">out.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block the man over you and drive him to</text>
<text x="52" y="630" font-size="12" fill="#111318">the outside. You are the outside wall</text>
<text x="52" y="646" font-size="12" fill="#111318">of the hole.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block the man over you and drive him to</text>
<text x="52" y="680" font-size="12" fill="#111318">the inside. You are the inside wall of</text>
<text x="52" y="698" font-size="12" fill="#111318">the hole.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Block the first defender to the</text>
<text x="52" y="732" font-size="12" fill="#111318">backside.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="766" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="782" font-size="12" fill="#111318">face.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="816" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="834" font-size="12" fill="#111318">face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="596" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Come across behind the line and cut off</text>
<text x="344" y="630" font-size="12" fill="#111318">anybody chasing from the backside.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Reverse pivot and hand the ball to the</text>
<text x="344" y="664" font-size="12" fill="#111318">tailback at four yards. Then clear out</text>
<text x="344" y="680" font-size="12" fill="#111318">and fake wide.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Lead through the hole between the guard</text>
<text x="344" y="714" font-size="12" fill="#111318">and the tackle. Put your facemask on</text>
<text x="344" y="732" font-size="12" fill="#111318">the linebacker and move him any</text>
<text x="344" y="748" font-size="12" fill="#111318">direction — just move him.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Take the handoff at four yards, get</text>
<text x="344" y="782" font-size="12" fill="#111318">downhill behind the fullback, and cut</text>
<text x="344" y="800" font-size="12" fill="#111318">off his block.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">Running away from the flanker means one fewer blocker out there, so the tailback has</text>
<text x="18" y="896" font-size="12" fill="#111318">to get north fast.</text>
<text x="18" y="912" font-size="12" fill="#111318">Their defense will usually shade toward our flanker. That is the reason this play</text>
<text x="18" y="930" font-size="12" fill="#111318">exists — check it before you call it.</text>
<text x="18" y="946" font-size="12" fill="#111318">Same block, same read as I Iso Right. Do not teach it as a new play, teach it as the</text>
<text x="18" y="964" font-size="12" fill="#111318">same play flipped.</text>
</svg>