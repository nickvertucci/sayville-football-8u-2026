<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="52" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="18" y="558" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="558" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="576" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="592" font-size="12" fill="#111318">face.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="626" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="644" font-size="12" fill="#111318">face.</text>
<text x="18" y="660" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="660" font-size="12" fill="#111318">Block the man over you. If nobody is</text>
<text x="52" y="678" font-size="12" fill="#111318">over you, help the playside guard and</text>
<text x="52" y="694" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="712" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="712" font-size="12" fill="#111318">Block the man over you and turn him</text>
<text x="52" y="728" font-size="12" fill="#111318">out. The hole is off your inside hip.</text>
<text x="18" y="746" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="746" font-size="12" fill="#111318">Block the man over you. Do not let him</text>
<text x="52" y="762" font-size="12" fill="#111318">slide inside.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Block the first defender on or inside</text>
<text x="344" y="542" font-size="12" fill="#111318">you.</text>
<text x="310" y="558" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="558" font-size="12" fill="#111318">Release and screen the deepest defender</text>
<text x="344" y="576" font-size="12" fill="#111318">on your side. Get in his way and stay</text>
<text x="344" y="592" font-size="12" fill="#111318">there.</text>
<text x="310" y="610" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="610" font-size="12" fill="#111318">Take the snap, open a quarter turn and</text>
<text x="344" y="626" font-size="12" fill="#111318">hand to the fullback at two yards. Then</text>
<text x="344" y="644" font-size="12" fill="#111318">carry out a fake to the outside.</text>
<text x="310" y="660" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="660" font-size="12" fill="#111318">Aim at the outside hip of the center.</text>
<text x="344" y="678" font-size="12" fill="#111318">Take the ball and get north. This is a</text>
<text x="344" y="694" font-size="12" fill="#111318">straight-ahead run — no reading, no</text>
<text x="344" y="712" font-size="12" fill="#111318">dancing.</text>
<text x="310" y="728" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="728" font-size="12" fill="#111318">Run the sweep path outside and sell it.</text>
<text x="344" y="746" font-size="12" fill="#111318">You will not get the ball on this play.</text>
<line x1="18" y1="770" x2="603" y2="770" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="788" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="808" font-size="12" fill="#111318">Snap to handoff should be under a second. If the fullback is waiting on the ball, the</text>
<text x="18" y="824" font-size="12" fill="#111318">play is already dead.</text>
<text x="18" y="842" font-size="12" fill="#111318">Best call when their linebackers start cheating wide to stop the sweep.</text>
<text x="18" y="858" font-size="12" fill="#111318">The fullback runs at a spot, not at a defender. Give him the outside hip of the</text>
<text x="18" y="876" font-size="12" fill="#111318">center and let him go.</text>
<text x="18" y="892" font-size="12" fill="#111318">Best short-yardage call in the book. Nobody has to read anything and the ball is over</text>
<text x="18" y="910" font-size="12" fill="#111318">the line before the defense moves.</text>
</svg>