<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Leave the end alone — he is getting</text>
<text x="52" y="596" font-size="12" fill="#111318">kicked out. Release past him and take</text>
<text x="52" y="612" font-size="12" fill="#111318">the outside linebacker before he can</text>
<text x="52" y="630" font-size="12" fill="#111318">fill.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Double the nose with the man beside</text>
<text x="52" y="714" font-size="12" fill="#111318">you and drive him off the spot, then</text>
<text x="52" y="732" font-size="12" fill="#111318">come off onto the middle linebacker</text>
<text x="52" y="748" font-size="12" fill="#111318">when he shows.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Reach the nose to your left. Get your</text>
<text x="52" y="782" font-size="12" fill="#111318">head across that shoulder so he</text>
<text x="52" y="800" font-size="12" fill="#111318">cannot run down the line after the</text>
<text x="52" y="816" font-size="12" fill="#111318">ball.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="834" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line</text>
<text x="52" y="850" font-size="12" fill="#111318">and kick the end out — aim at his</text>
<text x="52" y="868" font-size="12" fill="#111318">outside hip. The ball runs inside</text>
<text x="52" y="884" font-size="12" fill="#111318">your block.</text>
<text x="18" y="902" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="902" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="918" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="936" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="331" y="612" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="331" y="630" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Take one hard step upfield like the</text>
<text x="331" y="664" font-size="12" fill="#111318">toss is coming, then come back and</text>
<text x="331" y="680" font-size="12" fill="#111318">cut off the backside.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Take the snap, fake the toss the</text>
<text x="331" y="714" font-size="12" fill="#111318">other way with both hands, then turn</text>
<text x="331" y="732" font-size="12" fill="#111318">back and hand to the tailback. The</text>
<text x="331" y="748" font-size="12" fill="#111318">fake comes first — the handoff is</text>
<text x="331" y="766" font-size="12" fill="#111318">late on purpose.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Run the toss path to the other side</text>
<text x="331" y="800" font-size="12" fill="#111318">at full speed and block anything that</text>
<text x="331" y="816" font-size="12" fill="#111318">shows. You are the lie.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="834" font-size="12" fill="#111318">Take two hard steps toward the toss,</text>
<text x="331" y="850" font-size="12" fill="#111318">then plant and come back behind the</text>
<text x="331" y="868" font-size="12" fill="#111318">pulling guard. Those two steps are</text>
<text x="331" y="884" font-size="12" fill="#111318">the entire play.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">Do not call this until I Toss Right has gone for real yards. Misdirection off a</text>
<text x="18" y="998" font-size="12" fill="#111318">play they do not fear is just a slower run.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="1032" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The fullback selling the toss matters more than his block. Tell him he is the</text>
<text x="18" y="1066" font-size="12" fill="#111318">decoy and mean it.</text>
<text x="18" y="1082" font-size="12" fill="#111318">If their backside linebacker stops chasing the toss, go back to I Slant Left.</text>
</svg>