<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="344" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="344" y="630" font-size="12" fill="#111318">Stay in his way.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="344" y="664" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="344" y="680" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Lead outside our end, then turn up</text>
<text x="344" y="714" font-size="12" fill="#111318">inside — the playside linebacker is the</text>
<text x="344" y="732" font-size="12" fill="#111318">man who shows. Head across him.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the handoff and press outside our</text>
<text x="344" y="766" font-size="12" fill="#111318">end. Turn up off the fullback's block —</text>
<text x="344" y="782" font-size="12" fill="#111318">this hits outside the tight end, not</text>
<text x="344" y="800" font-size="12" fill="#111318">inside him.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Same down-block-and-kick-out rules as Split Power. If the kids know one they know</text>
<text x="18" y="862" font-size="12" fill="#111318">both — say that out loud when you install it.</text>
<text x="18" y="878" font-size="12" fill="#111318">The tailback starts deeper than a split back does, so the seal block has to hold a</text>
<text x="18" y="896" font-size="12" fill="#111318">beat longer. Drill it on a count.</text>
<text x="18" y="912" font-size="12" fill="#111318">The fullback stays tight to our end's block. Bellying out wide is what makes this</text>
<text x="18" y="930" font-size="12" fill="#111318">play late.</text>
<text x="18" y="946" font-size="12" fill="#111318">If the fullback cannot get outside in time, run I Iso instead — it hits straight</text>
<text x="18" y="964" font-size="12" fill="#111318">ahead.</text>
</svg>