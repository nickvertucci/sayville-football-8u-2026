<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block down on the end, head up. Head</text>
<text x="52" y="596" font-size="12" fill="#111318">across him — nobody crosses your face.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="714" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Bump the end, then release and settle</text>
<text x="344" y="596" font-size="12" fill="#111318">at eight yards on the boot side.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Run to the flat at four yards in front</text>
<text x="344" y="630" font-size="12" fill="#111318">of the quarterback. You are his easy</text>
<text x="344" y="646" font-size="12" fill="#111318">throw.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Fake the toss, hide it on your back</text>
<text x="344" y="680" font-size="12" fill="#111318">hip, run the edge. Throw only when they</text>
<text x="344" y="698" font-size="12" fill="#111318">take you.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Run the toss path away from the boot.</text>
<text x="344" y="732" font-size="12" fill="#111318">Block whatever shows.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Run the toss path away, arms tucked</text>
<text x="344" y="766" font-size="12" fill="#111318">like you have it. Sell it to the</text>
<text x="344" y="782" font-size="12" fill="#111318">sideline.</text>
<line x1="18" y1="790" x2="603" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">Our ends must engage their end before releasing — sell the run first, then get out.</text>
<text x="18" y="844" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="862" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="878" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="896" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="912" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>