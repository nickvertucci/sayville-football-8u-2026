<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards on the boot side. You</text>
<text x="52" y="630" font-size="12" fill="#111318">are the second look and you arrive late</text>
<text x="52" y="646" font-size="12" fill="#111318">on purpose.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="680" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="698" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="732" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="766" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="800" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="834" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="344" y="596" font-size="12" fill="#111318">then release to the flat at four yards</text>
<text x="344" y="612" font-size="12" fill="#111318">and stay in front of the quarterback.</text>
<text x="344" y="630" font-size="12" fill="#111318">You are the easy throw.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="646" font-size="12" fill="#111318">Release straight downfield outside the</text>
<text x="344" y="664" font-size="12" fill="#111318">end and run the corner off — clear him</text>
<text x="344" y="680" font-size="12" fill="#111318">out so the flat opens underneath, then</text>
<text x="344" y="698" font-size="12" fill="#111318">you are the deep shot if he sits.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="714" font-size="12" fill="#111318">Fake the handoff to the tailback going</text>
<text x="344" y="732" font-size="12" fill="#111318">left, hide the ball on your back hip,</text>
<text x="344" y="748" font-size="12" fill="#111318">and get to the right edge. Run it if it</text>
<text x="344" y="766" font-size="12" fill="#111318">is open. Only throw if a defender comes</text>
<text x="344" y="782" font-size="12" fill="#111318">up to take you.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="800" font-size="12" fill="#111318">Run your Power lead path left, then</text>
<text x="344" y="816" font-size="12" fill="#111318">look back for anyone chasing him.</text>
<text x="310" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="834" font-size="12" fill="#111318">Run the Power path to the left with</text>
<text x="344" y="850" font-size="12" fill="#111318">your arms tucked like you have the</text>
<text x="344" y="868" font-size="12" fill="#111318">ball. Sell it all the way — you are the</text>
<text x="344" y="884" font-size="12" fill="#111318">reason nobody stays home on the boot.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Do not call this until Power Left has hurt them. The whole play is a lie about Power,</text>
<text x="18" y="946" font-size="12" fill="#111318">so Power has to be worth lying about.</text>
<text x="18" y="964" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes the</text>
<text x="18" y="980" font-size="12" fill="#111318">fake dies and the flat defender is waiting.</text>
<text x="18" y="998" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="1014" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="1048" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="1066" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>