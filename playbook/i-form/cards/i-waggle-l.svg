<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="52" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="52" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Hinge and protect the waggle side.</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody comes free outside you — the</text>
<text x="52" y="680" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">PULL RIGHT and run the dive path to</text>
<text x="52" y="714" font-size="12" fill="#111318">sell the fake. You are a decoy — take</text>
<text x="52" y="732" font-size="12" fill="#111318">a linebacker with you.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Block the nose back toward the waggle</text>
<text x="52" y="766" font-size="12" fill="#111318">side. Nobody chases through the</text>
<text x="52" y="782" font-size="12" fill="#111318">middle.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="816" font-size="12" fill="#111318">on the nose and drive him away from</text>
<text x="52" y="834" font-size="12" fill="#111318">the waggle.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="868" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="884" font-size="12" fill="#111318">inside.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block down inside and sell the run.</text>
<text x="331" y="596" font-size="12" fill="#111318">This has to look exactly like a run</text>
<text x="331" y="612" font-size="12" fill="#111318">to your side.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Come all the way across the field</text>
<text x="331" y="646" font-size="12" fill="#111318">behind the line and get to eight</text>
<text x="331" y="664" font-size="12" fill="#111318">yards on the far side. You are the</text>
<text x="331" y="680" font-size="12" fill="#111318">second look and you arrive late on</text>
<text x="331" y="698" font-size="12" fill="#111318">purpose.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Fake the dive to the fullback with</text>
<text x="331" y="732" font-size="12" fill="#111318">both hands, hide the ball on your</text>
<text x="331" y="748" font-size="12" fill="#111318">back hip, and get to the edge. Run it</text>
<text x="331" y="766" font-size="12" fill="#111318">if it is open. Only throw if a</text>
<text x="331" y="782" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run the dive path full speed with</text>
<text x="331" y="816" font-size="12" fill="#111318">your arms tucked like you have it,</text>
<text x="331" y="834" font-size="12" fill="#111318">and block the first defender who</text>
<text x="331" y="850" font-size="12" fill="#111318">meets you. You are the lie.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="868" font-size="12" fill="#111318">Come around behind the quarterback</text>
<text x="331" y="884" font-size="12" fill="#111318">and protect the outside. Anybody</text>
<text x="331" y="902" font-size="12" fill="#111318">chasing him from behind is yours.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">This is the partner to Boot Right, not a replacement for it. Call the one that</text>
<text x="18" y="964" font-size="12" fill="#111318">goes away from wherever their outside linebacker has started cheating.</text>
<text x="18" y="980" font-size="12" fill="#111318">The end must engage before he releases. If he runs straight into the flat the</text>
<text x="18" y="998" font-size="12" fill="#111318">whole fake dies and the flat defender is waiting for him.</text>
<text x="18" y="1014" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1032" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The Z coming all the way across is a long trip. He is the second read and he is</text>
<text x="18" y="1066" font-size="12" fill="#111318">late by design — the quarterback must not stand there waiting for him.</text>
<text x="18" y="1082" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>