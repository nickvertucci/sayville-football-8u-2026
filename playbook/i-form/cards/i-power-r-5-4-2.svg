<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Leave the end — he is kicked out. Go</text>
<text x="344" y="596" font-size="12" fill="#111318">take the outside linebacker.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Kick the end out. Aim at his outside</text>
<text x="344" y="630" font-size="12" fill="#111318">hip. Never let him come underneath you.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Open to the right, hand it deep to the</text>
<text x="344" y="664" font-size="12" fill="#111318">tailback, then carry out the boot fake</text>
<text x="344" y="680" font-size="12" fill="#111318">to the edge. The fake is what keeps the</text>
<text x="344" y="698" font-size="12" fill="#111318">backside end honest.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="732" font-size="12" fill="#111318">man who shows in it.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the handoff going downhill and aim</text>
<text x="344" y="766" font-size="12" fill="#111318">at the outside hip of our tackle.</text>
<text x="344" y="782" font-size="12" fill="#111318">Follow the fullback through the hole.</text>
<text x="344" y="800" font-size="12" fill="#111318">Stay tight to the blocks and do not</text>
<text x="344" y="816" font-size="12" fill="#111318">bounce it outside.</text>
<line x1="18" y1="824" x2="603" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">This is the most physical run in the book. If it works you can run it fifteen times,</text>
<text x="18" y="878" font-size="12" fill="#111318">and at this age you often can.</text>
<text x="18" y="896" font-size="12" fill="#111318">Drill the Z's kick-out on its own. If he blocks the end with his shoulders square,</text>
<text x="18" y="912" font-size="12" fill="#111318">the end slides underneath and makes the tackle for a loss — he has to attack the</text>
<text x="18" y="930" font-size="12" fill="#111318">outside hip.</text>
<text x="18" y="946" font-size="12" fill="#111318">The fullback's man is whoever shows in the hole, not a man he picks before the snap.</text>
<text x="18" y="964" font-size="12" fill="#111318">Tell him that every time.</text>
<text x="18" y="980" font-size="12" fill="#111318">The tailback's most common mistake is bouncing it wide looking for green grass. The</text>
<text x="18" y="998" font-size="12" fill="#111318">yards are inside the Z's block. Make him run it tight in practice until it is</text>
<text x="18" y="1014" font-size="12" fill="#111318">automatic.</text>
</svg>