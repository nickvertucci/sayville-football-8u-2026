<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release to the flat at four yards</text>
<text x="52" y="612" font-size="12" fill="#111318">and stay in front of the quarterback.</text>
<text x="52" y="630" font-size="12" fill="#111318">You are the easy throw.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="698" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="732" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="766" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block down on the end, inside shoulder.</text>
<text x="344" y="596" font-size="12" fill="#111318">Head across him — nobody crosses your</text>
<text x="344" y="612" font-size="12" fill="#111318">face.</text>
<text x="310" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="630" font-size="12" fill="#111318">Come all the way across the field</text>
<text x="344" y="646" font-size="12" fill="#111318">behind the line and get to eight yards</text>
<text x="344" y="664" font-size="12" fill="#111318">on the far side. You are the second</text>
<text x="344" y="680" font-size="12" fill="#111318">look and you arrive late on purpose.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="698" font-size="12" fill="#111318">Fake the dive to the fullback with both</text>
<text x="344" y="714" font-size="12" fill="#111318">hands, hide the ball on your back hip,</text>
<text x="344" y="732" font-size="12" fill="#111318">and get to the edge. Run it if it is</text>
<text x="344" y="748" font-size="12" fill="#111318">open. Only throw if a defender comes up</text>
<text x="344" y="766" font-size="12" fill="#111318">to take you.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="782" font-size="12" fill="#111318">Run the dive path full speed with your</text>
<text x="344" y="800" font-size="12" fill="#111318">arms tucked like you have it, and block</text>
<text x="344" y="816" font-size="12" fill="#111318">the first defender who meets you. You</text>
<text x="344" y="834" font-size="12" fill="#111318">are the lie.</text>
<text x="310" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="850" font-size="12" fill="#111318">Come behind the quarterback and protect</text>
<text x="344" y="868" font-size="12" fill="#111318">his outside. Anyone chasing him is</text>
<text x="344" y="884" font-size="12" fill="#111318">yours.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">This is the partner to I Waggle Right, not a replacement for it. Call the one that</text>
<text x="18" y="946" font-size="12" fill="#111318">boots away from wherever their outside linebacker has started cheating.</text>
<text x="18" y="964" font-size="12" fill="#111318">The end must engage before he releases. If he runs straight into the flat the whole</text>
<text x="18" y="980" font-size="12" fill="#111318">fake dies and the flat defender is waiting for him.</text>
<text x="18" y="998" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="1014" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The Z coming all the way across is a long trip. He is the second read and he is late</text>
<text x="18" y="1048" font-size="12" fill="#111318">by design — the quarterback must not stand there waiting for him.</text>
<text x="18" y="1066" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>