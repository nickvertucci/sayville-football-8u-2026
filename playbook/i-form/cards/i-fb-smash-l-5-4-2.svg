<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="630" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="646" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the defensive tackle,</text>
<text x="52" y="782" font-size="12" fill="#111318">inside shoulder. Head across him —</text>
<text x="52" y="800" font-size="12" fill="#111318">nobody crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him</text>
<text x="344" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="612" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="344" y="630" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Open left, hand to the fullback right</text>
<text x="344" y="664" font-size="12" fill="#111318">now, then fake the boot right. It holds</text>
<text x="344" y="680" font-size="12" fill="#111318">the backside end.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="344" y="714" font-size="12" fill="#111318">center and the left guard. You are the</text>
<text x="344" y="732" font-size="12" fill="#111318">runner on this one, not the lead.</text>
<text x="344" y="748" font-size="12" fill="#111318">Straight ahead, do not bounce it.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Run hard to the right like you have the</text>
<text x="344" y="782" font-size="12" fill="#111318">ball. You are what holds the backside</text>
<text x="344" y="800" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">This is the quick one. The fullback is only two yards from the hole -- he has the</text>
<text x="18" y="862" font-size="12" fill="#111318">ball before the linebackers have moved.</text>
<text x="18" y="878" font-size="12" fill="#111318">The hole is the A-gap, between the center and the left guard. Nobody leads him</text>
<text x="18" y="896" font-size="12" fill="#111318">through it; his speed is the lead.</text>
<text x="18" y="912" font-size="12" fill="#111318">The tailback's fake is the play as much as the handoff. If he jogs, the backside</text>
<text x="18" y="930" font-size="12" fill="#111318">linebacker is in the hole.</text>
</svg>