<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="52" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="646" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="664" font-size="12" fill="#111318">your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="698" font-size="12" fill="#111318">backside — nothing chases this from</text>
<text x="52" y="714" font-size="12" fill="#111318">behind.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Reach the nose. Get your head across</text>
<text x="52" y="748" font-size="12" fill="#111318">his playside shoulder so he cannot</text>
<text x="52" y="766" font-size="12" fill="#111318">run down the line.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Climb straight to</text>
<text x="52" y="800" font-size="12" fill="#111318">the middle linebacker and cut him off</text>
<text x="52" y="816" font-size="12" fill="#111318">from the sideline.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="850" font-size="12" fill="#111318">shoulder. Get your head across him</text>
<text x="52" y="868" font-size="12" fill="#111318">and wall him off so he cannot chase.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Reach the end over you. If you cannot</text>
<text x="331" y="596" font-size="12" fill="#111318">reach him, turn him inside and let</text>
<text x="331" y="612" font-size="12" fill="#111318">the ball go around.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Block the corner on your side. Run at</text>
<text x="331" y="646" font-size="12" fill="#111318">his outside number and screen him</text>
<text x="331" y="664" font-size="12" fill="#111318">away from the ball.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Reverse pivot and hand the ball to</text>
<text x="331" y="698" font-size="12" fill="#111318">the tailback as deep as you can. Then</text>
<text x="331" y="714" font-size="12" fill="#111318">boot away and sell it.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Beat the tailback to the corner and</text>
<text x="331" y="748" font-size="12" fill="#111318">kick out the first defender who</text>
<text x="331" y="766" font-size="12" fill="#111318">shows. You are the lead blocker — get</text>
<text x="331" y="782" font-size="12" fill="#111318">there first.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="800" font-size="12" fill="#111318">Take the handoff at full speed and</text>
<text x="331" y="816" font-size="12" fill="#111318">get to the corner. Turn up when the</text>
<text x="331" y="834" font-size="12" fill="#111318">fullback blocks somebody, not before.</text>
<line x1="18" y1="874" x2="576" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">The tailback is deep enough to get outside — but only if he is at full speed by</text>
<text x="18" y="930" font-size="12" fill="#111318">the time he takes the handoff.</text>
<text x="18" y="946" font-size="12" fill="#111318">The fullback has to beat the tailback to the corner. If he is trailing, the play</text>
<text x="18" y="964" font-size="12" fill="#111318">has no lead blocker.</text>
<text x="18" y="980" font-size="12" fill="#111318">One rule for the tailback: turn up off the fullback's block. Running to the</text>
<text x="18" y="998" font-size="12" fill="#111318">sideline is how this play loses eight yards.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Watch our end reach-blocking. If he cannot reach their end, run I Slant to that</text>
<text x="18" y="1032" font-size="12" fill="#111318">side instead.</text>
</svg>