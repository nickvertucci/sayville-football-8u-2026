<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Leave the end alone — he is getting</text>
<text x="52" y="596" font-size="12" fill="#111318">kicked out. Release past him and take</text>
<text x="52" y="612" font-size="12" fill="#111318">the outside linebacker before he can</text>
<text x="52" y="630" font-size="12" fill="#111318">fill.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">The tackle is head up on you. Hands</text>
<text x="52" y="714" font-size="12" fill="#111318">inside, pads under his, and drive him</text>
<text x="52" y="732" font-size="12" fill="#111318">straight back.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody is over you. Climb to the</text>
<text x="52" y="766" font-size="12" fill="#111318">playside linebacker and get your head</text>
<text x="52" y="782" font-size="12" fill="#111318">across him — he is the man who makes</text>
<text x="52" y="800" font-size="12" fill="#111318">this tackle if nobody gets to him.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="816" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line</text>
<text x="52" y="834" font-size="12" fill="#111318">and kick the end out — aim at his</text>
<text x="52" y="850" font-size="12" fill="#111318">outside hip. The ball runs inside</text>
<text x="52" y="868" font-size="12" fill="#111318">your block.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="902" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="918" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is on your inside shoulder.</text>
<text x="331" y="596" font-size="12" fill="#111318">Cut him off from the play — get your</text>
<text x="331" y="612" font-size="12" fill="#111318">body between him and the ball. You</text>
<text x="331" y="630" font-size="12" fill="#111318">are the last one to it, so never quit</text>
<text x="331" y="646" font-size="12" fill="#111318">on it.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="664" font-size="12" fill="#111318">Take one hard step upfield like the</text>
<text x="331" y="680" font-size="12" fill="#111318">toss is coming, then come back and</text>
<text x="331" y="698" font-size="12" fill="#111318">cut off the backside.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Take the snap, fake the toss the</text>
<text x="331" y="732" font-size="12" fill="#111318">other way with both hands, then turn</text>
<text x="331" y="748" font-size="12" fill="#111318">back and hand to the tailback. The</text>
<text x="331" y="766" font-size="12" fill="#111318">fake comes first — the handoff is</text>
<text x="331" y="782" font-size="12" fill="#111318">late on purpose.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run the toss path to the other side</text>
<text x="331" y="816" font-size="12" fill="#111318">at full speed and block anything that</text>
<text x="331" y="834" font-size="12" fill="#111318">shows. You are the lie.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Take two hard steps toward the toss,</text>
<text x="331" y="868" font-size="12" fill="#111318">then plant and come back behind the</text>
<text x="331" y="884" font-size="12" fill="#111318">pulling guard. Those two steps are</text>
<text x="331" y="902" font-size="12" fill="#111318">the entire play.</text>
<line x1="18" y1="926" x2="576" y2="926" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="944" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="964" font-size="12" fill="#111318">Do not call this until I Toss Right has gone for real yards. Misdirection off a</text>
<text x="18" y="980" font-size="12" fill="#111318">play they do not fear is just a slower run.</text>
<text x="18" y="998" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="1014" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="1032" font-size="12" fill="#111318">The fullback selling the toss matters more than his block. Tell him he is the</text>
<text x="18" y="1048" font-size="12" fill="#111318">decoy and mean it.</text>
<text x="18" y="1066" font-size="12" fill="#111318">If their backside linebacker stops chasing the toss, go back to I Slant Left.</text>
</svg>