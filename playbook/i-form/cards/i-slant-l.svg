<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Seal the end inside. Get your head</text>
<text x="52" y="596" font-size="12" fill="#111318">across him and turn him in — the ball</text>
<text x="52" y="612" font-size="12" fill="#111318">is going outside you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="664" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="698" font-size="12" fill="#111318">drive the nose for one count, then</text>
<text x="52" y="714" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="748" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="766" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">PULL LEFT. Run flat behind the line</text>
<text x="52" y="800" font-size="12" fill="#111318">and turn up outside our end. Block</text>
<text x="52" y="816" font-size="12" fill="#111318">the first wrong-colored jersey you</text>
<text x="52" y="834" font-size="12" fill="#111318">see.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="868" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="884" font-size="12" fill="#111318">your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Come across behind the line and cut</text>
<text x="331" y="646" font-size="12" fill="#111318">off anybody chasing from the</text>
<text x="331" y="664" font-size="12" fill="#111318">backside.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="331" y="698" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="331" y="714" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Lead through the hole outside our end</text>
<text x="331" y="748" font-size="12" fill="#111318">and block the first defender who</text>
<text x="331" y="766" font-size="12" fill="#111318">shows.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="782" font-size="12" fill="#111318">Take the handoff and press outside</text>
<text x="331" y="800" font-size="12" fill="#111318">our end. Turn up off the fullback's</text>
<text x="331" y="816" font-size="12" fill="#111318">block — this hits outside the tight</text>
<text x="331" y="834" font-size="12" fill="#111318">end, not inside him.</text>
<line x1="18" y1="892" x2="576" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Check their alignment first. If they have shaded toward our Z, this is the call.</text>
<text x="18" y="946" font-size="12" fill="#111318">The Z chases from behind. Tell him he is not decoration — he cuts off the corner</text>
<text x="18" y="964" font-size="12" fill="#111318">who would otherwise run this down.</text>
<text x="18" y="980" font-size="12" fill="#111318">Everything else is I Slant Right in a mirror. Teach the pair together.</text>
</svg>