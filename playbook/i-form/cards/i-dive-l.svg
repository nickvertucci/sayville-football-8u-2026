<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="52" y="596" font-size="12" fill="#111318">out and away from the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="646" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody is over you. Double the nose</text>
<text x="52" y="680" font-size="12" fill="#111318">with the center, and come off onto</text>
<text x="52" y="698" font-size="12" fill="#111318">the middle linebacker when he shows.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">You and the playside guard double the</text>
<text x="52" y="732" font-size="12" fill="#111318">nose. Drive him off the spot — the</text>
<text x="52" y="748" font-size="12" fill="#111318">hole is right off his back.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody is over you. Step back inside</text>
<text x="52" y="782" font-size="12" fill="#111318">and cut off anyone chasing through</text>
<text x="52" y="800" font-size="12" fill="#111318">the middle.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="834" font-size="12" fill="#111318">shoulder. Get your head across him</text>
<text x="52" y="850" font-size="12" fill="#111318">and wall him off so he cannot chase.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="331" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="331" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Come across behind the line and cut</text>
<text x="331" y="646" font-size="12" fill="#111318">off the corner chasing from the</text>
<text x="331" y="664" font-size="12" fill="#111318">backside.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Take the snap, open a quarter turn</text>
<text x="331" y="698" font-size="12" fill="#111318">and hand to the fullback at two</text>
<text x="331" y="714" font-size="12" fill="#111318">yards. Then carry out a fake to the</text>
<text x="331" y="732" font-size="12" fill="#111318">outside.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="748" font-size="12" fill="#111318">Aim at the outside hip of the center,</text>
<text x="331" y="766" font-size="12" fill="#111318">right off the double team. Take the</text>
<text x="331" y="782" font-size="12" fill="#111318">ball and get north — no reading, no</text>
<text x="331" y="800" font-size="12" fill="#111318">dancing.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="816" font-size="12" fill="#111318">Run the toss path outside and sell</text>
<text x="331" y="834" font-size="12" fill="#111318">it. You will not get the ball on this</text>
<text x="331" y="850" font-size="12" fill="#111318">play.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">Snap to handoff should be under a second. If the fullback is waiting on the ball,</text>
<text x="18" y="912" font-size="12" fill="#111318">the play is already dead.</text>
<text x="18" y="930" font-size="12" fill="#111318">Run it the same week you install the right-hand one. The whole value of having</text>
<text x="18" y="946" font-size="12" fill="#111318">both is that their middle linebacker cannot lean.</text>
<text x="18" y="964" font-size="12" fill="#111318">The fullback runs at a spot, not at a defender. Give him the outside hip of the</text>
<text x="18" y="980" font-size="12" fill="#111318">center and let him go.</text>
<text x="18" y="998" font-size="12" fill="#111318">The Z is away from the play here, so he has further to travel to cut off the</text>
<text x="18" y="1014" font-size="12" fill="#111318">backside. He leaves on the snap.</text>
</svg>