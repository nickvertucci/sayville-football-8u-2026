<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the playside linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="344" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="630" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="646" font-size="12" fill="#111318">linebacker.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Fake the toss away with both hands,</text>
<text x="344" y="680" font-size="12" fill="#111318">then turn and hand to the tailback.</text>
<text x="344" y="698" font-size="12" fill="#111318">Fake first.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Run the toss path the other way, full</text>
<text x="344" y="732" font-size="12" fill="#111318">speed. You are the lie.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Sell two hard steps at the toss, then</text>
<text x="344" y="766" font-size="12" fill="#111318">plant and come back behind our end's</text>
<text x="344" y="782" font-size="12" fill="#111318">block.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Do not call this until I Toss Left has gone for real yards. Misdirection off a play</text>
<text x="18" y="862" font-size="12" fill="#111318">they do not fear is just a slower run.</text>
<text x="18" y="878" font-size="12" fill="#111318">This one has the Z on the playside, which Counter Left does not. That is a blocker</text>
<text x="18" y="896" font-size="12" fill="#111318">Counter Left never had, so this is the better of the pair against a team that flows</text>
<text x="18" y="912" font-size="12" fill="#111318">hard.</text>
<text x="18" y="930" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="946" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="964" font-size="12" fill="#111318">Teach it the same day as Counter Left. The line rules are identical both ways and</text>
<text x="18" y="980" font-size="12" fill="#111318">nobody moves, so there is nothing extra to learn.</text>
<text x="18" y="998" font-size="12" fill="#111318">With nobody pulling, the tight end kicks the end out himself. Against a</text>
<text x="18" y="1014" font-size="12" fill="#111318">four-linebacker front that leaves the outside linebacker free — the Z takes him if he</text>
<text x="18" y="1032" font-size="12" fill="#111318">fills, and if he keeps making the tackle, run Toss at him instead.</text>
</svg>