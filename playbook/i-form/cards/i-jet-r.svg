<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind.</text>
<text x="52" y="596" font-size="12" fill="#111318">Everything is running away from you,</text>
<text x="52" y="612" font-size="12" fill="#111318">so chase flat down the line and never</text>
<text x="52" y="630" font-size="12" fill="#111318">quit.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="664" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="680" font-size="12" fill="#111318">your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="714" font-size="12" fill="#111318">on the nose for a count, then chase</text>
<text x="52" y="732" font-size="12" fill="#111318">flat behind the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose. Get your body</text>
<text x="52" y="766" font-size="12" fill="#111318">between him and the ball and drive</text>
<text x="52" y="782" font-size="12" fill="#111318">him away from where we are going.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">PULL RIGHT. Stay flat, get outside</text>
<text x="52" y="816" font-size="12" fill="#111318">our end, and turn up. Block the first</text>
<text x="52" y="834" font-size="12" fill="#111318">defender who shows outside — usually</text>
<text x="52" y="850" font-size="12" fill="#111318">the corner. You are the last blocker</text>
<text x="52" y="868" font-size="12" fill="#111318">the carrier has.</text>
<text x="18" y="884" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="884" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="902" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="918" font-size="12" fill="#111318">inside. He must not run down the line</text>
<text x="52" y="936" font-size="12" fill="#111318">with the play.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the end over you out toward the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. Stay on him — the ball is</text>
<text x="331" y="612" font-size="12" fill="#111318">going around you and he cannot be the</text>
<text x="331" y="630" font-size="12" fill="#111318">one to make the tackle.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Jet in motion to the right on the</text>
<text x="331" y="664" font-size="12" fill="#111318">coach's call, full speed, and take</text>
<text x="331" y="680" font-size="12" fill="#111318">the pitch behind the pulling guard.</text>
<text x="331" y="698" font-size="12" fill="#111318">Get around our end before you turn up</text>
<text x="331" y="714" font-size="12" fill="#111318">— do not cut it inside.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Turn and pitch it out to the flanker</text>
<text x="331" y="748" font-size="12" fill="#111318">as he crosses, then carry out a boot</text>
<text x="331" y="766" font-size="12" fill="#111318">fake back to the left with your hands</text>
<text x="331" y="782" font-size="12" fill="#111318">on your belly.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="800" font-size="12" fill="#111318">Fill straight ahead like Wedge is</text>
<text x="331" y="816" font-size="12" fill="#111318">coming, then look for anyone chasing</text>
<text x="331" y="834" font-size="12" fill="#111318">the flanker from the inside.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Run the Power path to the right and</text>
<text x="331" y="868" font-size="12" fill="#111318">get out in front — block the first</text>
<text x="331" y="884" font-size="12" fill="#111318">man to show inside the pulling guard.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">This is the answer when their end starts chasing Jet Left flat down the line —</text>
<text x="18" y="998" font-size="12" fill="#111318">the flanker pitches off his own edge before the end can recover.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Motion is legal in 11-man play, but only one man may be moving at the snap and he</text>
<text x="18" y="1032" font-size="12" fill="#111318">cannot be moving toward the line. Keep the flanker flat.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The pitch has to beat the flanker to the corner. Get it to him deep and early so</text>
<text x="18" y="1066" font-size="12" fill="#111318">he never breaks stride.</text>
<text x="18" y="1082" font-size="12" fill="#111318">The pulling guard is the carrier's last blocker. If the corner beats him outside,</text>
<text x="18" y="1100" font-size="12" fill="#111318">the play dies — drill the block on air.</text>
<text x="18" y="1116" font-size="12" fill="#111318">Do not install this until Jet Left is real. It only works because they have been</text>
<text x="18" y="1134" font-size="12" fill="#111318">punished for leaving with the motion.</text>
</svg>