<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="52" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle on your inside shoulder. Cut him</text>
<text x="52" y="782" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="344" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Reverse pivot, hand to the tailback at</text>
<text x="344" y="664" font-size="12" fill="#111318">four yards, then clear out and fake</text>
<text x="344" y="680" font-size="12" fill="#111318">wide.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Lead through the hole. Block the first</text>
<text x="344" y="714" font-size="12" fill="#111318">man who shows in it. Move him any</text>
<text x="344" y="732" font-size="12" fill="#111318">direction — just move him.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the handoff at four yards, get</text>
<text x="344" y="766" font-size="12" fill="#111318">downhill behind the fullback, and cut</text>
<text x="344" y="782" font-size="12" fill="#111318">off his block.</text>
<line x1="18" y1="790" x2="603" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">Running away from the Z means one fewer blocker out there, so the tailback has to get</text>
<text x="18" y="844" font-size="12" fill="#111318">north fast.</text>
<text x="18" y="862" font-size="12" fill="#111318">Their defense will usually shade toward our Z. That is the reason this play exists —</text>
<text x="18" y="878" font-size="12" fill="#111318">check it before you call it.</text>
<text x="18" y="896" font-size="12" fill="#111318">Same block, same read as I Iso Right. Do not teach it as a new play, teach it as the</text>
<text x="18" y="912" font-size="12" fill="#111318">same play flipped.</text>
</svg>