<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="52" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="52" y="612" font-size="12" fill="#111318">you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="698" font-size="12" fill="#111318">Climb to the playside linebacker. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="782" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="816" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="834" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="344" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Reverse pivot, hand it deep to the</text>
<text x="344" y="664" font-size="12" fill="#111318">tailback, then fake the bootleg away</text>
<text x="344" y="680" font-size="12" fill="#111318">from the play.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="714" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="732" font-size="12" fill="#111318">linebacker.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the handoff and press outside our</text>
<text x="344" y="766" font-size="12" fill="#111318">end. Turn up off the fullback's block,</text>
<text x="344" y="782" font-size="12" fill="#111318">never inside.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">Check their alignment first. If they have shaded toward our Z, this is the call.</text>
<text x="18" y="896" font-size="12" fill="#111318">The Z chases from the back side, and his man is the backside linebacker — not the</text>
<text x="18" y="912" font-size="12" fill="#111318">corner, who is on the far side of the field from him. Tell him he is not decoration:</text>
<text x="18" y="930" font-size="12" fill="#111318">he is the reason nothing catches this from behind.</text>
<text x="18" y="946" font-size="12" fill="#111318">Nobody is assigned to their playside corner. Against the 5-3 the fullback's lead</text>
<text x="18" y="964" font-size="12" fill="#111318">block finds him anyway; against a four-linebacker front the fullback has the outside</text>
<text x="18" y="980" font-size="12" fill="#111318">linebacker instead and the tailback beats the corner himself or gets caught.</text>
<text x="18" y="998" font-size="12" fill="#111318">The line and the fullback are I Slant Right in a mirror. Only the Z is different,</text>
<text x="18" y="1014" font-size="12" fill="#111318">because he lines up on the right either way. Teach the pair together.</text>
</svg>