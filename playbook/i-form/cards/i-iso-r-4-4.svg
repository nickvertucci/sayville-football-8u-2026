<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="630" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="664" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="698" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="714" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="732" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="748" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="766" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="782" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Drive</text>
<text x="331" y="596" font-size="12" fill="#111318">him to the sideline. The ball goes</text>
<text x="331" y="612" font-size="12" fill="#111318">inside you.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="630" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="646" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="664" font-size="12" fill="#111318">Reverse pivot, hand to the tailback</text>
<text x="331" y="680" font-size="12" fill="#111318">at four yards, then clear out and</text>
<text x="331" y="698" font-size="12" fill="#111318">fake wide.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="714" font-size="12" fill="#111318">Lead through the hole. Block the</text>
<text x="331" y="732" font-size="12" fill="#111318">first man who shows in it. Move him</text>
<text x="331" y="748" font-size="12" fill="#111318">any direction — just move him.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="766" font-size="12" fill="#111318">Take the handoff at four yards and</text>
<text x="331" y="782" font-size="12" fill="#111318">run downhill off the fullback's</text>
<text x="331" y="800" font-size="12" fill="#111318">block. He goes outside, you cut</text>
<text x="331" y="816" font-size="12" fill="#111318">inside.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Drill the fullback's block by itself with a bag. He does not have to win — he has</text>
<text x="18" y="878" font-size="12" fill="#111318">to make the linebacker pick a side.</text>
<text x="18" y="896" font-size="12" fill="#111318">Teach the tailback one rule: cut off the fullback's back. Do not let him decide</text>
<text x="18" y="912" font-size="12" fill="#111318">before he gets there.</text>
<text x="18" y="930" font-size="12" fill="#111318">If their linebacker is faster than our fullback, stop calling this and run I</text>
<text x="18" y="946" font-size="12" fill="#111318">Slant instead.</text>
<text x="18" y="964" font-size="12" fill="#111318">The tailback should be running downhill at the hole, not sideways looking for</text>
<text x="18" y="980" font-size="12" fill="#111318">one.</text>
</svg>