<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Drive him</text>
<text x="52" y="596" font-size="12" fill="#111318">to the sideline. The ball goes inside</text>
<text x="52" y="612" font-size="12" fill="#111318">you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="698" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="732" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="766" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="800" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="344" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Take the snap, open a quarter turn and</text>
<text x="344" y="664" font-size="12" fill="#111318">hand to the fullback at two yards. Then</text>
<text x="344" y="680" font-size="12" fill="#111318">carry out a fake to the outside.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="698" font-size="12" fill="#111318">Aim at the outside hip of the center,</text>
<text x="344" y="714" font-size="12" fill="#111318">right off the double team. Take the</text>
<text x="344" y="732" font-size="12" fill="#111318">ball and get north — no reading, no</text>
<text x="344" y="748" font-size="12" fill="#111318">dancing.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Run the toss path outside and sell it.</text>
<text x="344" y="782" font-size="12" fill="#111318">You will not get the ball on this play.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Snap to handoff should be under a second. If the fullback is waiting on the ball, the</text>
<text x="18" y="862" font-size="12" fill="#111318">play is already dead.</text>
<text x="18" y="878" font-size="12" fill="#111318">Run it the same week you install the right-hand one. The whole value of having both</text>
<text x="18" y="896" font-size="12" fill="#111318">is that their middle linebacker cannot lean.</text>
<text x="18" y="912" font-size="12" fill="#111318">The fullback runs at a spot, not at a defender. Give him the outside hip of the</text>
<text x="18" y="930" font-size="12" fill="#111318">center and let him go.</text>
<text x="18" y="946" font-size="12" fill="#111318">The Z is away from the play here, so he has further to travel to cut off the</text>
<text x="18" y="964" font-size="12" fill="#111318">backside. He leaves on the snap.</text>
</svg>