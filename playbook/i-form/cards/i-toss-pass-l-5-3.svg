<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the end the way you do on the toss, then</text>
<text x="52" y="596" font-size="12" fill="#111318">slant out flat toward the sideline, almost on</text>
<text x="52" y="612" font-size="12" fill="#111318">the line. Look for the ball right away.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="646" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="680" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="714" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="748" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="52" y="782" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Pass block: step back, hands up, and stay</text>
<text x="385" y="596" font-size="12" fill="#111318">between your man and the quarterback.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Pitch it exactly the way you pitch the toss,</text>
<text x="385" y="664" font-size="12" fill="#111318">then run right like you still have it. Do not</text>
<text x="385" y="680" font-size="12" fill="#111318">turn and watch the throw.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="698" font-size="12" fill="#111318">Bubble outside our end the same as the toss</text>
<text x="385" y="714" font-size="12" fill="#111318">and take the first man out there. He is the</text>
<text x="385" y="732" font-size="12" fill="#111318">one who gets to the thrower.</text>
<text x="351" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="748" font-size="12" fill="#111318">Catch the pitch and run the toss. At our tight</text>
<text x="385" y="766" font-size="12" fill="#111318">end, pull up behind the line and throw it flat</text>
<text x="385" y="782" font-size="12" fill="#111318">to the tight end in front of you.</text>
<line x1="18" y1="790" x2="684" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">Everything is the toss until he pulls up. Same pitch, same path, same speed -- a tailback who slows</text>
<text x="18" y="844" font-size="12" fill="#111318">down to throw has told them.</text>
<text x="18" y="862" font-size="12" fill="#111318">He throws from behind the line. Crossing it is a penalty, so drill the pull-up, not the arm.</text>
<text x="18" y="878" font-size="12" fill="#111318">The tight end blocks the end first, then slants out flat, almost on the line. It is a three-yard</text>
<text x="18" y="896" font-size="12" fill="#111318">throw and it should never be more than that.</text>
<text x="18" y="912" font-size="12" fill="#111318">Call it after the toss has hurt them, on first or second down, where an incompletion costs nothing.</text>
</svg>