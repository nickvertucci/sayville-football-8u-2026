<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Bump the end, then release to the flat</text>
<text x="52" y="596" font-size="12" fill="#111318">at four yards in front of the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="646" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="714" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block down on the end, head up. Head</text>
<text x="344" y="596" font-size="12" fill="#111318">across him — nobody crosses your face.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Cross behind the line to eight yards on</text>
<text x="344" y="630" font-size="12" fill="#111318">the far side. Second look, late on</text>
<text x="344" y="646" font-size="12" fill="#111318">purpose.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Fake the dive, hide it on your back</text>
<text x="344" y="680" font-size="12" fill="#111318">hip, run the edge. Throw only when they</text>
<text x="344" y="698" font-size="12" fill="#111318">take you.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Run the dive path full speed, arms</text>
<text x="344" y="732" font-size="12" fill="#111318">tucked, and block whoever meets you. Be</text>
<text x="344" y="748" font-size="12" fill="#111318">the lie.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Come behind the quarterback and protect</text>
<text x="344" y="782" font-size="12" fill="#111318">his outside. Anyone chasing him is</text>
<text x="344" y="800" font-size="12" fill="#111318">yours.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">This is the partner to I Waggle Right, not a replacement for it. Call the one that</text>
<text x="18" y="862" font-size="12" fill="#111318">boots away from wherever their outside linebacker has started cheating.</text>
<text x="18" y="878" font-size="12" fill="#111318">The end must engage before he releases. If he runs straight into the flat the whole</text>
<text x="18" y="896" font-size="12" fill="#111318">fake dies and the flat defender is waiting for him.</text>
<text x="18" y="912" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="930" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="946" font-size="12" fill="#111318">The Z coming all the way across is a long trip. He is the second read and he is late</text>
<text x="18" y="964" font-size="12" fill="#111318">by design — the quarterback must not stand there waiting for him.</text>
<text x="18" y="980" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>