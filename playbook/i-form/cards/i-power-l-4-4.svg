<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left tackle, then block</text>
<text x="52" y="612" font-size="12" fill="#111318">the left inside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the right tackle, then block</text>
<text x="52" y="664" font-size="12" fill="#111318">the right inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right tackle.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Block the right outside linebacker.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Block the right end.</text>
<text x="297" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="596" font-size="12" fill="#111318">Block the left corner.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="612" font-size="12" fill="#111318">Open left, hand deep to the tailback,</text>
<text x="331" y="630" font-size="12" fill="#111318">then fake the boot. It holds the</text>
<text x="331" y="646" font-size="12" fill="#111318">backside end.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="664" font-size="12" fill="#111318">Lead through the hole, then block the</text>
<text x="331" y="680" font-size="12" fill="#111318">left outside linebacker.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="698" font-size="12" fill="#111318">Take the handoff downhill at our</text>
<text x="331" y="714" font-size="12" fill="#111318">tackle's outside hip, following the</text>
<text x="331" y="732" font-size="12" fill="#111318">fullback. Never bounce it outside.</text>
<line x1="18" y1="738" x2="576" y2="738" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="756" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="776" font-size="12" fill="#111318">This is the most physical run in the book. If it works you can run it fifteen</text>
<text x="18" y="794" font-size="12" fill="#111318">times, and at this age you often can.</text>
<text x="18" y="810" font-size="12" fill="#111318">Drill the SL's kick-out on its own. If he blocks the end with his shoulders</text>
<text x="18" y="828" font-size="12" fill="#111318">square, the end slides underneath and makes the tackle for a loss — he has to</text>
<text x="18" y="844" font-size="12" fill="#111318">attack the outside hip.</text>
<text x="18" y="862" font-size="12" fill="#111318">The fullback's man is whoever shows in the hole, not a man he picks before the</text>
<text x="18" y="878" font-size="12" fill="#111318">snap. Tell him that every time.</text>
<text x="18" y="896" font-size="12" fill="#111318">The tailback's most common mistake is bouncing it wide looking for green grass.</text>
<text x="18" y="912" font-size="12" fill="#111318">The yards are inside the SL's block. Make him run it tight in practice until it</text>
<text x="18" y="930" font-size="12" fill="#111318">is automatic.</text>
</svg>