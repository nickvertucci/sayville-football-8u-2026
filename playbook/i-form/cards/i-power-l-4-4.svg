<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Block down on the defensive end, inside</text>
<text x="52" y="596" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="612" font-size="12" fill="#111318">your face.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="646" font-size="12" fill="#111318">downfield and get the left inside linebacker.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="680" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="698" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="732" font-size="12" fill="#111318">downfield and get the right inside linebacker.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="766" font-size="12" fill="#111318">guard on you. Hands inside, pads under his,</text>
<text x="52" y="782" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="816" font-size="12" fill="#111318">downfield and get the right outside</text>
<text x="52" y="834" font-size="12" fill="#111318">linebacker.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end on your inside shoulder. Cut him</text>
<text x="385" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Block the left corner.</text>
<text x="351" y="630" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="630" font-size="12" fill="#111318">Open left, hand deep to the tailback, then</text>
<text x="385" y="646" font-size="12" fill="#111318">fake the boot. It holds the backside end.</text>
<text x="351" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="664" font-size="12" fill="#111318">Lead through the hole, then block the left</text>
<text x="385" y="680" font-size="12" fill="#111318">outside linebacker.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="698" font-size="12" fill="#111318">Take the handoff downhill at our tackle's</text>
<text x="385" y="714" font-size="12" fill="#111318">outside hip, following the fullback. Never</text>
<text x="385" y="732" font-size="12" fill="#111318">bounce it outside.</text>
<line x1="18" y1="840" x2="684" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">This is the most physical run in the book. If it works you can run it fifteen times, and at this age</text>
<text x="18" y="896" font-size="12" fill="#111318">you often can.</text>
<text x="18" y="912" font-size="12" fill="#111318">Drill the Y on the end man on his own. Against the 4-4 and the 6-3 the end is outside him and it is a</text>
<text x="18" y="930" font-size="12" fill="#111318">kick-out — attack the outside hip, because square shoulders let the end slide underneath for a loss.</text>
<text x="18" y="946" font-size="12" fill="#111318">Against the 5-3 the end is in the gap inside him and it is a down block — head across his face.</text>
<text x="18" y="964" font-size="12" fill="#111318">The fullback's man is whoever shows in the hole, not a man he picks before the snap. Tell him that</text>
<text x="18" y="980" font-size="12" fill="#111318">every time.</text>
<text x="18" y="998" font-size="12" fill="#111318">The tailback's most common mistake is bouncing it wide looking for green grass. The yards are inside</text>
<text x="18" y="1014" font-size="12" fill="#111318">the Z's block. Make him run it tight in practice until it is automatic.</text>
</svg>