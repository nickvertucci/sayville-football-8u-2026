<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Close down inside and push. Nobody</text>
<text x="52" y="596" font-size="12" fill="#111318">gets penetration through your gap.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Close down inside and push. Nobody</text>
<text x="52" y="630" font-size="12" fill="#111318">gets penetration through your gap.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="646" font-size="12" fill="#111318">Squeeze down on the center and drive.</text>
<text x="52" y="664" font-size="12" fill="#111318">Your shoulder does not leave his.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="680" font-size="12" fill="#111318">Snap it and come straight off the</text>
<text x="52" y="698" font-size="12" fill="#111318">ball into the nose with your pads</text>
<text x="52" y="714" font-size="12" fill="#111318">under his. Get movement — one yard is</text>
<text x="52" y="732" font-size="12" fill="#111318">all we need and it comes from you.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Squeeze down on the center and drive.</text>
<text x="52" y="766" font-size="12" fill="#111318">Your shoulder does not leave his —</text>
<text x="52" y="782" font-size="12" fill="#111318">the quarterback is coming right</text>
<text x="52" y="800" font-size="12" fill="#111318">behind it.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="816" font-size="12" fill="#111318">Close down inside and push. Nobody</text>
<text x="52" y="834" font-size="12" fill="#111318">gets penetration through your gap.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Close down inside and push. Nobody</text>
<text x="331" y="596" font-size="12" fill="#111318">gets penetration through your gap.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Release straight downfield and run</text>
<text x="331" y="630" font-size="12" fill="#111318">the corner off. You will not get the</text>
<text x="331" y="646" font-size="12" fill="#111318">ball — take his eyes with you so he</text>
<text x="331" y="664" font-size="12" fill="#111318">never looks in.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Snap it and go now, right behind the</text>
<text x="331" y="698" font-size="12" fill="#111318">outside hip of the guard on the</text>
<text x="331" y="714" font-size="12" fill="#111318">flanker side. Low pads, ball in both</text>
<text x="331" y="732" font-size="12" fill="#111318">arms, fall forward. Do not stand up</text>
<text x="331" y="748" font-size="12" fill="#111318">and do not look for a hole.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Fire straight ahead into the back of</text>
<text x="331" y="782" font-size="12" fill="#111318">the pile and push. Both hands on</text>
<text x="331" y="800" font-size="12" fill="#111318">whoever is in front of you.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="816" font-size="12" fill="#111318">Come downhill behind the fullback and</text>
<text x="331" y="834" font-size="12" fill="#111318">push the pile. If the ball comes</text>
<text x="331" y="850" font-size="12" fill="#111318">loose you are the closest man to it.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">This is a one-yard play. Do not call it needing two.</text>
<text x="18" y="912" font-size="12" fill="#111318">The snap count is the whole play. If they know it is coming they still cannot</text>
<text x="18" y="930" font-size="12" fill="#111318">stop it, but only if we go on the first sound and they do not.</text>
<text x="18" y="946" font-size="12" fill="#111318">Drawn against the 6-3 because that is the heaviest front the league allows and it</text>
<text x="18" y="964" font-size="12" fill="#111318">is exactly what you will see on fourth and one.</text>
<text x="18" y="980" font-size="12" fill="#111318">Teach the quarterback to fall forward the moment he feels contact.</text>
<text x="18" y="998" font-size="12" fill="#111318">Eight-year-olds try to spin and lose the yard they already had.</text>
<text x="18" y="1014" font-size="12" fill="#111318">It is legal for us in 11-man play. It is specifically prohibited in the 8-man</text>
<text x="18" y="1032" font-size="12" fill="#111318">Rookie division, so if we ever end up there this play comes straight out of the</text>
<text x="18" y="1048" font-size="12" fill="#111318">book.</text>
</svg>