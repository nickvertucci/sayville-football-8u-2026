<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Cut him</text>
<text x="52" y="596" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="52" y="612" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="52" y="630" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Cut him off from the play —</text>
<text x="52" y="680" font-size="12" fill="#111318">get your body between him and the</text>
<text x="52" y="698" font-size="12" fill="#111318">ball. You are the last one to it, so</text>
<text x="52" y="714" font-size="12" fill="#111318">never quit on it.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="52" y="748" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="52" y="766" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="782" font-size="12" fill="#111318">Reach the nose to your right. Get</text>
<text x="52" y="800" font-size="12" fill="#111318">your head across that shoulder so he</text>
<text x="52" y="816" font-size="12" fill="#111318">cannot run down the line after the</text>
<text x="52" y="834" font-size="12" fill="#111318">ball.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="850" font-size="12" fill="#111318">Double the nose with the man beside</text>
<text x="52" y="868" font-size="12" fill="#111318">you and drive him off the spot, then</text>
<text x="52" y="884" font-size="12" fill="#111318">come off onto the middle linebacker</text>
<text x="52" y="902" font-size="12" fill="#111318">when he shows.</text>
<text x="18" y="918" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="918" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="936" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="952" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="331" y="596" font-size="12" fill="#111318">out toward the sideline. The ball</text>
<text x="331" y="612" font-size="12" fill="#111318">goes inside you — he cannot be the</text>
<text x="331" y="630" font-size="12" fill="#111318">one who makes the tackle.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Run at the safety on your side and</text>
<text x="331" y="664" font-size="12" fill="#111318">screen him off. Get in his way and</text>
<text x="331" y="680" font-size="12" fill="#111318">stay there — do not go looking for a</text>
<text x="331" y="698" font-size="12" fill="#111318">knockdown.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Reverse pivot and hand the ball to</text>
<text x="331" y="732" font-size="12" fill="#111318">the tailback at four yards. Then</text>
<text x="331" y="748" font-size="12" fill="#111318">clear out and fake wide.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Lead through the hole and block the</text>
<text x="331" y="782" font-size="12" fill="#111318">first defender who shows in it. Get</text>
<text x="331" y="800" font-size="12" fill="#111318">your head across him — do not wait</text>
<text x="331" y="816" font-size="12" fill="#111318">for him to come to you. Move him any</text>
<text x="331" y="834" font-size="12" fill="#111318">direction — just move him.</text>
<text x="297" y="850" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="850" font-size="12" fill="#111318">Take the handoff at four yards, get</text>
<text x="331" y="868" font-size="12" fill="#111318">downhill behind the fullback, and cut</text>
<text x="331" y="884" font-size="12" fill="#111318">off his block. If he takes the</text>
<text x="331" y="902" font-size="12" fill="#111318">linebacker outside, you go inside.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Drill the fullback's block by itself with a bag. He does not have to win — he has</text>
<text x="18" y="1014" font-size="12" fill="#111318">to make the linebacker pick a side.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Teach the tailback one rule: cut off the fullback's back. Do not let him decide</text>
<text x="18" y="1048" font-size="12" fill="#111318">before he gets there.</text>
<text x="18" y="1066" font-size="12" fill="#111318">If their linebacker is faster than our fullback, stop calling this and run I</text>
<text x="18" y="1082" font-size="12" fill="#111318">Slant instead.</text>
<text x="18" y="1100" font-size="12" fill="#111318">The tailback should be running downhill at the hole, not sideways looking for</text>
<text x="18" y="1116" font-size="12" fill="#111318">one.</text>
</svg>