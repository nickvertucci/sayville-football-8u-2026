<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="52" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender</text>
<text x="52" y="646" font-size="12" fill="#111318">on or inside you — nobody crosses</text>
<text x="52" y="664" font-size="12" fill="#111318">your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">PULL RIGHT. Stay flat behind the line</text>
<text x="52" y="698" font-size="12" fill="#111318">and kick out the end on the other</text>
<text x="52" y="714" font-size="12" fill="#111318">side.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="748" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="766" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="800" font-size="12" fill="#111318">drive the nose for one count, then</text>
<text x="52" y="816" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="850" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="868" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Release inside off his outside</text>
<text x="331" y="596" font-size="12" fill="#111318">shoulder and take the playside</text>
<text x="331" y="612" font-size="12" fill="#111318">linebacker. The end over you is being</text>
<text x="331" y="630" font-size="12" fill="#111318">kicked out — leave him alone.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Take one hard step inside like the</text>
<text x="331" y="664" font-size="12" fill="#111318">toss is going away from you, then</text>
<text x="331" y="680" font-size="12" fill="#111318">come back and block the first</text>
<text x="331" y="698" font-size="12" fill="#111318">defender outside our end. He is the</text>
<text x="331" y="714" font-size="12" fill="#111318">only man who can beat this to the</text>
<text x="331" y="732" font-size="12" fill="#111318">corner.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="748" font-size="12" fill="#111318">Take the snap, fake the toss the</text>
<text x="331" y="766" font-size="12" fill="#111318">other way with both hands, then turn</text>
<text x="331" y="782" font-size="12" fill="#111318">back and hand to the tailback. The</text>
<text x="331" y="800" font-size="12" fill="#111318">fake comes first — the handoff is</text>
<text x="331" y="816" font-size="12" fill="#111318">late on purpose.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="834" font-size="12" fill="#111318">Run the toss path to the other side</text>
<text x="331" y="850" font-size="12" fill="#111318">at full speed and block anything that</text>
<text x="331" y="868" font-size="12" fill="#111318">shows. You are the lie.</text>
<text x="297" y="884" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="884" font-size="12" fill="#111318">Take two hard steps toward the toss,</text>
<text x="331" y="902" font-size="12" fill="#111318">then plant and come back behind the</text>
<text x="331" y="918" font-size="12" fill="#111318">pulling guard. Those two steps are</text>
<text x="331" y="936" font-size="12" fill="#111318">the entire play.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">Do not call this until I Toss Left has gone for real yards. Misdirection off a</text>
<text x="18" y="998" font-size="12" fill="#111318">play they do not fear is just a slower run.</text>
<text x="18" y="1014" font-size="12" fill="#111318">This one has the flanker on the playside, which Counter Left does not. That is a</text>
<text x="18" y="1032" font-size="12" fill="#111318">blocker Counter Left never had, so this is the better of the pair against a team</text>
<text x="18" y="1048" font-size="12" fill="#111318">that flows hard.</text>
<text x="18" y="1066" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="1082" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="1100" font-size="12" fill="#111318">Teach it the same day as Counter Left. The line rules are identical and the kids</text>
<text x="18" y="1116" font-size="12" fill="#111318">only have to learn which guard pulls.</text>
</svg>