</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="52" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="602" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="620" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="636" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="654" font-size="12" fill="#111318">Block the first defender to the backside.</text>
<text x="18" y="670" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="670" font-size="12" fill="#111318">Block the man over you and drive him to the</text>
<text x="52" y="688" font-size="12" fill="#111318">inside. You are the inside wall of the hole.</text>
<text x="18" y="704" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="704" font-size="12" fill="#111318">Block the man over you and drive him to the</text>
<text x="52" y="722" font-size="12" fill="#111318">outside. You are the outside wall of the hole.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block the man over you and turn him out.</text>
<text x="351" y="568" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="568" font-size="12" fill="#111318">Release and screen the deepest defender on</text>
<text x="385" y="586" font-size="12" fill="#111318">your side. Get in his way and stay there.</text>
<text x="351" y="602" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="602" font-size="12" fill="#111318">Reverse pivot and hand the ball to the</text>
<text x="385" y="620" font-size="12" fill="#111318">tailback at four yards. Then clear out and</text>
<text x="385" y="636" font-size="12" fill="#111318">fake wide.</text>
<text x="351" y="654" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="654" font-size="12" fill="#111318">Lead through the hole between the guard and</text>
<text x="385" y="670" font-size="12" fill="#111318">the tackle. Put your facemask on the</text>
<text x="385" y="688" font-size="12" fill="#111318">linebacker and move him any direction — just</text>
<text x="385" y="704" font-size="12" fill="#111318">move him.</text>
<text x="351" y="722" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="722" font-size="12" fill="#111318">Take the handoff at four yards, get downhill</text>
<text x="385" y="738" font-size="12" fill="#111318">behind the fullback, and cut off his block. If</text>
<text x="385" y="756" font-size="12" fill="#111318">he takes the linebacker outside, you go</text>
<text x="385" y="772" font-size="12" fill="#111318">inside.</text>
<line x1="18" y1="780" x2="684" y2="780" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="798" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="818" font-size="12" fill="#111318">Drill the fullback's block by itself with a bag. He does not have to win — he has to make the</text>
<text x="18" y="834" font-size="12" fill="#111318">linebacker pick a side.</text>
<text x="18" y="852" font-size="12" fill="#111318">Teach the tailback one rule: cut off the fullback's back. Do not let him decide before he gets</text>
<text x="18" y="868" font-size="12" fill="#111318">there.</text>
<text x="18" y="886" font-size="12" fill="#111318">If their linebacker is faster than our fullback, stop calling this and run I Power instead.</text>
<text x="18" y="902" font-size="12" fill="#111318">The tailback should be running downhill at the hole, not sideways looking for one.</text>
</svg>