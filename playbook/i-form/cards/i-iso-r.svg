<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never</text>
<text x="52" y="612" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Get your head across him</text>
<text x="52" y="664" font-size="12" fill="#111318">and wall him off so he cannot chase.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Step back inside</text>
<text x="52" y="698" font-size="12" fill="#111318">and cut off anyone chasing through</text>
<text x="52" y="714" font-size="12" fill="#111318">the middle.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="748" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="766" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">The tackle sits in the gap outside</text>
<text x="52" y="800" font-size="12" fill="#111318">you. You and our tackle double him —</text>
<text x="52" y="816" font-size="12" fill="#111318">hands inside, drive him backwards.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">Double the tackle on your inside</text>
<text x="52" y="850" font-size="12" fill="#111318">shoulder with the guard. Drive him</text>
<text x="52" y="868" font-size="12" fill="#111318">back, and if the middle linebacker</text>
<text x="52" y="884" font-size="12" fill="#111318">runs through, the guard comes off</text>
<text x="52" y="902" font-size="12" fill="#111318">onto him.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Drive him</text>
<text x="331" y="596" font-size="12" fill="#111318">out and widen the hole.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Release and screen the corner on your</text>
<text x="331" y="630" font-size="12" fill="#111318">side. Get in his way and stay there.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Reverse pivot and hand the ball to</text>
<text x="331" y="664" font-size="12" fill="#111318">the tailback at four yards. Then</text>
<text x="331" y="680" font-size="12" fill="#111318">clear out and fake wide.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="698" font-size="12" fill="#111318">Lead through the hole and put your</text>
<text x="331" y="714" font-size="12" fill="#111318">facemask on the linebacker sitting</text>
<text x="331" y="732" font-size="12" fill="#111318">over the double team. Move him any</text>
<text x="331" y="748" font-size="12" fill="#111318">direction — just move him.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="766" font-size="12" fill="#111318">Take the handoff at four yards, get</text>
<text x="331" y="782" font-size="12" fill="#111318">downhill behind the fullback, and cut</text>
<text x="331" y="800" font-size="12" fill="#111318">off his block. If he takes the</text>
<text x="331" y="816" font-size="12" fill="#111318">linebacker outside, you go inside.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">Drill the fullback's block by itself with a bag. He does not have to win — he has</text>
<text x="18" y="964" font-size="12" fill="#111318">to make the linebacker pick a side.</text>
<text x="18" y="980" font-size="12" fill="#111318">Teach the tailback one rule: cut off the fullback's back. Do not let him decide</text>
<text x="18" y="998" font-size="12" fill="#111318">before he gets there.</text>
<text x="18" y="1014" font-size="12" fill="#111318">If their linebacker is faster than our fullback, stop calling this and run I</text>
<text x="18" y="1032" font-size="12" fill="#111318">Slant instead.</text>
<text x="18" y="1048" font-size="12" fill="#111318">The tailback should be running downhill at the hole, not sideways looking for</text>
<text x="18" y="1066" font-size="12" fill="#111318">one.</text>
</svg>