<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="596" font-size="12" fill="#111318">you. The man outside you is being</text>
<text x="52" y="612" font-size="12" fill="#111318">kicked out.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="646" font-size="12" fill="#111318">you.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="680" font-size="12" fill="#111318">you.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Block the nose. Do not let him cross</text>
<text x="52" y="714" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line</text>
<text x="52" y="748" font-size="12" fill="#111318">and kick out the first defender outside</text>
<text x="52" y="766" font-size="12" fill="#111318">our end.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="800" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="816" font-size="12" fill="#111318">face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="596" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Take one hard step upfield like the</text>
<text x="344" y="630" font-size="12" fill="#111318">sweep is coming, then come back and cut</text>
<text x="344" y="646" font-size="12" fill="#111318">off the backside.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Take the snap, fake the sweep the other</text>
<text x="344" y="680" font-size="12" fill="#111318">way with both hands, then turn back and</text>
<text x="344" y="698" font-size="12" fill="#111318">hand to the tailback. The fake comes</text>
<text x="344" y="714" font-size="12" fill="#111318">first — the handoff is late on purpose.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="732" font-size="12" fill="#111318">Run the sweep path to the other side at</text>
<text x="344" y="748" font-size="12" fill="#111318">full speed and block anything that</text>
<text x="344" y="766" font-size="12" fill="#111318">shows. You are the lie.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="782" font-size="12" fill="#111318">Take two hard steps toward the sweep,</text>
<text x="344" y="800" font-size="12" fill="#111318">then plant and come back behind the</text>
<text x="344" y="816" font-size="12" fill="#111318">pulling guard. Those two steps are the</text>
<text x="344" y="834" font-size="12" fill="#111318">entire play.</text>
<line x1="18" y1="840" x2="603" y2="840" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="858" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="878" font-size="12" fill="#111318">Do not call this until I Sweep Right has gone for real yards. Misdirection off a play</text>
<text x="18" y="896" font-size="12" fill="#111318">they do not fear is just a slower run.</text>
<text x="18" y="912" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools</text>
<text x="18" y="930" font-size="12" fill="#111318">nobody.</text>
<text x="18" y="946" font-size="12" fill="#111318">The fullback selling the sweep matters more than his block. Tell him he is the decoy</text>
<text x="18" y="964" font-size="12" fill="#111318">and mean it.</text>
<text x="18" y="980" font-size="12" fill="#111318">If their backside linebacker stops chasing the sweep, go back to I Power Left.</text>
</svg>