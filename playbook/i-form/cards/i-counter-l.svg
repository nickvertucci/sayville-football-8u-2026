</g>
<line x1="18" y1="514" x2="684" y2="514" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="534" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="552" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="552" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="52" y="568" font-size="12" fill="#111318">The man outside you is being kicked out.</text>
<text x="18" y="586" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="586" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="602" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="602" font-size="12" fill="#111318">Block down on the first defender inside you.</text>
<text x="18" y="620" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="620" font-size="12" fill="#111318">Block the nose. Do not let him cross your face</text>
<text x="52" y="636" font-size="12" fill="#111318">to the playside.</text>
<text x="18" y="654" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="654" font-size="12" fill="#111318">PULL LEFT. Stay flat behind the line and kick</text>
<text x="52" y="670" font-size="12" fill="#111318">out the first defender outside our end.</text>
<text x="18" y="688" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="688" font-size="12" fill="#111318">Block back. Take the first defender on or</text>
<text x="52" y="704" font-size="12" fill="#111318">inside you. Nobody crosses your face.</text>
<text x="351" y="552" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="385" y="552" font-size="12" fill="#111318">Block back and cut off pursuit. You are the</text>
<text x="385" y="568" font-size="12" fill="#111318">last one to the ball.</text>
<text x="351" y="586" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="586" font-size="12" fill="#111318">Take one hard step upfield like the sweep is</text>
<text x="385" y="602" font-size="12" fill="#111318">coming, then come back and cut off the</text>
<text x="385" y="620" font-size="12" fill="#111318">backside.</text>
<text x="351" y="636" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="636" font-size="12" fill="#111318">Take the snap, fake the sweep the other way</text>
<text x="385" y="654" font-size="12" fill="#111318">with both hands, then turn back and hand to</text>
<text x="385" y="670" font-size="12" fill="#111318">the tailback. The fake comes first — the</text>
<text x="385" y="688" font-size="12" fill="#111318">handoff is late on purpose.</text>
<text x="351" y="704" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="704" font-size="12" fill="#111318">Run the sweep path to the other side at full</text>
<text x="385" y="722" font-size="12" fill="#111318">speed and block anything that shows. You are</text>
<text x="385" y="738" font-size="12" fill="#111318">the lie.</text>
<text x="351" y="756" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="756" font-size="12" fill="#111318">Take two hard steps toward the sweep, then</text>
<text x="385" y="772" font-size="12" fill="#111318">plant and come back behind the pulling guard.</text>
<text x="385" y="790" font-size="12" fill="#111318">Those two steps are the entire play.</text>
<line x1="18" y1="796" x2="684" y2="796" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="814" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="834" font-size="12" fill="#111318">Do not call this until I Sweep Right has gone for real yards. Misdirection off a play they do not</text>
<text x="18" y="852" font-size="12" fill="#111318">fear is just a slower run.</text>
<text x="18" y="868" font-size="12" fill="#111318">The tailback's counter steps must be full speed and full length. A shuffle fools nobody.</text>
<text x="18" y="886" font-size="12" fill="#111318">The fullback selling the sweep matters more than his block. Tell him he is the decoy and mean it.</text>
<text x="18" y="902" font-size="12" fill="#111318">If their backside linebacker stops chasing the sweep, go back to I Power Left.</text>
</svg>