<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="331" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on</text>
<text x="331" y="630" font-size="12" fill="#111318">the play.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Reverse pivot, hand it deep to the</text>
<text x="331" y="664" font-size="12" fill="#111318">tailback, then fake the bootleg away</text>
<text x="331" y="680" font-size="12" fill="#111318">from the play.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="698" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="714" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="732" font-size="12" fill="#111318">linebacker.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="748" font-size="12" fill="#111318">Take the handoff and press outside</text>
<text x="331" y="766" font-size="12" fill="#111318">our end. Turn up off the fullback's</text>
<text x="331" y="782" font-size="12" fill="#111318">block, never inside.</text>
<line x1="18" y1="806" x2="576" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Check their alignment first. If they have shaded toward our SL, this is the call.</text>
<text x="18" y="862" font-size="12" fill="#111318">The SL chases from the back side, and his man is the backside linebacker — not</text>
<text x="18" y="878" font-size="12" fill="#111318">the corner, who is on the far side of the field from him. Tell him he is not</text>
<text x="18" y="896" font-size="12" fill="#111318">decoration: he is the reason nothing catches this from behind.</text>
<text x="18" y="912" font-size="12" fill="#111318">Nobody is assigned to their playside corner. Against the 5-3 the fullback's lead</text>
<text x="18" y="930" font-size="12" fill="#111318">block finds him anyway; against a four-linebacker front the fullback has the</text>
<text x="18" y="946" font-size="12" fill="#111318">outside linebacker instead and the tailback beats the corner himself or gets</text>
<text x="18" y="964" font-size="12" fill="#111318">caught.</text>
<text x="18" y="980" font-size="12" fill="#111318">The line and the fullback are I Slant Right in a mirror. Only the SL is</text>
<text x="18" y="998" font-size="12" fill="#111318">different, because he lines up on the right either way. Teach the pair together.</text>
</svg>