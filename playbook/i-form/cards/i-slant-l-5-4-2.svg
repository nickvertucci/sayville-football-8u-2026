<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">The end is head up on you. Turn him</text>
<text x="52" y="596" font-size="12" fill="#111318">inside and wall him off. The ball</text>
<text x="52" y="612" font-size="12" fill="#111318">goes around behind you, so he cannot</text>
<text x="52" y="630" font-size="12" fill="#111318">follow it out.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="664" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="680" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Double the nose with the man beside</text>
<text x="52" y="714" font-size="12" fill="#111318">you and drive him off the spot, then</text>
<text x="52" y="732" font-size="12" fill="#111318">come off onto the middle linebacker</text>
<text x="52" y="748" font-size="12" fill="#111318">when he shows.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="766" font-size="12" fill="#111318">Reach the nose to your left. Get your</text>
<text x="52" y="782" font-size="12" fill="#111318">head across that shoulder so he</text>
<text x="52" y="800" font-size="12" fill="#111318">cannot run down the line after the</text>
<text x="52" y="816" font-size="12" fill="#111318">ball.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="834" font-size="12" fill="#111318">PULL LEFT. Stay flat, get outside our</text>
<text x="52" y="850" font-size="12" fill="#111318">end and turn up. Block the first</text>
<text x="52" y="868" font-size="12" fill="#111318">defender outside — in this front it</text>
<text x="52" y="884" font-size="12" fill="#111318">is the linebacker. You are the last</text>
<text x="52" y="902" font-size="12" fill="#111318">blocker the carrier has.</text>
<text x="18" y="918" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="918" font-size="12" fill="#111318">Block down on the tackle — he is on</text>
<text x="52" y="936" font-size="12" fill="#111318">your inside shoulder. Get your head</text>
<text x="52" y="952" font-size="12" fill="#111318">across him; nobody crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">The end is head up on you. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off from the play — get your body</text>
<text x="331" y="612" font-size="12" fill="#111318">between him and the ball. You are the</text>
<text x="331" y="630" font-size="12" fill="#111318">last one to it, so never quit on it.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="646" font-size="12" fill="#111318">Nobody is over you. Cut off the</text>
<text x="331" y="664" font-size="12" fill="#111318">backside — take the man chasing it</text>
<text x="331" y="680" font-size="12" fill="#111318">from behind. Never quit on the play.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="331" y="714" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="331" y="732" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="297" y="748" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="748" font-size="12" fill="#111318">Lead through the hole and block the</text>
<text x="331" y="766" font-size="12" fill="#111318">first defender who shows in it. Get</text>
<text x="331" y="782" font-size="12" fill="#111318">your head across him — do not wait</text>
<text x="331" y="800" font-size="12" fill="#111318">for him to come to you.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="816" font-size="12" fill="#111318">Take the handoff and press outside</text>
<text x="331" y="834" font-size="12" fill="#111318">our end. Turn up off the fullback's</text>
<text x="331" y="850" font-size="12" fill="#111318">block — this hits outside the tight</text>
<text x="331" y="868" font-size="12" fill="#111318">end, not inside him.</text>
<line x1="18" y1="960" x2="576" y2="960" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="978" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="998" font-size="12" fill="#111318">Check their alignment first. If they have shaded toward our Z, this is the call.</text>
<text x="18" y="1014" font-size="12" fill="#111318">The Z chases from behind. Tell him he is not decoration — he cuts off the corner</text>
<text x="18" y="1032" font-size="12" fill="#111318">who would otherwise run this down.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Everything else is I Slant Right in a mirror. Teach the pair together.</text>
</svg>