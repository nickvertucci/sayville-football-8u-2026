<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Turn him inside.</text>
<text x="52" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="630" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="646" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="680" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your left. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="748" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="344" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="612" font-size="12" fill="#111318">Cut off the backside. Never quit on the</text>
<text x="344" y="630" font-size="12" fill="#111318">play.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="646" font-size="12" fill="#111318">Reverse pivot, hand it deep to the</text>
<text x="344" y="664" font-size="12" fill="#111318">tailback, then boot away and sell it.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="680" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="344" y="698" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="344" y="714" font-size="12" fill="#111318">linebacker. Beat the tailback to the</text>
<text x="344" y="732" font-size="12" fill="#111318">corner.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the handoff at full speed to the</text>
<text x="344" y="766" font-size="12" fill="#111318">corner. Turn up when the fullback</text>
<text x="344" y="782" font-size="12" fill="#111318">blocks somebody.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Check their alignment first. If they have shifted toward our SL, this is the call.</text>
<text x="18" y="862" font-size="12" fill="#111318">The fullback has further to travel here than he does going right, so he has to leave</text>
<text x="18" y="878" font-size="12" fill="#111318">on the snap. If he trails the tailback the play has no lead blocker.</text>
<text x="18" y="896" font-size="12" fill="#111318">One rule for the tailback: turn up off the fullback's block. Running to the sideline</text>
<text x="18" y="912" font-size="12" fill="#111318">is how this play loses eight yards.</text>
<text x="18" y="930" font-size="12" fill="#111318">The SL chases from the back side, and his man is the backside linebacker, not the</text>
<text x="18" y="946" font-size="12" fill="#111318">corner — he is running infield, away from the sideline the ball is headed for. He is</text>
<text x="18" y="964" font-size="12" fill="#111318">the reason nothing catches this from behind.</text>
<text x="18" y="980" font-size="12" fill="#111318">Against the 4-4 the fullback leads on their outside linebacker and nobody touches the</text>
<text x="18" y="998" font-size="12" fill="#111318">corner, a yard off where the ball crosses — the tailback has to turn up inside and</text>
<text x="18" y="1014" font-size="12" fill="#111318">make that corner come to him. The 5-3 puts the fullback on the corner instead; the</text>
<text x="18" y="1032" font-size="12" fill="#111318">5-4-2 has no corner at all.</text>
</svg>