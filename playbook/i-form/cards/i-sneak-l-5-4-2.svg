<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="596" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="612" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="646" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="664" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="698" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="714" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="748" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="766" font-size="12" fill="#111318">never look for a man. One yard is all</text>
<text x="52" y="782" font-size="12" fill="#111318">we need, and it comes from you.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="816" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="834" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="868" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="884" font-size="12" fill="#111318">never look for a man.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="596" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="612" font-size="12" fill="#111318">never look for a man.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="630" font-size="12" fill="#111318">Release downfield and run the corner</text>
<text x="331" y="646" font-size="12" fill="#111318">off. You will not get the ball, just</text>
<text x="331" y="664" font-size="12" fill="#111318">his eyes.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Go on the snap behind the guard's</text>
<text x="331" y="698" font-size="12" fill="#111318">outside hip away from the SL. Low</text>
<text x="331" y="714" font-size="12" fill="#111318">pads, ball tight, fall forward.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="748" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="766" font-size="12" fill="#111318">never look for a man. Both hands on</text>
<text x="331" y="782" font-size="12" fill="#111318">the man in front of you, and push.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="800" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="816" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="834" font-size="12" fill="#111318">never look for a man. Push the pile.</text>
<text x="331" y="850" font-size="12" fill="#111318">If the ball comes loose, you are</text>
<text x="331" y="868" font-size="12" fill="#111318">closest to it.</text>
<line x1="18" y1="892" x2="576" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">This is a one-yard play. Do not call it needing two.</text>
<text x="18" y="946" font-size="12" fill="#111318">The snap count is the whole play. If they know it is coming they still cannot</text>
<text x="18" y="964" font-size="12" fill="#111318">stop it, but only if we go on the first sound and they do not.</text>
<text x="18" y="980" font-size="12" fill="#111318">Expect the heaviest front the league allows on fourth and one. Nobody blocks a</text>
<text x="18" y="998" font-size="12" fill="#111318">man on this play, so it does not change the call.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Teach the quarterback to fall forward the moment he feels contact.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Eight-year-olds try to spin and lose the yard they already had. And he does not</text>
<text x="18" y="1048" font-size="12" fill="#111318">get to pick a hole — there is no hole, there is a snap count and a yard.</text>
<text x="18" y="1066" font-size="12" fill="#111318">It is legal for us in 11-man play. It is specifically prohibited in the 8-man</text>
<text x="18" y="1082" font-size="12" fill="#111318">Rookie division, so if we ever end up there this play comes straight out of the</text>
<text x="18" y="1100" font-size="12" fill="#111318">book.</text>
</svg>