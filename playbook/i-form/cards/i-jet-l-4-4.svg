<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End on your inside shoulder. Turn him</text>
<text x="52" y="596" font-size="12" fill="#111318">inside. The ball goes around behind</text>
<text x="52" y="612" font-size="12" fill="#111318">you.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Step past him.</text>
<text x="52" y="698" font-size="12" fill="#111318">Climb to the playside linebacker.</text>
<text x="52" y="714" font-size="12" fill="#111318">Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="782" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="816" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="834" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End on your inside shoulder. Cut him</text>
<text x="331" y="596" font-size="12" fill="#111318">off — get between him and the ball.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Start moving on the coach's motion</text>
<text x="331" y="630" font-size="12" fill="#111318">call and be at full speed when you</text>
<text x="331" y="646" font-size="12" fill="#111318">pass the quarterback. Take the ball</text>
<text x="331" y="664" font-size="12" fill="#111318">and get around the corner — do not</text>
<text x="331" y="680" font-size="12" fill="#111318">turn upfield until you are outside</text>
<text x="331" y="698" font-size="12" fill="#111318">our end.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Turn and hand it back to the Z as he</text>
<text x="331" y="732" font-size="12" fill="#111318">crosses, then keep going the other</text>
<text x="331" y="748" font-size="12" fill="#111318">way with your hands on your belly</text>
<text x="331" y="766" font-size="12" fill="#111318">like you kept it.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Fill straight ahead like Wedge is</text>
<text x="331" y="800" font-size="12" fill="#111318">coming. You are the reason their</text>
<text x="331" y="816" font-size="12" fill="#111318">linebackers step up for one count.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="834" font-size="12" fill="#111318">Lead outside our end. Block the first</text>
<text x="331" y="850" font-size="12" fill="#111318">man out there — here it is the</text>
<text x="331" y="868" font-size="12" fill="#111318">linebacker.</text>
<line x1="18" y1="874" x2="576" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">Motion is legal in 11-man play, but only one man may be moving at the snap and he</text>
<text x="18" y="930" font-size="12" fill="#111318">cannot be moving toward the line of scrimmage. Teach the Z to run flat across,</text>
<text x="18" y="946" font-size="12" fill="#111318">never forward.</text>
<text x="18" y="964" font-size="12" fill="#111318">The handoff timing is the whole play. If the Z is slowing down to catch it the</text>
<text x="18" y="980" font-size="12" fill="#111318">play is dead — snap it when he is a stride from the quarterback and let him run</text>
<text x="18" y="998" font-size="12" fill="#111318">through it.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Call the motion the same way every single time so the snap count and his start</text>
<text x="18" y="1032" font-size="12" fill="#111318">never drift apart.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Do not install this until Power Right is real. Jet works because they have</text>
<text x="18" y="1066" font-size="12" fill="#111318">already been punished for not honouring the Z side.</text>
<text x="18" y="1082" font-size="12" fill="#111318">If their end chases the Z flat down the line, come back to Power Right the very</text>
<text x="18" y="1100" font-size="12" fill="#111318">next play — he has left the edge.</text>
</svg>