<rect x="624.4" y="35.0" width="69.6" height="52.0" rx="8" fill="#ffffff" stroke="#111318" stroke-width="3"/><text x="659.2" y="75.0" text-anchor="middle" font-size="40" font-weight="800" fill="#111318">#3</text>
</g></g>
<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion. At the</text>
<text x="52" y="596" font-size="12" fill="#111318">snap run flat behind the quarterback, take the</text>
<text x="52" y="612" font-size="12" fill="#111318">handoff at full speed and get to the right</text>
<text x="52" y="630" font-size="12" fill="#111318">edge. Turn up outside the fullback.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Defensive tackle on your inside shoulder. Cut</text>
<text x="52" y="664" font-size="12" fill="#111318">him off — get between him and the ball.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody on you. Cut off the backside. Never</text>
<text x="52" y="698" font-size="12" fill="#111318">quit on the play.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Reach the nose to your right. Head across his</text>
<text x="52" y="732" font-size="12" fill="#111318">playside shoulder.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="766" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the defensive tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody crosses</text>
<text x="52" y="816" font-size="12" fill="#111318">your face.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him inside.</text>
<text x="385" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">Run at the corner and screen him off. Stay in</text>
<text x="385" y="630" font-size="12" fill="#111318">his way.</text>
<text x="351" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="646" font-size="12" fill="#111318">Open right and hand the ball to the left tight</text>
<text x="385" y="664" font-size="12" fill="#111318">end as he comes across behind you, then fake a</text>
<text x="385" y="680" font-size="12" fill="#111318">run to the left.</text>
<text x="351" y="698" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="698" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="714" font-size="12" fill="#111318">the corner with the tailback.</text>
<text x="351" y="732" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="732" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="748" font-size="12" fill="#111318">the corner with the fullback.</text>
<line x1="18" y1="824" x2="684" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance, so the play is legal and nothing tips it</text>
<text x="18" y="878" font-size="12" fill="#111318">off.</text>
<text x="18" y="896" font-size="12" fill="#111318">The handoff is the whole play: the quarterback opens right and puts the ball in the end's belly at</text>
<text x="18" y="912" font-size="12" fill="#111318">full speed, then carries out his fake.</text>
<text x="18" y="930" font-size="12" fill="#111318">Both backs bubble out to the right ahead of the end and double team the outside linebacker together.</text>
<text x="18" y="946" font-size="12" fill="#111318">Two of them on him is what gets the end around the corner.</text>
</svg>