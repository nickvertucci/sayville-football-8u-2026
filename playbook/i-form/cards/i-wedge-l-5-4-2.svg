<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="596" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="612" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="646" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="664" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="698" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="714" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="748" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="766" font-size="12" fill="#111318">never look for a man. You are the tip</text>
<text x="52" y="782" font-size="12" fill="#111318">of the wedge — everybody comes to</text>
<text x="52" y="800" font-size="12" fill="#111318">you.</text>
<text x="18" y="816" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="816" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="834" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="850" font-size="12" fill="#111318">never look for a man.</text>
<text x="18" y="868" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="868" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="52" y="884" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="52" y="902" font-size="12" fill="#111318">never look for a man.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="596" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="612" font-size="12" fill="#111318">never look for a man.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="646" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="664" font-size="12" fill="#111318">never look for a man. Tuck in behind</text>
<text x="331" y="680" font-size="12" fill="#111318">the end. Nobody gets into the back of</text>
<text x="331" y="698" font-size="12" fill="#111318">the wedge.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Snap, hand it to the tailback left</text>
<text x="331" y="732" font-size="12" fill="#111318">now, and stay out of his way. Do not</text>
<text x="331" y="748" font-size="12" fill="#111318">ride the handoff — he is already</text>
<text x="331" y="766" font-size="12" fill="#111318">moving.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="782" font-size="12" fill="#111318">Shoulder to shoulder with the man</text>
<text x="331" y="800" font-size="12" fill="#111318">beside you, and push. Low pads —</text>
<text x="331" y="816" font-size="12" fill="#111318">never look for a man. Both hands on</text>
<text x="331" y="834" font-size="12" fill="#111318">the tailback's back and drive. You</text>
<text x="331" y="850" font-size="12" fill="#111318">are pushing, not blocking.</text>
<text x="297" y="868" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="868" font-size="12" fill="#111318">Put a hand on the center's back, get</text>
<text x="331" y="884" font-size="12" fill="#111318">your pads low, and follow the wedge.</text>
<text x="331" y="902" font-size="12" fill="#111318">Do not cut, do not bounce, do not</text>
<text x="331" y="918" font-size="12" fill="#111318">look for a hole — the hole moves with</text>
<text x="331" y="936" font-size="12" fill="#111318">you.</text>
<line x1="18" y1="942" x2="576" y2="942" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="960" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="980" font-size="12" fill="#111318">Two yards is a good wedge. Do not call it needing four.</text>
<text x="18" y="998" font-size="12" fill="#111318">Expect the heaviest front the league allows inside the five. It does not change</text>
<text x="18" y="1014" font-size="12" fill="#111318">the call — nobody is picking a man anyway.</text>
<text x="18" y="1032" font-size="12" fill="#111318">Nothing in the league rulebook prohibits wedge blocking for 11-man play, but it</text>
<text x="18" y="1048" font-size="12" fill="#111318">is the first thing leagues take away. Re-check it every season before you install</text>
<text x="18" y="1066" font-size="12" fill="#111318">it.</text>
<text x="18" y="1082" font-size="12" fill="#111318">Coach the shoulders, not the feet. If there is daylight between two linemen the</text>
<text x="18" y="1100" font-size="12" fill="#111318">wedge is a line of five men getting pushed backwards instead of one thing moving</text>
<text x="18" y="1116" font-size="12" fill="#111318">forward.</text>
<text x="18" y="1134" font-size="12" fill="#111318">Low pads win this and nothing else does. The team that stands up loses.</text>
</svg>