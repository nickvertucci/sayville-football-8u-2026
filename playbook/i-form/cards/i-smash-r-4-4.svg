<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Block the left outside linebacker.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="612" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="630" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="646" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="664" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right outside linebacker.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">Block the right corner.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="612" font-size="12" fill="#111318">Open right, hand to the tailback, then</text>
<text x="344" y="630" font-size="12" fill="#111318">fake the boot left. It holds the</text>
<text x="344" y="646" font-size="12" fill="#111318">backside end.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="664" font-size="12" fill="#111318">Lead through the hole, then block the</text>
<text x="344" y="680" font-size="12" fill="#111318">right inside linebacker.</text>
<text x="310" y="698" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="698" font-size="12" fill="#111318">Take the handoff downhill between the</text>
<text x="344" y="714" font-size="12" fill="#111318">center and the right guard, following</text>
<text x="344" y="732" font-size="12" fill="#111318">the fullback. Do not bounce it.</text>
<line x1="18" y1="738" x2="603" y2="738" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="756" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="776" font-size="12" fill="#111318">This is the iso: the fullback smashes the linebacker in the hole, the tailback runs</text>
<text x="18" y="794" font-size="12" fill="#111318">right off his hip.</text>
<text x="18" y="810" font-size="12" fill="#111318">The hole is the A-gap — between the center and the right guard. If the tailback</text>
<text x="18" y="828" font-size="12" fill="#111318">bounces, the play is dead.</text>
<text x="18" y="844" font-size="12" fill="#111318">The fullback's man is whoever shows in that gap, not a man he picks before the snap.</text>
</svg>