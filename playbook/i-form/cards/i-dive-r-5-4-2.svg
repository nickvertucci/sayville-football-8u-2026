<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">End head up on you. Cut him off — get</text>
<text x="52" y="596" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">Tackle on your inside shoulder. Cut</text>
<text x="52" y="630" font-size="12" fill="#111318">him off — get between him and the</text>
<text x="52" y="646" font-size="12" fill="#111318">ball.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="680" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Reach the nose to your right. Head</text>
<text x="52" y="714" font-size="12" fill="#111318">across his playside shoulder.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="748" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">End head up on you. Drive him to the</text>
<text x="331" y="596" font-size="12" fill="#111318">sideline. The ball goes inside you.</text>
<text x="297" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="612" font-size="12" fill="#111318">Run at the outside linebacker and</text>
<text x="331" y="630" font-size="12" fill="#111318">screen him off. Stay in his way.</text>
<text x="297" y="646" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="646" font-size="12" fill="#111318">Take the snap, open a quarter turn</text>
<text x="331" y="664" font-size="12" fill="#111318">and hand to the fullback at two</text>
<text x="331" y="680" font-size="12" fill="#111318">yards. Then carry out a fake to the</text>
<text x="331" y="698" font-size="12" fill="#111318">outside.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="714" font-size="12" fill="#111318">Aim at the outside hip of the center,</text>
<text x="331" y="732" font-size="12" fill="#111318">right off the double team. Take the</text>
<text x="331" y="748" font-size="12" fill="#111318">ball and get north — no reading, no</text>
<text x="331" y="766" font-size="12" fill="#111318">dancing.</text>
<text x="297" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="782" font-size="12" fill="#111318">Run the toss path outside and sell</text>
<text x="331" y="800" font-size="12" fill="#111318">it. You will not get the ball on this</text>
<text x="331" y="816" font-size="12" fill="#111318">play.</text>
<line x1="18" y1="824" x2="576" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">Snap to handoff should be under a second. If the fullback is waiting on the ball,</text>
<text x="18" y="878" font-size="12" fill="#111318">the play is already dead.</text>
<text x="18" y="896" font-size="12" fill="#111318">Best call when their linebackers start cheating wide to stop the toss.</text>
<text x="18" y="912" font-size="12" fill="#111318">The fullback runs at a spot, not at a defender. Give him the outside hip of the</text>
<text x="18" y="930" font-size="12" fill="#111318">center and let him go.</text>
<text x="18" y="946" font-size="12" fill="#111318">Best short-yardage call in the book. Nobody has to read anything and the ball is</text>
<text x="18" y="964" font-size="12" fill="#111318">over the line before the defense moves.</text>
</svg>