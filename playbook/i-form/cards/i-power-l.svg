<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="542" font-size="12" fill="#111318">you. The man outside you belongs to the</text>
<text x="52" y="558" font-size="12" fill="#111318">fullback.</text>
<text x="18" y="576" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="576" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="592" font-size="12" fill="#111318">you.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="626" font-size="12" fill="#111318">you.</text>
<text x="18" y="644" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="644" font-size="12" fill="#111318">Block back on the backside gap.</text>
<text x="18" y="660" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="660" font-size="12" fill="#111318">PULL LEFT. Run flat behind the line and</text>
<text x="52" y="678" font-size="12" fill="#111318">turn up outside our end. Block the</text>
<text x="52" y="694" font-size="12" fill="#111318">first wrong-colored jersey you see.</text>
<text x="18" y="712" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="712" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="728" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="746" font-size="12" fill="#111318">face.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="344" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="310" y="558" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="558" font-size="12" fill="#111318">Come across behind the line and cut off</text>
<text x="344" y="576" font-size="12" fill="#111318">anybody chasing from the backside.</text>
<text x="310" y="592" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="592" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="344" y="610" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="344" y="626" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="310" y="644" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="644" font-size="12" fill="#111318">Kick out the first defender outside our</text>
<text x="344" y="660" font-size="12" fill="#111318">end. Aim at his inside hip and run</text>
<text x="344" y="678" font-size="12" fill="#111318">through him.</text>
<text x="310" y="694" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="694" font-size="12" fill="#111318">Take the handoff, press the outside hip</text>
<text x="344" y="712" font-size="12" fill="#111318">of our end, then turn up inside the</text>
<text x="344" y="728" font-size="12" fill="#111318">pulling guard.</text>
<line x1="18" y1="752" x2="603" y2="752" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="770" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="790" font-size="12" fill="#111318">Check their alignment first. If they have shaded toward our flanker, this is the</text>
<text x="18" y="808" font-size="12" fill="#111318">call.</text>
<text x="18" y="824" font-size="12" fill="#111318">The flanker chases from behind. Tell him he is not decoration — he cuts off the</text>
<text x="18" y="842" font-size="12" fill="#111318">corner who would otherwise run this down.</text>
<text x="18" y="858" font-size="12" fill="#111318">Everything else is I Power Right in a mirror. Teach the pair together.</text>
</svg>