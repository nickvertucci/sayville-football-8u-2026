<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left tackle, then block</text>
<text x="52" y="612" font-size="12" fill="#111318">the left inside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the right tackle, then block</text>
<text x="52" y="664" font-size="12" fill="#111318">the right inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right tackle.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Block the right end.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Stay down in your stance — no motion.</text>
<text x="331" y="596" font-size="12" fill="#111318">At the snap run flat behind the</text>
<text x="331" y="612" font-size="12" fill="#111318">quarterback, take the handoff at full</text>
<text x="331" y="630" font-size="12" fill="#111318">speed and get to the left edge. Turn</text>
<text x="331" y="646" font-size="12" fill="#111318">up outside the fullback.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="664" font-size="12" fill="#111318">Run at the corner and screen him off.</text>
<text x="331" y="680" font-size="12" fill="#111318">Stay in his way.</text>
<text x="297" y="698" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="698" font-size="12" fill="#111318">Open left and hand the ball to the</text>
<text x="331" y="714" font-size="12" fill="#111318">right tight end as he comes across</text>
<text x="331" y="732" font-size="12" fill="#111318">behind you, then fake a run to the</text>
<text x="331" y="748" font-size="12" fill="#111318">right.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Bubble out around the left end, then</text>
<text x="331" y="782" font-size="12" fill="#111318">double team the left outside</text>
<text x="331" y="800" font-size="12" fill="#111318">linebacker with the tailback.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="816" font-size="12" fill="#111318">Bubble out around the left end, then</text>
<text x="331" y="834" font-size="12" fill="#111318">double team the left outside</text>
<text x="331" y="850" font-size="12" fill="#111318">linebacker with the fullback.</text>
<line x1="18" y1="858" x2="576" y2="858" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="876" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="896" font-size="12" fill="#111318">No motion before the snap. The end stays down in his stance, so the play is legal</text>
<text x="18" y="912" font-size="12" fill="#111318">and nothing tips it off.</text>
<text x="18" y="930" font-size="12" fill="#111318">The handoff is the whole play: the quarterback opens left and puts the ball in</text>
<text x="18" y="946" font-size="12" fill="#111318">the end's belly at full speed, then carries out his fake.</text>
<text x="18" y="964" font-size="12" fill="#111318">Both backs bubble out to the left ahead of the end and double team the outside</text>
<text x="18" y="980" font-size="12" fill="#111318">linebacker together. Two of them on him is what gets the end around the corner.</text>
</svg>