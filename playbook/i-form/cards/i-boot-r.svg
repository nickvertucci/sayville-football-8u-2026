<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block down and sell the run. This has</text>
<text x="52" y="542" font-size="12" fill="#111318">to look exactly like the sweep going</text>
<text x="52" y="558" font-size="12" fill="#111318">the other way.</text>
<text x="18" y="576" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="576" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="592" font-size="12" fill="#111318">you.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">Block the man over you and drive him</text>
<text x="52" y="626" font-size="12" fill="#111318">away from the boot.</text>
<text x="18" y="644" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="644" font-size="12" fill="#111318">Block back toward the boot side. Nobody</text>
<text x="52" y="660" font-size="12" fill="#111318">chases through the middle.</text>
<text x="18" y="678" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="678" font-size="12" fill="#111318">PULL LEFT and run the sweep path to</text>
<text x="52" y="694" font-size="12" fill="#111318">sell the fake. You are a decoy — take</text>
<text x="52" y="712" font-size="12" fill="#111318">their linebacker with you.</text>
<text x="18" y="728" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="728" font-size="12" fill="#111318">Hinge and protect the boot side. Nobody</text>
<text x="52" y="746" font-size="12" fill="#111318">comes free outside you — the</text>
<text x="52" y="762" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Engage their end for a count, then</text>
<text x="344" y="542" font-size="12" fill="#111318">release and settle at eight yards on</text>
<text x="344" y="558" font-size="12" fill="#111318">the boot side.</text>
<text x="310" y="576" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="576" font-size="12" fill="#111318">Run to the flat at four yards and stay</text>
<text x="344" y="592" font-size="12" fill="#111318">in front of the quarterback. You are</text>
<text x="344" y="610" font-size="12" fill="#111318">the easy throw.</text>
<text x="310" y="626" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="626" font-size="12" fill="#111318">Fake the sweep with both hands, hide</text>
<text x="344" y="644" font-size="12" fill="#111318">the ball on your back hip, and get to</text>
<text x="344" y="660" font-size="12" fill="#111318">the edge. Run it if it is open. Only</text>
<text x="344" y="678" font-size="12" fill="#111318">throw if a defender comes up to take</text>
<text x="344" y="694" font-size="12" fill="#111318">you.</text>
<text x="310" y="712" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="712" font-size="12" fill="#111318">Run the sweep path away from the boot</text>
<text x="344" y="728" font-size="12" fill="#111318">and block whatever shows. Sell it.</text>
<text x="310" y="746" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="746" font-size="12" fill="#111318">Run the full sweep path away from the</text>
<text x="344" y="762" font-size="12" fill="#111318">boot with your arms tucked like you</text>
<text x="344" y="780" font-size="12" fill="#111318">have the ball. Sell it all the way to</text>
<text x="344" y="796" font-size="12" fill="#111318">the sideline.</text>
<line x1="18" y1="804" x2="603" y2="804" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="822" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="842" font-size="12" fill="#111318">Our ends must engage their end before releasing — sell the run first, then get out.</text>
<text x="18" y="858" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="876" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="892" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="910" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="926" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>