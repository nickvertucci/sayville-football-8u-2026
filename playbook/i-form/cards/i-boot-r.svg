<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block down inside and sell the run.</text>
<text x="52" y="596" font-size="12" fill="#111318">This has to look exactly like the</text>
<text x="52" y="612" font-size="12" fill="#111318">toss going the other way.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">The tackle is on your inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Block him down and seal him</text>
<text x="52" y="664" font-size="12" fill="#111318">inside — that is what opens the hole.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="698" font-size="12" fill="#111318">on the nose and drive him away from</text>
<text x="52" y="714" font-size="12" fill="#111318">the boot.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Block the nose back toward the boot</text>
<text x="52" y="748" font-size="12" fill="#111318">side. Nobody chases through the</text>
<text x="52" y="766" font-size="12" fill="#111318">middle.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="782" font-size="12" fill="#111318">PULL LEFT and run the toss path to</text>
<text x="52" y="800" font-size="12" fill="#111318">sell the fake. You are a decoy — take</text>
<text x="52" y="816" font-size="12" fill="#111318">a linebacker with you.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="834" font-size="12" fill="#111318">Hinge and protect the boot side.</text>
<text x="52" y="850" font-size="12" fill="#111318">Nobody comes free outside you — the</text>
<text x="52" y="868" font-size="12" fill="#111318">quarterback is alone back there.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release and settle at eight</text>
<text x="331" y="612" font-size="12" fill="#111318">yards on the boot side.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="630" font-size="12" fill="#111318">Run to the flat at four yards and</text>
<text x="331" y="646" font-size="12" fill="#111318">stay in front of the quarterback. You</text>
<text x="331" y="664" font-size="12" fill="#111318">are the easy throw.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Fake the toss with both hands, hide</text>
<text x="331" y="698" font-size="12" fill="#111318">the ball on your back hip, and get to</text>
<text x="331" y="714" font-size="12" fill="#111318">the edge. Run it if it is open. Only</text>
<text x="331" y="732" font-size="12" fill="#111318">throw if a defender comes up to take</text>
<text x="331" y="748" font-size="12" fill="#111318">you.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="766" font-size="12" fill="#111318">Run the toss path away from the boot</text>
<text x="331" y="782" font-size="12" fill="#111318">and block whatever shows. Sell it.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run the full toss path away from the</text>
<text x="331" y="816" font-size="12" fill="#111318">boot with your arms tucked like you</text>
<text x="331" y="834" font-size="12" fill="#111318">have the ball. Sell it all the way to</text>
<text x="331" y="850" font-size="12" fill="#111318">the sideline.</text>
<line x1="18" y1="874" x2="576" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">Our ends must engage their end before releasing — sell the run first, then get</text>
<text x="18" y="930" font-size="12" fill="#111318">out.</text>
<text x="18" y="946" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="964" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="980" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="998" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1014" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>