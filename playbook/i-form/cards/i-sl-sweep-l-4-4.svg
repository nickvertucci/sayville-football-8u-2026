<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left end, then block the</text>
<text x="52" y="612" font-size="12" fill="#111318">left outside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left tackle.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the left tackle, then block the</text>
<text x="52" y="664" font-size="12" fill="#111318">left inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right tackle.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right tackle, then block</text>
<text x="52" y="714" font-size="12" fill="#111318">the right inside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right end.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">At the snap run flat across the</text>
<text x="344" y="612" font-size="12" fill="#111318">backfield, take the handoff at full</text>
<text x="344" y="630" font-size="12" fill="#111318">speed and get to the left edge. Turn up</text>
<text x="344" y="646" font-size="12" fill="#111318">in the alley behind the fullback.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Hand the ball to the slot as he runs</text>
<text x="344" y="680" font-size="12" fill="#111318">past you, then fake the handoff to the</text>
<text x="344" y="698" font-size="12" fill="#111318">tailback going right.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Bubble out around the left end, then</text>
<text x="344" y="732" font-size="12" fill="#111318">block the left corner.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Take the fake handoff and run hard to</text>
<text x="344" y="766" font-size="12" fill="#111318">the right. You are what holds the</text>
<text x="344" y="782" font-size="12" fill="#111318">backside.</text>
<line x1="18" y1="790" x2="603" y2="790" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="808" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="828" font-size="12" fill="#111318">The slot runs flat and fast across the backfield. The handoff is at full speed, so</text>
<text x="18" y="844" font-size="12" fill="#111318">the quarterback just puts it in his belly.</text>
<text x="18" y="862" font-size="12" fill="#111318">After the handoff the quarterback carries out his fake to the tailback going right.</text>
<text x="18" y="878" font-size="12" fill="#111318">It is what holds the backside.</text>
<text x="18" y="896" font-size="12" fill="#111318">The fullback bubbles out ahead of the slot and takes the corner. The slot stays</text>
<text x="18" y="912" font-size="12" fill="#111318">behind him and turns up in the alley.</text>
</svg>