<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Block the left defensive end.</text>
<text x="18" y="596" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="596" font-size="12" fill="#111318">Help on the left defensive guard, then</text>
<text x="52" y="612" font-size="12" fill="#111318">block the left inside linebacker.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="630" font-size="12" fill="#111318">Block the left defensive guard.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="646" font-size="12" fill="#111318">Help on the right defensive guard, then</text>
<text x="52" y="664" font-size="12" fill="#111318">block the right inside linebacker.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="680" font-size="12" fill="#111318">Block the right defensive guard.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="698" font-size="12" fill="#111318">Help on the right defensive end, then</text>
<text x="52" y="714" font-size="12" fill="#111318">block the right outside linebacker.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Block the right defensive end.</text>
<text x="310" y="596" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="344" y="596" font-size="12" fill="#111318">At the snap run flat across the</text>
<text x="344" y="612" font-size="12" fill="#111318">backfield, take the handoff at full</text>
<text x="344" y="630" font-size="12" fill="#111318">speed and get to the right edge. Turn</text>
<text x="344" y="646" font-size="12" fill="#111318">up in the alley behind the fullback.</text>
<text x="310" y="664" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="664" font-size="12" fill="#111318">Hand the ball to the slot as he runs</text>
<text x="344" y="680" font-size="12" fill="#111318">past you, then fake the handoff to the</text>
<text x="344" y="698" font-size="12" fill="#111318">tailback going left.</text>
<text x="310" y="714" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="714" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="732" font-size="12" fill="#111318">team the corner with the tailback.</text>
<text x="310" y="748" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="748" font-size="12" fill="#111318">Bubble out around our end, then double</text>
<text x="344" y="766" font-size="12" fill="#111318">team the linebacker with the fullback.</text>
<line x1="18" y1="772" x2="603" y2="772" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="790" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="810" font-size="12" fill="#111318">The slot runs flat and fast across the backfield. The handoff is at full speed, so</text>
<text x="18" y="828" font-size="12" fill="#111318">the quarterback just puts it in his belly.</text>
<text x="18" y="844" font-size="12" fill="#111318">After the handoff the quarterback carries out his fake to the tailback going left. It</text>
<text x="18" y="862" font-size="12" fill="#111318">is what holds the backside.</text>
<text x="18" y="878" font-size="12" fill="#111318">The fullback bubbles out ahead of the slot and takes the corner. The slot stays</text>
<text x="18" y="896" font-size="12" fill="#111318">behind him and turns up in the alley.</text>
</svg>