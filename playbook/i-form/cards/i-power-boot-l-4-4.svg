<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release to the flat at four</text>
<text x="52" y="612" font-size="12" fill="#111318">yards and stay in front of the</text>
<text x="52" y="630" font-size="12" fill="#111318">quarterback. You are the easy throw.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Tackle head up on you. Hands inside,</text>
<text x="52" y="698" font-size="12" fill="#111318">pads under his, drive him back.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nobody on you. Cut off the backside.</text>
<text x="52" y="732" font-size="12" fill="#111318">Never quit on the play.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Tackle head up on you. Cut him off —</text>
<text x="52" y="766" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="800" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="816" font-size="12" fill="#111318">crosses your face.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="331" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="331" y="612" font-size="12" fill="#111318">to eight yards on the boot side. You</text>
<text x="331" y="630" font-size="12" fill="#111318">are the second look and you arrive</text>
<text x="331" y="646" font-size="12" fill="#111318">late on purpose.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="664" font-size="12" fill="#111318">Show the power block a step, then</text>
<text x="331" y="680" font-size="12" fill="#111318">hinge back. Nobody chases from your</text>
<text x="331" y="698" font-size="12" fill="#111318">side.</text>
<text x="297" y="714" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="714" font-size="12" fill="#111318">Fake the handoff to the tailback</text>
<text x="331" y="732" font-size="12" fill="#111318">going right, hide the ball on your</text>
<text x="331" y="748" font-size="12" fill="#111318">back hip, and get to the left edge.</text>
<text x="331" y="766" font-size="12" fill="#111318">Run it if it is open. Only throw if a</text>
<text x="331" y="782" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="297" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="800" font-size="12" fill="#111318">Run your Power lead path right, then</text>
<text x="331" y="816" font-size="12" fill="#111318">look back for anyone chasing him.</text>
<text x="297" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="834" font-size="12" fill="#111318">Run the Power path to the right with</text>
<text x="331" y="850" font-size="12" fill="#111318">your arms tucked like you have the</text>
<text x="331" y="868" font-size="12" fill="#111318">ball. Sell it all the way — you are</text>
<text x="331" y="884" font-size="12" fill="#111318">the reason nobody stays home on the</text>
<text x="331" y="902" font-size="12" fill="#111318">boot.</text>
<line x1="18" y1="908" x2="576" y2="908" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="926" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="946" font-size="12" fill="#111318">Do not call this until Power Right has hurt them. The whole play is a lie about</text>
<text x="18" y="964" font-size="12" fill="#111318">Power, so Power has to be worth lying about.</text>
<text x="18" y="980" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="998" font-size="12" fill="#111318">the fake dies and the flat defender is waiting.</text>
<text x="18" y="1014" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="1032" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="1048" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="1066" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="1082" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>