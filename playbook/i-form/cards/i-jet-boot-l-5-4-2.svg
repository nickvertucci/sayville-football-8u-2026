<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Bump the end, then release to the flat</text>
<text x="52" y="596" font-size="12" fill="#111318">at four yards in front of the</text>
<text x="52" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="646" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="680" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="714" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="732" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="748" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="766" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="782" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="800" font-size="12" fill="#111318">crosses your face.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Bump the end, then cross to eight yards</text>
<text x="344" y="596" font-size="12" fill="#111318">on the boot side. Late on purpose.</text>
<text x="310" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="612" font-size="12" fill="#111318">Run the Jet motion for real: full</text>
<text x="344" y="630" font-size="12" fill="#111318">speed, flat across, keep going after</text>
<text x="344" y="646" font-size="12" fill="#111318">the fake. Take the edge defender with</text>
<text x="344" y="664" font-size="12" fill="#111318">you.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Fake the jet, hide it on your back hip,</text>
<text x="344" y="698" font-size="12" fill="#111318">boot left behind the motion. Throw only</text>
<text x="344" y="714" font-size="12" fill="#111318">when they take you.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="732" font-size="12" fill="#111318">Fill like Wedge is coming, then take</text>
<text x="344" y="748" font-size="12" fill="#111318">anyone chasing from inside.</text>
<text x="310" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="766" font-size="12" fill="#111318">Run the Power path left, then protect</text>
<text x="344" y="782" font-size="12" fill="#111318">the outside. Anyone chasing him is</text>
<text x="344" y="800" font-size="12" fill="#111318">yours.</text>
<line x1="18" y1="806" x2="603" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">This is the counter to Jet Boot Right — call it once they have started chasing the</text>
<text x="18" y="862" font-size="12" fill="#111318">keeper away from the motion. If nobody has, run the Right one until they do.</text>
<text x="18" y="878" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes the</text>
<text x="18" y="896" font-size="12" fill="#111318">fake dies and the flat defender is already waiting.</text>
<text x="18" y="912" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="930" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="946" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="964" font-size="12" fill="#111318">finds him.</text>
<text x="18" y="980" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>