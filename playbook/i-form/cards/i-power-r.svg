<line x1="18" y1="486" x2="603" y2="486" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="506" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="524" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="524" font-size="12" fill="#111318">Block back and cut off pursuit. You are</text>
<text x="52" y="542" font-size="12" fill="#111318">the last one to the ball.</text>
<text x="18" y="558" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="558" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="576" font-size="12" fill="#111318">or inside you. Nobody crosses your</text>
<text x="52" y="592" font-size="12" fill="#111318">face.</text>
<text x="18" y="610" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="610" font-size="12" fill="#111318">PULL RIGHT. Run flat behind the line</text>
<text x="52" y="626" font-size="12" fill="#111318">and turn up outside our end. Block the</text>
<text x="52" y="644" font-size="12" fill="#111318">first wrong-colored jersey you see.</text>
<text x="18" y="660" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="660" font-size="12" fill="#111318">Block back on the backside gap.</text>
<text x="18" y="678" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="678" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="694" font-size="12" fill="#111318">you.</text>
<text x="18" y="712" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="712" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="52" y="728" font-size="12" fill="#111318">you.</text>
<text x="310" y="524" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="524" font-size="12" fill="#111318">Block down on the first defender inside</text>
<text x="344" y="542" font-size="12" fill="#111318">you. The man outside you belongs to the</text>
<text x="344" y="558" font-size="12" fill="#111318">fullback.</text>
<text x="310" y="576" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="576" font-size="12" fill="#111318">Release and screen the deepest defender</text>
<text x="344" y="592" font-size="12" fill="#111318">on your side. Get in his way and stay</text>
<text x="344" y="610" font-size="12" fill="#111318">there.</text>
<text x="310" y="626" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="626" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="344" y="644" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="344" y="660" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="310" y="678" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="678" font-size="12" fill="#111318">Kick out the first defender outside our</text>
<text x="344" y="694" font-size="12" fill="#111318">end. Aim at his inside hip and run</text>
<text x="344" y="712" font-size="12" fill="#111318">through him.</text>
<text x="310" y="728" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="728" font-size="12" fill="#111318">Take the handoff, press the outside hip</text>
<text x="344" y="746" font-size="12" fill="#111318">of our end, then turn up inside the</text>
<text x="344" y="762" font-size="12" fill="#111318">pulling guard. Be patient for one step,</text>
<text x="344" y="780" font-size="12" fill="#111318">then go.</text>
<line x1="18" y1="786" x2="603" y2="786" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="804" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="824" font-size="12" fill="#111318">Same down-block-and-kick-out rules as Bone Power. If the kids know one they know both</text>
<text x="18" y="842" font-size="12" fill="#111318">— say that out loud when you install it.</text>
<text x="18" y="858" font-size="12" fill="#111318">The tailback starts deeper than the wishbone halfback does, so the kick-out block has</text>
<text x="18" y="876" font-size="12" fill="#111318">to hold a beat longer. Drill it on a count.</text>
<text x="18" y="892" font-size="12" fill="#111318">The pulling guard stays flat and tight to the line. Bellying back is what makes this</text>
<text x="18" y="910" font-size="12" fill="#111318">play late.</text>
<text x="18" y="926" font-size="12" fill="#111318">If the pulling guard cannot get there in time, run I Iso instead — it needs no</text>
<text x="18" y="944" font-size="12" fill="#111318">pullers.</text>
</svg>