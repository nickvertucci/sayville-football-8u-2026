<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LE</text>
<text x="52" y="578" font-size="12" fill="#111318">Cut off pursuit from behind. You are</text>
<text x="52" y="596" font-size="12" fill="#111318">the last one to the ball, so never quit</text>
<text x="52" y="612" font-size="12" fill="#111318">on the play.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block back. Take the first defender on</text>
<text x="52" y="646" font-size="12" fill="#111318">or inside you — nobody crosses your</text>
<text x="52" y="664" font-size="12" fill="#111318">face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">PULL RIGHT. Run flat behind the line</text>
<text x="52" y="698" font-size="12" fill="#111318">and turn up in the open gap between our</text>
<text x="52" y="714" font-size="12" fill="#111318">tackle and our end. Block the first</text>
<text x="52" y="732" font-size="12" fill="#111318">wrong-colored jersey you see.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="748" font-size="12" fill="#111318">You have the nose, head up on you.</text>
<text x="52" y="766" font-size="12" fill="#111318">Hands inside and do not let him cross</text>
<text x="52" y="782" font-size="12" fill="#111318">your face to the playside.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody is over you. Help the center</text>
<text x="52" y="816" font-size="12" fill="#111318">drive the nose for one count, then</text>
<text x="52" y="834" font-size="12" fill="#111318">climb to the middle linebacker.</text>
<text x="18" y="850" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="850" font-size="12" fill="#111318">The tackle is on your inside shoulder.</text>
<text x="52" y="868" font-size="12" fill="#111318">Block him down and seal him inside —</text>
<text x="52" y="884" font-size="12" fill="#111318">that is what opens the hole.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RE</text>
<text x="344" y="578" font-size="12" fill="#111318">Release inside off his outside shoulder</text>
<text x="344" y="596" font-size="12" fill="#111318">and take the playside linebacker. The</text>
<text x="344" y="612" font-size="12" fill="#111318">end over you is being kicked out —</text>
<text x="344" y="630" font-size="12" fill="#111318">leave him alone.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="646" font-size="12" fill="#111318">Release and screen the corner on your</text>
<text x="344" y="664" font-size="12" fill="#111318">side. Get in his way and stay there.</text>
<text x="310" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="680" font-size="12" fill="#111318">Reverse pivot, hand the ball to the</text>
<text x="344" y="698" font-size="12" fill="#111318">tailback deep, then carry out the</text>
<text x="344" y="714" font-size="12" fill="#111318">bootleg fake away from the play.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="732" font-size="12" fill="#111318">Kick out the end. Aim at his inside hip</text>
<text x="344" y="748" font-size="12" fill="#111318">and run through him — do not stop your</text>
<text x="344" y="766" font-size="12" fill="#111318">feet.</text>
<text x="310" y="782" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="782" font-size="12" fill="#111318">Take the handoff, press the outside hip</text>
<text x="344" y="800" font-size="12" fill="#111318">of our tackle, then turn up inside the</text>
<text x="344" y="816" font-size="12" fill="#111318">pulling guard. Be patient for one step,</text>
<text x="344" y="834" font-size="12" fill="#111318">then go.</text>
<line x1="18" y1="892" x2="603" y2="892" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="910" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="930" font-size="12" fill="#111318">Same down-block-and-kick-out rules as Bone Power. If the kids know one they know both</text>
<text x="18" y="946" font-size="12" fill="#111318">— say that out loud when you install it.</text>
<text x="18" y="964" font-size="12" fill="#111318">The tailback starts deeper than the wishbone halfback does, so the kick-out block has</text>
<text x="18" y="980" font-size="12" fill="#111318">to hold a beat longer. Drill it on a count.</text>
<text x="18" y="998" font-size="12" fill="#111318">The pulling guard stays flat and tight to the line. Bellying back is what makes this</text>
<text x="18" y="1014" font-size="12" fill="#111318">play late.</text>
<text x="18" y="1032" font-size="12" fill="#111318">If the pulling guard cannot get there in time, run I Iso instead — it needs no</text>
<text x="18" y="1048" font-size="12" fill="#111318">pullers.</text>
</svg>