</g></g>
<line x1="18" y1="540" x2="684" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">X</text>
<text x="52" y="578" font-size="12" fill="#111318">Defensive end head up on you. Cut him off —</text>
<text x="52" y="596" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="612" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="612" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="630" font-size="12" fill="#111318">tackle on you. Hands inside, pads under his,</text>
<text x="52" y="646" font-size="12" fill="#111318">drive him back.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="664" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="680" font-size="12" fill="#111318">downfield and get the left inside linebacker.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="698" font-size="12" fill="#111318">O — your gap is empty, so take the nose on</text>
<text x="52" y="714" font-size="12" fill="#111318">you. Hands inside, pads under his, drive him</text>
<text x="52" y="732" font-size="12" fill="#111318">back.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">D — nothing in your gap and nobody on you. Go</text>
<text x="52" y="766" font-size="12" fill="#111318">downfield and get the right inside linebacker.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">O — your gap is empty, so take the defensive</text>
<text x="52" y="800" font-size="12" fill="#111318">tackle on you. Hands inside, pads under his,</text>
<text x="52" y="816" font-size="12" fill="#111318">drive him back.</text>
<text x="351" y="578" font-size="12" font-weight="700" fill="#111318">Y</text>
<text x="385" y="578" font-size="12" fill="#111318">Defensive end head up on you. Turn him inside.</text>
<text x="385" y="596" font-size="12" fill="#111318">The ball goes around behind you.</text>
<text x="351" y="612" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="385" y="612" font-size="12" fill="#111318">At the snap run flat across the backfield,</text>
<text x="385" y="630" font-size="12" fill="#111318">take the handoff at full speed and get to the</text>
<text x="385" y="646" font-size="12" fill="#111318">right edge. Turn up in the alley behind the</text>
<text x="385" y="664" font-size="12" fill="#111318">fullback.</text>
<text x="351" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="385" y="680" font-size="12" fill="#111318">Hand the ball to the slot as he runs past you,</text>
<text x="385" y="698" font-size="12" fill="#111318">then fake the handoff to the tailback going</text>
<text x="385" y="714" font-size="12" fill="#111318">left.</text>
<text x="351" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="385" y="732" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="748" font-size="12" fill="#111318">the linebacker with the tailback.</text>
<text x="351" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="385" y="766" font-size="12" fill="#111318">Bubble out around our end, then double team</text>
<text x="385" y="782" font-size="12" fill="#111318">the linebacker with the fullback.</text>
<line x1="18" y1="824" x2="684" y2="824" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="842" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="862" font-size="12" fill="#111318">The slot runs flat and fast across the backfield. The handoff is at full speed, so the quarterback</text>
<text x="18" y="878" font-size="12" fill="#111318">just puts it in his belly.</text>
<text x="18" y="896" font-size="12" fill="#111318">After the handoff the quarterback carries out his fake to the tailback going left. It is what holds</text>
<text x="18" y="912" font-size="12" fill="#111318">the backside.</text>
<text x="18" y="930" font-size="12" fill="#111318">The fullback bubbles out ahead of the slot and takes the corner. The slot stays behind him and turns</text>
<text x="18" y="946" font-size="12" fill="#111318">up in the alley.</text>
</svg>