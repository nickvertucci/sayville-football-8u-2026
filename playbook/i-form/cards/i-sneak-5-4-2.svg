<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="596" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="612" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="630" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="646" font-size="12" fill="#111318">block.</text>
<text x="18" y="664" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="664" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="680" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="698" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="714" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="732" font-size="12" fill="#111318">block.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="748" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="766" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="782" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="800" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="816" font-size="12" fill="#111318">block.</text>
<text x="18" y="834" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="834" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="850" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="868" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="884" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="902" font-size="12" fill="#111318">block. One yard is all we need and it</text>
<text x="52" y="918" font-size="12" fill="#111318">comes from you.</text>
<text x="18" y="936" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="936" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="952" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="970" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="986" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="1004" font-size="12" fill="#111318">block.</text>
<text x="18" y="1020" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="1020" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="52" y="1038" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="52" y="1054" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="52" y="1072" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="52" y="1088" font-size="12" fill="#111318">block.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="331" y="596" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="331" y="612" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="331" y="630" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="331" y="646" font-size="12" fill="#111318">block.</text>
<text x="297" y="664" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="331" y="664" font-size="12" fill="#111318">Release straight downfield and run</text>
<text x="331" y="680" font-size="12" fill="#111318">the corner off. You will not get the</text>
<text x="331" y="698" font-size="12" fill="#111318">ball — take his eyes with you so he</text>
<text x="331" y="714" font-size="12" fill="#111318">never looks in.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="732" font-size="12" fill="#111318">Snap it and go now, right behind the</text>
<text x="331" y="748" font-size="12" fill="#111318">outside hip of the guard on the Z</text>
<text x="331" y="766" font-size="12" fill="#111318">side. Low pads, ball in both arms,</text>
<text x="331" y="782" font-size="12" fill="#111318">fall forward. Do not stand up and do</text>
<text x="331" y="800" font-size="12" fill="#111318">not look for a hole.</text>
<text x="297" y="816" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="816" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="331" y="834" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="331" y="850" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="331" y="868" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="331" y="884" font-size="12" fill="#111318">block. Fire into the back of the pile</text>
<text x="331" y="902" font-size="12" fill="#111318">and push. Both hands on whoever is in</text>
<text x="331" y="918" font-size="12" fill="#111318">front of you.</text>
<text x="297" y="936" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="936" font-size="12" fill="#111318">Close down until your shoulder</text>
<text x="331" y="952" font-size="12" fill="#111318">touches the man beside you, then push</text>
<text x="331" y="970" font-size="12" fill="#111318">straight ahead. Low pads, short</text>
<text x="331" y="986" font-size="12" fill="#111318">steps, and never look for someone to</text>
<text x="331" y="1004" font-size="12" fill="#111318">block. Come downhill behind the</text>
<text x="331" y="1020" font-size="12" fill="#111318">fullback and push the pile. If the</text>
<text x="331" y="1038" font-size="12" fill="#111318">ball comes loose you are the closest</text>
<text x="331" y="1054" font-size="12" fill="#111318">man to it.</text>
<line x1="18" y1="1096" x2="576" y2="1096" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="1114" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="1134" font-size="12" fill="#111318">This is a one-yard play. Do not call it needing two.</text>
<text x="18" y="1150" font-size="12" fill="#111318">The snap count is the whole play. If they know it is coming they still cannot</text>
<text x="18" y="1168" font-size="12" fill="#111318">stop it, but only if we go on the first sound and they do not.</text>
<text x="18" y="1184" font-size="12" fill="#111318">Expect the heaviest front the league allows on fourth and one. Nobody blocks a</text>
<text x="18" y="1202" font-size="12" fill="#111318">man on this play, so it does not change the call.</text>
<text x="18" y="1218" font-size="12" fill="#111318">Teach the quarterback to fall forward the moment he feels contact.</text>
<text x="18" y="1236" font-size="12" fill="#111318">Eight-year-olds try to spin and lose the yard they already had.</text>
<text x="18" y="1252" font-size="12" fill="#111318">It is legal for us in 11-man play. It is specifically prohibited in the 8-man</text>
<text x="18" y="1270" font-size="12" fill="#111318">Rookie division, so if we ever end up there this play comes straight out of the</text>
<text x="18" y="1286" font-size="12" fill="#111318">book.</text>
</svg>