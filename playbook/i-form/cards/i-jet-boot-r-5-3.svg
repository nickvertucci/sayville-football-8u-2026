<line x1="18" y1="540" x2="603" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="52" y="596" font-size="12" fill="#111318">then release and get across the field</text>
<text x="52" y="612" font-size="12" fill="#111318">to eight yards. You are the second look</text>
<text x="52" y="630" font-size="12" fill="#111318">and you arrive late on purpose.</text>
<text x="18" y="646" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="646" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="664" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="680" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="698" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="698" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="714" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="732" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="732" font-size="12" fill="#111318">Nose head up on you. Cut him off — get</text>
<text x="52" y="748" font-size="12" fill="#111318">between him and the ball.</text>
<text x="18" y="766" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="766" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="782" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="800" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="800" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="816" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="310" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="344" y="578" font-size="12" fill="#111318">Engage the end over you for a count,</text>
<text x="344" y="596" font-size="12" fill="#111318">then release to the flat at four yards</text>
<text x="344" y="612" font-size="12" fill="#111318">and stay in front of the quarterback.</text>
<text x="344" y="630" font-size="12" fill="#111318">You are the easy throw.</text>
<text x="310" y="646" font-size="12" font-weight="700" fill="#111318">Z</text>
<text x="344" y="646" font-size="12" fill="#111318">Run the Jet motion exactly the way you</text>
<text x="344" y="664" font-size="12" fill="#111318">run it for real — start on the same</text>
<text x="344" y="680" font-size="12" fill="#111318">call, full speed, flat across. Keep</text>
<text x="344" y="698" font-size="12" fill="#111318">going after the fake. You are the</text>
<text x="344" y="714" font-size="12" fill="#111318">reason this play is open.</text>
<text x="310" y="732" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="344" y="732" font-size="12" fill="#111318">Fake the jet handoff and boot the other</text>
<text x="344" y="748" font-size="12" fill="#111318">way, ball hidden on your back hip. Run</text>
<text x="344" y="766" font-size="12" fill="#111318">it if it is open. Only throw if a</text>
<text x="344" y="782" font-size="12" fill="#111318">defender comes up to take you.</text>
<text x="310" y="800" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="344" y="800" font-size="12" fill="#111318">Fill like Wedge is coming, then take</text>
<text x="344" y="816" font-size="12" fill="#111318">anyone chasing from inside.</text>
<text x="310" y="834" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="344" y="834" font-size="12" fill="#111318">Run the Power path right, then protect</text>
<text x="344" y="850" font-size="12" fill="#111318">the outside. Anyone chasing him is</text>
<text x="344" y="868" font-size="12" fill="#111318">yours.</text>
<line x1="18" y1="874" x2="603" y2="874" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="892" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="912" font-size="12" fill="#111318">Do not call this until Jet Left has been run for real and hurt them. The motion is</text>
<text x="18" y="930" font-size="12" fill="#111318">only a lie if it has been the truth.</text>
<text x="18" y="946" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes the</text>
<text x="18" y="964" font-size="12" fill="#111318">fake dies and the flat defender is already waiting.</text>
<text x="18" y="980" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach him</text>
<text x="18" y="998" font-size="12" fill="#111318">to be patient and look up.</text>
<text x="18" y="1014" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="1032" font-size="12" fill="#111318">finds him — the throw is the second choice, not the plan.</text>
<text x="18" y="1048" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>