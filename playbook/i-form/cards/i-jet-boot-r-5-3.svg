<line x1="18" y1="540" x2="576" y2="540" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="560" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">ASSIGNMENTS</text>
<text x="18" y="578" font-size="12" font-weight="700" fill="#111318">LTE</text>
<text x="52" y="578" font-size="12" fill="#111318">Bump the end, then cross the field to</text>
<text x="52" y="596" font-size="12" fill="#111318">eight yards. Second look, late on</text>
<text x="52" y="612" font-size="12" fill="#111318">purpose.</text>
<text x="18" y="630" font-size="12" font-weight="700" fill="#111318">LT</text>
<text x="52" y="630" font-size="12" fill="#111318">Block down on the tackle, inside</text>
<text x="52" y="646" font-size="12" fill="#111318">shoulder. Head across him — nobody</text>
<text x="52" y="664" font-size="12" fill="#111318">crosses your face.</text>
<text x="18" y="680" font-size="12" font-weight="700" fill="#111318">LG</text>
<text x="52" y="680" font-size="12" fill="#111318">Nobody on you. Climb to the playside</text>
<text x="52" y="698" font-size="12" fill="#111318">linebacker. Head across him.</text>
<text x="18" y="714" font-size="12" font-weight="700" fill="#111318">C</text>
<text x="52" y="714" font-size="12" fill="#111318">Nose head up on you. Cut him off —</text>
<text x="52" y="732" font-size="12" fill="#111318">get between him and the ball.</text>
<text x="18" y="748" font-size="12" font-weight="700" fill="#111318">RG</text>
<text x="52" y="748" font-size="12" fill="#111318">Nobody on you. Help on the nose, then</text>
<text x="52" y="766" font-size="12" fill="#111318">take the middle linebacker.</text>
<text x="18" y="782" font-size="12" font-weight="700" fill="#111318">RT</text>
<text x="52" y="782" font-size="12" fill="#111318">Hinge back and protect the outside.</text>
<text x="52" y="800" font-size="12" fill="#111318">Nobody gets past you.</text>
<text x="297" y="578" font-size="12" font-weight="700" fill="#111318">RTE</text>
<text x="331" y="578" font-size="12" fill="#111318">Bump the end, then release to the</text>
<text x="331" y="596" font-size="12" fill="#111318">flat at four yards in front of the</text>
<text x="331" y="612" font-size="12" fill="#111318">quarterback.</text>
<text x="297" y="630" font-size="12" font-weight="700" fill="#111318">SL</text>
<text x="331" y="630" font-size="12" fill="#111318">Run the Jet motion for real: same</text>
<text x="331" y="646" font-size="12" fill="#111318">call, full speed, flat across, never</text>
<text x="331" y="664" font-size="12" fill="#111318">stopping.</text>
<text x="297" y="680" font-size="12" font-weight="700" fill="#111318">QB</text>
<text x="331" y="680" font-size="12" fill="#111318">Fake the jet, hide it on your back</text>
<text x="331" y="698" font-size="12" fill="#111318">hip, boot the other way. Throw only</text>
<text x="331" y="714" font-size="12" fill="#111318">when they take you.</text>
<text x="297" y="732" font-size="12" font-weight="700" fill="#111318">FB</text>
<text x="331" y="732" font-size="12" fill="#111318">Fill like Wedge is coming, then take</text>
<text x="331" y="748" font-size="12" fill="#111318">anyone chasing from inside.</text>
<text x="297" y="766" font-size="12" font-weight="700" fill="#111318">TB</text>
<text x="331" y="766" font-size="12" fill="#111318">Run the Power path right, then</text>
<text x="331" y="782" font-size="12" fill="#111318">protect the outside. Anyone chasing</text>
<text x="331" y="800" font-size="12" fill="#111318">him is yours.</text>
<line x1="18" y1="806" x2="576" y2="806" stroke="#c8cdd6" stroke-width="1"/>
<text x="18" y="824" font-size="11" font-weight="700" fill="#5b6472" letter-spacing="1">COACHING POINTS</text>
<text x="18" y="844" font-size="12" fill="#111318">Do not call this until Jet Left has been run for real and hurt them. The motion</text>
<text x="18" y="862" font-size="12" fill="#111318">is only a lie if it has been the truth.</text>
<text x="18" y="878" font-size="12" fill="#111318">Both ends must engage before releasing. If they run straight into their routes</text>
<text x="18" y="896" font-size="12" fill="#111318">the fake dies and the flat defender is already waiting.</text>
<text x="18" y="912" font-size="12" fill="#111318">No blitzing is allowed for 8- and 9-year-olds, so the quarterback has time. Teach</text>
<text x="18" y="930" font-size="12" fill="#111318">him to be patient and look up.</text>
<text x="18" y="946" font-size="12" fill="#111318">Run first. At this age the quarterback usually walks into ten yards before anyone</text>
<text x="18" y="964" font-size="12" fill="#111318">finds him — the throw is the second choice, not the plan.</text>
<text x="18" y="980" font-size="12" fill="#111318">One throw, then tuck it. No scrambling backwards, ever.</text>
</svg>